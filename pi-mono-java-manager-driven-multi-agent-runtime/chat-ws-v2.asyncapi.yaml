          type: array
          items:
            $ref: '#/components/schemas/SkillSummary'
    SuccessPayload:
      oneOf:
        - $ref: '#/components/schemas/ConnectResult'
        - $ref: '#/components/schemas/ChatSendResult'
        - $ref: '#/components/schemas/ChatSteerResult'
        - $ref: '#/components/schemas/ChatAbortResult'
        - $ref: '#/components/schemas/HistoryResult'
        - $ref: '#/components/schemas/SessionGetResult'
        - $ref: '#/components/schemas/ModelsListResult'
        - $ref: '#/components/schemas/ModelSetResult'
        - $ref: '#/components/schemas/ThinkingSetResult'
        - $ref: '#/components/schemas/PromptTemplatesListResult'
        - $ref: '#/components/schemas/SkillsListResult'
    ErrorCode:
      type: string
      minLength: 1
      maxLength: 128
      description: |
        当前稳定错误码如下。调用方必须为未知字符串保留 UNKNOWN 分支；新增
        可恢复错误码不改变 Frame 结构，不能导致客户端反序列化失败。
      x-known-values:
        - INVALID_REQUEST
        - UNAUTHENTICATED
        - FORBIDDEN
        - UNSUPPORTED_PROTOCOL
        - AGENT_NOT_FOUND
        - SESSION_NOT_FOUND
        - MODEL_REQUIRED
        - MODEL_NOT_ALLOWED
        - RUN_ACTIVE
        - RUN_NOT_FOUND
        - INVALID_ATTACHMENT
        - MANAGER_AUTH_FAILED
        - MANAGER_UNAVAILABLE
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          minLength: 1
          maxLength: 2048
        details:
          type: object
          additionalProperties: true
        retryable:
          type: boolean
          default: false
          description: 省略等价于 false；只说明同一业务操作是否适合稍后重试。
        retry_after_ms:
          type: integer
          minimum: 0
          description: 仅当 retryable=true 时有效；副作用请求仍必须复用原 idempotency_key。
    SuccessResponseFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - ok
        - payload
      properties:
        type:
          const: res
        id:
          $ref: '#/components/schemas/RequestId'
        ok:
          type: boolean
          const: true
        payload:
          $ref: '#/components/schemas/SuccessPayload'
    ErrorResponseFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - ok
        - error
      properties:
        type:
          const: res
        id:
          $ref: '#/components/schemas/RequestId'
        ok:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/Error'
    AnyResponseFrame:
      oneOf:
        - $ref: '#/components/schemas/SuccessResponseFrame'
        - $ref: '#/components/schemas/ErrorResponseFrame'
    RunStartedPayload:
      type: object
      additionalProperties: false
      required:
        - agent_id
        - session_id
        - run_id
        - run_seq
        - timestamp
        - model_id
        - thinking
      properties:
        agent_id:
          $ref: '#/components/schemas/AgentId'
        session_id:
          $ref: '#/components/schemas/SessionId'
        run_id:
          $ref: '#/components/schemas/RunId'
        run_seq:
          type: integer
          minimum: 1
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        model_id:
          $ref: '#/components/schemas/ModelId'
        thinking:
          $ref: '#/components/schemas/ThinkingLevel'
          description: 该 run 在当前连接上的冻结有效 thinking 投影；恢复快照必须返回相同语义。
    MessageStartedPayload:
      type: object
      additionalProperties: false
      required:
        - agent_id
        - session_id
        - run_id
        - message_id
        - run_seq
        - timestamp
        - role
      properties:
        agent_id:
          $ref: '#/components/schemas/AgentId'
        session_id:
          $ref: '#/components/schemas/SessionId'
        run_id:
          $ref: '#/components/schemas/RunId'
        message_id:
          $ref: '#/components/schemas/MessageId'
        run_seq:
          type: integer
          minimum: 1
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        role:
          type: string
          enum:
            - assistant
    TextStartUpdate:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          const: text_start
    TextDeltaUpdate:
      type: object
      additionalProperties: false
      required:
        - type
        - delta
      properties:
        type:
          const: text_delta
        delta:
          type: string
          minLength: 1
    TextEndUpdate:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          const: text_end
    ThinkingStartUpdate:
      type: object
      additionalProperties: false
      required:
        - type
        - disclosure
      properties:
        type:
          const: thinking_start
        disclosure:
          type: string
          enum:
            - hidden
            - summary
            - full
          description: 当前连接对该 thinking 块的有效投影级别。
    ThinkingDeltaUpdate:
      type: object
      additionalProperties: false
      description: |
        只在当前连接对 run 的投影级别为 full 且有效 capability 包含
        full_thinking 时发送。summary/hidden 连接在同一 run_seq 位置收到
        thinking_redacted，使 run_seq 在不同投影中仍保持稳定连续。
      required:
        - type
        - delta
      properties:
        type:
          const: thinking_delta
        delta:
          type: string
          minLength: 1
    ThinkingSummaryUpdate:
      type: object
      additionalProperties: false
      description: |
        只在 disclosure=summary 的投影中发送，每个 thinking 块最多一次。summary
        是当前块的完整安全摘要，客户端以它替换当前摘要，不做字符串追加。
        full/hidden 连接在同一 run_seq 位置收到 thinking_redacted。
      required:
        - type
        - summary
      properties:
        type:
          const: thinking_summary
        summary:
          type: string
          minLength: 1
    ThinkingRedactedUpdate:
      type: object
      additionalProperties: false
      required:
        - type
        - redacted_type
      properties:
        type:
          const: thinking_redacted
        redacted_type:
          type: string
          enum:
            - delta
            - summary
      description: |
        不含 thinking 内容的序列占位。服务端对每个被当前连接投影策略抑制的
        canonical thinking_delta 或 thinking_summary 发送一条，使所有观察
        连接看到相同的 run_seq 域。客户端只推进序列，不创建可见正文。
    ThinkingEndUpdate:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          const: thinking_end
    ToolCallStartUpdate:
      type: object
      additionalProperties: false
      required:
        - type
        - tool_call_id
        - tool_id
      properties:
        type:
          const: toolcall_start
        tool_call_id:
          $ref: '#/components/schemas/ToolCallId'
        tool_id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
          minLength: 1
          maxLength: 256
    ToolCallDeltaUpdate:
      type: object
      additionalProperties: false
      required:
        - type
        - tool_call_id
        - delta
      properties:
        type:
          const: toolcall_delta
        tool_call_id:
          $ref: '#/components/schemas/ToolCallId'
        delta:
          type: string
          minLength: 1
          description: |
            Tool arguments 的 JSON 文本片段，本次片段可能不是合法 JSON。客户端只
            追加保存，不逐帧解析；toolcall_end.arguments 是权威完整对象。
    ToolCallEndUpdate:
      type: object
      additionalProperties: false
      required:
        - type
        - tool_call_id
        - arguments
      properties:
        type:
          const: toolcall_end
        tool_call_id:
          $ref: '#/components/schemas/ToolCallId'
        arguments:
          type: object
          additionalProperties: true
    AssistantMessageUpdate:
      oneOf:
        - $ref: '#/components/schemas/TextStartUpdate'
        - $ref: '#/components/schemas/TextDeltaUpdate'
        - $ref: '#/components/schemas/TextEndUpdate'
        - $ref: '#/components/schemas/ThinkingStartUpdate'
        - $ref: '#/components/schemas/ThinkingDeltaUpdate'
        - $ref: '#/components/schemas/ThinkingSummaryUpdate'
        - $ref: '#/components/schemas/ThinkingRedactedUpdate'
        - $ref: '#/components/schemas/ThinkingEndUpdate'
        - $ref: '#/components/schemas/ToolCallStartUpdate'
        - $ref: '#/components/schemas/ToolCallDeltaUpdate'
        - $ref: '#/components/schemas/ToolCallEndUpdate'
    MessageUpdatedPayload:
      type: object
      additionalProperties: false
      description: |
        content_index 在同一 message_id 内标识最终 content 数组位置。每个位置
        遵循匹配类型的 start -> update* -> end；Thinking update 可以是 delta、
        一次 summary 或不含内容的 redacted 占位。不同位置可以交错。客户端先按
        run_seq 去重和检查缺口，再应用 update。快照 open_contents 可以初始化
        一个在重连前已经 start 的位置，因此快照后的第一帧可以直接是 delta。
      required:
        - agent_id
        - session_id
        - run_id
        - message_id
        - run_seq
        - content_index
        - timestamp
        - update
      properties:
        agent_id:
          $ref: '#/components/schemas/AgentId'
        session_id:
          $ref: '#/components/schemas/SessionId'
        run_id:
          $ref: '#/components/schemas/RunId'
        message_id:
          $ref: '#/components/schemas/MessageId'
        run_seq:
          type: integer
          minimum: 1
        content_index:
          type: integer
          minimum: 0
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        update:
          $ref: '#/components/schemas/AssistantMessageUpdate'
    ToolStartedPayload:
      type: object
      additionalProperties: false
      required:
        - agent_id
        - session_id
        - run_id
        - run_seq
        - timestamp
        - tool_call_id
        - tool_id
      properties:
        agent_id:
          $ref: '#/components/schemas/AgentId'
        session_id:
          $ref: '#/components/schemas/SessionId'
        run_id:
          $ref: '#/components/schemas/RunId'
        run_seq:
          type: integer
          minimum: 1
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        tool_call_id:
          $ref: '#/components/schemas/ToolCallId'
        tool_id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
        input:
          type: object
          additionalProperties: true
    ToolUpdatedPayload:
      type: object
      additionalProperties: false
      required:
        - agent_id
        - session_id
        - run_id
        - run_seq
        - timestamp
        - tool_call_id
        - tool_id
        - update
      properties:
        agent_id:
          $ref: '#/components/schemas/AgentId'
        session_id:
          $ref: '#/components/schemas/SessionId'
        run_id:
          $ref: '#/components/schemas/RunId'
        run_seq:
          type: integer
          minimum: 1
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        tool_call_id:
          $ref: '#/components/schemas/ToolCallId'
        tool_id:
          $ref: '#/components/schemas/Identifier'
        update:
          $ref: '#/components/schemas/ToolProgressUpdate'
    ToolProgressUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        message:
          type: string
          maxLength: 4096
        progress:
          type: number
          minimum: 0
          maximum: 1
        data: {}
    ToolCompletedPayload:
      type: object
      additionalProperties: false
      required:
        - agent_id
        - session_id
        - run_id
        - run_seq
        - timestamp
        - tool_call_id
        - tool_id
        - status
      properties:
        agent_id:
          $ref: '#/components/schemas/AgentId'
        session_id:
          $ref: '#/components/schemas/SessionId'
        run_id:
          $ref: '#/components/schemas/RunId'
        run_seq:
          type: integer
          minimum: 1
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        tool_call_id:
          $ref: '#/components/schemas/ToolCallId'
        tool_id:
          $ref: '#/components/schemas/Identifier'
        status:
          type: string
          enum:
            - done
            - error
            - aborted
        result: {}
        error:
          $ref: '#/components/schemas/Error'
      allOf:
        - if:
            properties:
              status:
                const: done
            required:
              - status
          then:
            required:
              - result
            not:
              required:
                - error
        - if:
            properties:
              status:
                const: error
            required:
              - status
          then:
            required:
              - error
            not:
              required:
                - result
        - if:
            properties:
              status:
                const: aborted
            required:
              - status
          then:
            not:
              anyOf:
                - required:
                    - result
                - required:
                    - error
    MessageCompletedPayload:
      type: object
      additionalProperties: false
      description: |
        如果同一 message_id 已发送 message.started，则本事件恰好出现一次，并
        在 run.completed 之前发送。外层 message_id 必须等于 message.message_id；
        客户端以 message 完整替换本地流式组装结果。
      required:
        - agent_id
        - session_id
        - run_id
        - message_id
        - run_seq
        - timestamp
        - message
      properties:
        agent_id:
          $ref: '#/components/schemas/AgentId'
        session_id:
          $ref: '#/components/schemas/SessionId'
        run_id:
          $ref: '#/components/schemas/RunId'
        message_id:
          $ref: '#/components/schemas/MessageId'
        run_seq:
          type: integer
          minimum: 1
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        message:
          $ref: '#/components/schemas/TerminalProjectedMessage'
    Usage:
      type: object
      additionalProperties: false
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        cached_input_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
    RunCompletedPayload:
      type: object
      additionalProperties: false
      description: |
        每个 run_id 恰好发送一次，是该 run 的最后一个事件。outcome=error 时
        必须携带 error；outcome=done 或 aborted 时不得携带 error。它之后不得再出现相同
        run_id 的 EventFrame。
      required:
        - agent_id
        - session_id
        - run_id
        - run_seq
        - timestamp
        - outcome
      properties:
        agent_id:
          $ref: '#/components/schemas/AgentId'
        session_id:
          $ref: '#/components/schemas/SessionId'
        run_id:
          $ref: '#/components/schemas/RunId'
        run_seq:
          type: integer
          minimum: 1
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        outcome:
          type: string
          enum:
            - done
            - aborted
            - error
        usage:
          $ref: '#/components/schemas/Usage'
        stop_reason:
          type: string
          maxLength: 256
        error:
          $ref: '#/components/schemas/Error'
      allOf:
        - if:
            properties:
              outcome:
                const: error
            required:
              - outcome
          then:
            required:
              - error
        - if:
            properties:
              outcome:
                enum:
                  - done
                  - aborted
            required:
              - outcome
          then:
            not:
              required:
                - error
    RunStartedEvent:
      type: object
      additionalProperties: false
      required:
        - type
        - event
        - seq
        - payload
      properties:
        type:
          const: event
        event:
          const: run.started
        seq:
          type: integer
          minimum: 1
        payload:
          $ref: '#/components/schemas/RunStartedPayload'
    MessageStartedEvent:
      type: object
      additionalProperties: false
      required:
        - type
        - event
        - seq
        - payload
      properties:
        type:
          const: event
        event:
          const: message.started
        seq:
          type: integer
          minimum: 1
        payload:
          $ref: '#/components/schemas/MessageStartedPayload'
    MessageUpdatedEvent:
      type: object
      additionalProperties: false
      required:
        - type
        - event
        - seq
        - payload
      properties:
        type:
          const: event
        event:
          const: message.updated
        seq:
          type: integer
          minimum: 1
        payload:
          $ref: '#/components/schemas/MessageUpdatedPayload'
    ToolStartedEvent:
      type: object
      additionalProperties: false
      required:
        - type
        - event
        - seq
        - payload
      properties:
        type:
          const: event
        event:
          const: tool.started
        seq:
          type: integer
          minimum: 1
        payload:
          $ref: '#/components/schemas/ToolStartedPayload'
    ToolUpdatedEvent:
      type: object
      additionalProperties: false
      required:
        - type
        - event
        - seq
        - payload
      properties:
        type:
          const: event
        event:
          const: tool.updated
        seq:
          type: integer
          minimum: 1
        payload:
          $ref: '#/components/schemas/ToolUpdatedPayload'
    ToolCompletedEvent:
      type: object
      additionalProperties: false
      required:
        - type
        - event
        - seq
        - payload
      properties:
        type:
          const: event
        event:
          const: tool.completed
        seq:
          type: integer
          minimum: 1
        payload:
          $ref: '#/components/schemas/ToolCompletedPayload'
    MessageCompletedEvent:
      type: object
      additionalProperties: false
      required:
        - type
        - event
        - seq
        - payload
      properties:
        type:
          const: event
        event:
          const: message.completed
        seq:
          type: integer
          minimum: 1
        payload:
          $ref: '#/components/schemas/MessageCompletedPayload'
    RunCompletedEvent:
      type: object
      additionalProperties: false
      required:
        - type
        - event
        - seq
        - payload
      properties:
        type:
          const: event
        event:
          const: run.completed
        seq:
          type: integer
          minimum: 1
        payload:
          $ref: '#/components/schemas/RunCompletedPayload'
    AnyEventFrame:
      description: |
        同一连接的第一条 EventFrame.seq 为 1，之后每成功写出一条事件恰好加 1；
        ResponseFrame 不占用 seq，重连后从 1 重新开始。run_seq 从 run.started
        的 1 开始，对同一 run 的全部 Message 和 Tool 事件恰好加 1，并跨重连
        连续。重复、倒退或跳号都不能继续猜测归并：客户端停止应用当前流并
        通过 mode=resume 取得新快照。

        生命周期约束为 run.started 最先、run.completed 最后。一个 run 可以
        包含多个 Message 和 Tool 周期；message.started 必须早于同一 message_id
        的 updated/completed，tool.started 必须早于同一 tool_call_id 的
        updated/completed。已经 start 的 Message 即使因 abort/error 结束，也要
        在 run.completed 前发送一次终态 message.completed。每个已发送
        tool.started 的 tool_call_id 也必须在 run.completed 前恰好发送一次
        tool.completed；run abort 时尚未结束的 Tool 使用 status=aborted。

        run_seq 属于 canonical run 事件域，不因连接的 thinking 投影而变化。
        当 canonical thinking delta 或 summary 不允许向某连接披露时，该连接
        仍在相同 run_seq 位置收到不含内容的 thinking_redacted，因此多观察者
        和重连前后的 run_seq 都连续且可比较。
      oneOf:
        - $ref: '#/components/schemas/RunStartedEvent'
        - $ref: '#/components/schemas/MessageStartedEvent'
        - $ref: '#/components/schemas/MessageUpdatedEvent'
        - $ref: '#/components/schemas/ToolStartedEvent'
        - $ref: '#/components/schemas/ToolUpdatedEvent'
        - $ref: '#/components/schemas/ToolCompletedEvent'
        - $ref: '#/components/schemas/MessageCompletedEvent'
        - $ref: '#/components/schemas/RunCompletedEvent'
x-method-contracts:
  description: |
    RequestFrame.id 关联到下列 method 和成功 payload。调用方应在 pending map 中
    保存该映射，而不是根据 payload 形状猜测响应类型。连接成功后允许多个普通
    请求并发 in-flight，ResponseFrame 可以乱序并与 EventFrame 交错。
    这是 CampusClaw 的规范性扩展；通用 AsyncAPI 生成器只能看到泛化 Frame
    oneOf。生成强类型 SDK 时必须使用理解本扩展的模板，或在 SDK 中手工保留
    下列 method -> payload decoder 映射；本文不声称零配置的通用代码生成。
  connect:
    requestSchema: '#/components/schemas/ConnectRequest'
    successPayloadSchema: '#/components/schemas/ConnectResult'
    errors: [INVALID_REQUEST, UNSUPPORTED_PROTOCOL, FORBIDDEN, AGENT_NOT_FOUND, SESSION_NOT_FOUND, MODEL_REQUIRED, MODEL_NOT_ALLOWED, MANAGER_AUTH_FAILED, MANAGER_UNAVAILABLE]
  chat.send:
