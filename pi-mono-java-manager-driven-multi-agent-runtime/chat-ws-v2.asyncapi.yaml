asyncapi: 3.1.0
id: urn:campusclaw:chat-websocket:v2
x-locale: zh-CN
info:
  title: CampusClaw 会话 WebSocket API
  version: 2.4.0
  description: |
    调用方使用 `wss://api.example.com/api/ws/chat` 请求建立安全 WebSocket。
    客户端库先建立 TCP/TLS 连接，再通过 HTTP opening handshake 协商切换
    协议；服务端返回 101 后，WebSocket 才正式建立。

    调用方必须在 101 后五秒内发送首个 `connect` RequestFrame。服务端根据
    `mode` 创建或恢复 `session_id` 对应的 Runtime Session，并校验
    `agent_id`、`model_id` 和可选 capabilities；成功后，这条连接在整个生命周期
    内固定绑定到对应的 `(agent_id, session_id)`。

    连接随后承载 RequestFrame、ResponseFrame 和 EventFrame。active run 由
    ManagedSessionPool 持有，因此连接断开只取消事件订阅，不终止正在进行的
    模型调用或工具执行。

    上层会话服务负责创建和管理 `session_id`，以及用户会话列表、数量限制和
    业务删除。CampusClaw 将 `session_id` 作为不透明的 Runtime Session 标识，
    不接收或维护 tenant_id、user_id。调用方提供的 `session_id` 必须在一个
    Runtime 部署范围内全局唯一，删除后不得复用。

    协议版本 2 固定使用 request/response/event Frame 和结构化消息增量，
    不通过 capability 协商其他累计 Message 格式，并直接替换 `/api/ws/chat`
    的 v1 格式。调用方不得通过业务查询参数或 URL token 传递身份及 Session
    信息，也不能在已绑定的连接内创建另一个 Session。

    实现调用方、请求关联、消息归并、断线恢复和错误处理时，先阅读同目录的
    `chat-ws-v2-client-integration.md`；字段和取值仍以本文件为规范来源。

    `https://api.example.com/api/ws/chat` 只是同一 host、port 和 path 的 HTTP
    握手视角，不是 RESTful API，也不表示第二条连接。
  contact:
    name: CampusClaw
    url: https://github.com/superheromeZzh/pi-mono-java
  license:
    name: MIT
defaultContentType: application/json
servers:
  production:
    host: api.example.com
    pathname: /api/ws/chat
    protocol: wss
    description: |
      调用服务按部署配置使用 Bearer 或 mTLS 建立服务身份。使用 Bearer 时，
      客户端库在 HTTP opening handshake 中发送 Authorization；使用 mTLS 时，
      客户端在此前的 TLS 握手中出示证书。服务端在返回 101 前完成认证，并
      拒绝业务查询参数、URL token 或缺少合法 Upgrade headers 的普通 HTTP
      请求。浏览器终端应连接上层会话服务，不直接连接本 Runtime。
    security:
      - $ref: '#/components/securitySchemes/bearerAuth'
      - $ref: '#/components/securitySchemes/mutualTLS'
  local:
    host: localhost:3000
    pathname: /api/ws/chat
    protocol: ws
    description: |
      开发客户端使用 `ws://localhost:3000/api/ws/chat` 建立连接。服务端只有在
      显式启用开发配置时才允许跳过认证；HTTP opening handshake、首帧
      `connect` 和后续 Frame 协议保持不变。
channels:
  sessionChat:
    address: /api/ws/chat
    title: 会话范围的对话通道
    description: |
      调用方完成 HTTP opening handshake 并收到 101 后，才可以在这条连接上
      传输 JSON Frame。调用方必须在五秒内发送 `connect` RequestFrame；服务端
      校验并绑定 Agent 和 Session 后，才接受其他 Session 命令。101 之前的失败
      使用 HTTP status，101 之后的失败使用 ResponseFrame、EventFrame 或
      WebSocket close code。连接绑定成功后不能更换 Agent 或 Session。
    messages:
      ClientRequestFrame:
        $ref: '#/components/messages/ClientRequestFrame'
      ServerResponseFrame:
        $ref: '#/components/messages/ServerResponseFrame'
      ServerEventFrame:
        $ref: '#/components/messages/ServerEventFrame'
operations:
  receiveRequest:
    action: receive
    channel:
      $ref: '#/channels/sessionChat'
    summary: CampusClaw 服务端先接收 connect RequestFrame；绑定成功后接收当前 Session 的命令请求。
    messages:
      - $ref: '#/channels/sessionChat/messages/ClientRequestFrame'
  sendResponseOrEvent:
    action: send
    channel:
      $ref: '#/channels/sessionChat'
    summary: CampusClaw 服务端为命令发送同 id 的 ResponseFrame，并按 seq 发送当前 Session 的有序事件。
    messages:
      - $ref: '#/channels/sessionChat/messages/ServerResponseFrame'
      - $ref: '#/channels/sessionChat/messages/ServerEventFrame'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        调用服务选择 Bearer 认证时，在 HTTP opening handshake 的
        Authorization 请求头中发送 Token。服务端在返回 101 前校验 Runtime
        audience 和所需 service scope；校验失败时拒绝 Upgrade。认证信息只
        用于建立连接认证上下文，不得复制到 Prompt、JSONL、协议事件或应用
        日志。Runtime 不从 Token 中建立或维护业务 tenant_id、user_id。
    mutualTLS:
      type: X509
      description: |
        部署启用 mTLS 时，调用服务在 TLS 握手阶段出示客户端证书；服务端验证
        证书后才处理 HTTP WebSocket opening handshake。mTLS 可以单独使用，
        也可以加强 Bearer 认证。证书身份只用于服务认证和审计，不参与
        Session key。
  messages:
    ClientRequestFrame:
      name: ClientRequestFrame
      title: 客户端请求 Frame
      description: 调用方使用首个 connect RequestFrame 建立应用级 Session 绑定，随后用相同 Frame 结构发送命令。
      correlationId:
        location: $message.payload#/id
      payload:
        $ref: '#/components/schemas/AnyRequestFrame'
      examples:
        - name: 新建会话
          payload:
            type: req
            id: connect-1
            method: connect
            params:
              mode: create
              min_protocol: 2
              max_protocol: 2
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              agent_id: agent-a
              model_id: model-a
              client:
                id: campusclaw-session-service
                version: 1.0.0
                platform: service
        - name: 恢复会话
          payload:
            type: req
            id: connect-2
            method: connect
            params:
              mode: resume
              min_protocol: 2
              max_protocol: 2
              agent_id: agent-a
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              client:
                id: campusclaw-sdk
                version: 1.0.0
                platform: sdk
              capabilities:
                - full_thinking
        - name: 发送用户消息
          payload:
            type: req
            id: send-1
            method: chat.send
            traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
            params:
              message: 查询订单 20260730001
              attachment_ids:
                - attachment-01
              idempotency_key: 6f46bc26-8a14-4d63-b7b1-8f1f933a0d50
              thinking: hidden
    ServerResponseFrame:
      name: ServerResponseFrame
      title: 关联命令响应
      description: 服务端为每个 RequestFrame 返回相同 id 的响应；成功时携带 payload，失败时携带 error。
      correlationId:
        location: $message.payload#/id
      payload:
        $ref: '#/components/schemas/AnyResponseFrame'
      examples:
        - name: 连接成功并返回 active run 快照
          payload:
            type: res
            id: connect-2
            ok: true
            payload:
              protocol: 2
              connection_id: conn-01
              agent_id: agent-a
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              model:
                model_id: model-a
                name: 模型 A
                reasoning: true
              session:
                state: running
                thinking: hidden
              limits:
                max_message_bytes: 1048576
                max_connection_buffer_bytes: 4194304
                heartbeat_seconds: 20
                pong_timeout_seconds: 10
                connect_timeout_seconds: 5
              features:
                methods:
                  - chat.send
                  - chat.steer
                  - chat.abort
                  - chat.history
                  - session.get
                  - models.list
                  - model.set
                  - thinking.set
                  - prompt_templates.list
                  - skills.list
                events:
                  - run.started
                  - message.started
                  - message.updated
                  - tool.started
                  - tool.updated
                  - tool.completed
                  - message.completed
                  - run.completed
                capabilities:
                  - full_thinking
              active_run:
                run_id: run-01
                run_seq: 14
                history_seq: 41
                model_id: model-a
                thinking: hidden
                message_snapshot:
                  message_id: message-01
                  role: assistant
                  status: streaming
                  content:
                    - type: text
                      text: 订单当前状态为
                  created_at: '2026-07-30T08:00:00Z'
                open_contents:
                  '0':
                    type: text
                active_tools: []
        - name: 发送消息已接受
          payload:
            type: res
            id: send-1
            ok: true
            payload:
              run_id: run-01
              user_message_id: message-user-01
              accepted: true
        - name: 读取权威历史
          payload:
            type: res
            id: history-1
            ok: true
            payload:
              items:
                - type: message
                  history_seq: 21
                  run_id: run-01
                  message:
                    message_id: message-01
                    role: assistant
                    status: completed
                    content:
                      - type: text
                        text: 已发货
                    created_at: '2026-07-30T08:00:00Z'
                    completed_at: '2026-07-30T08:00:02Z'
                - type: run
                  history_seq: 22
                  run:
                    run_id: run-01
                    outcome: done
                    completed_at: '2026-07-30T08:00:03Z'
              has_more: false
        - name: active run 冲突
          payload:
            type: res
            id: send-2
            ok: false
            error:
              code: RUN_ACTIVE
              message: 当前 Session 已存在 active run。
              retryable: true
    ServerEventFrame:
      name: ServerEventFrame
      title: 有序 Session 事件
      description: 服务端在 Session 绑定成功后主动发送事件；调用方用连接级 seq 和 Run 级 run_seq 检测顺序与恢复位置。
      payload:
        $ref: '#/components/schemas/AnyEventFrame'
      examples:
        - name: 1 run 开始
          payload:
            type: event
            event: run.started
            seq: 1
            payload:
              agent_id: agent-a
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              run_id: run-01
              run_seq: 1
              timestamp: '2026-07-30T08:00:00Z'
              model_id: model-a
              thinking: hidden
        - name: 2 Assistant Message 开始
          payload:
            type: event
            event: message.started
            seq: 2
            payload:
              agent_id: agent-a
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              run_id: run-01
              message_id: message-01
              run_seq: 2
              timestamp: '2026-07-30T08:00:00Z'
              role: assistant
        - name: 3 文本块开始
          payload:
            type: event
            event: message.updated
            seq: 3
            payload:
              agent_id: agent-a
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              run_id: run-01
              message_id: message-01
              run_seq: 3
              content_index: 0
              timestamp: '2026-07-30T08:00:01Z'
              update:
                type: text_start
        - name: 4 文本增量
          payload:
            type: event
            event: message.updated
            seq: 4
            payload:
              agent_id: agent-a
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              run_id: run-01
              message_id: message-01
              run_seq: 4
              content_index: 0
              timestamp: '2026-07-30T08:00:01Z'
              update:
                type: text_delta
                delta: 已发货
        - name: 5 文本块结束
          payload:
            type: event
            event: message.updated
            seq: 5
            payload:
              agent_id: agent-a
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              run_id: run-01
              message_id: message-01
              run_seq: 5
              content_index: 0
              timestamp: '2026-07-30T08:00:02Z'
              update:
                type: text_end
        - name: 6 Message 完成
          payload:
            type: event
            event: message.completed
            seq: 6
            payload:
              agent_id: agent-a
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              run_id: run-01
              message_id: message-01
              run_seq: 6
              timestamp: '2026-07-30T08:00:02Z'
              message:
                message_id: message-01
                role: assistant
                status: completed
                content:
                  - type: text
                    text: 已发货
                created_at: '2026-07-30T08:00:00Z'
                completed_at: '2026-07-30T08:00:02Z'
        - name: 7 run 完成
          payload:
            type: event
            event: run.completed
            seq: 7
            payload:
              agent_id: agent-a
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              run_id: run-01
              run_seq: 7
              timestamp: '2026-07-30T08:00:03Z'
              outcome: done
              stop_reason: stop
              usage:
                input_tokens: 230
                output_tokens: 48
                total_tokens: 278
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
    ConnectionId:
      allOf:
        - $ref: '#/components/schemas/Identifier'
      description: |
        服务端在 connect 成功响应中返回当前物理连接的 connection_id。调用方
        可用它关联连接日志和连接级序列；重连后服务端生成新值，它不作为
        Session、Message 或 Run 的持久归属键。
    SessionId:
      allOf:
        - $ref: '#/components/schemas/Identifier'
      description: |
        调用方在 connect 中提供上层会话服务生成的 session_id。服务端用它创建
        或恢复 Runtime Session。该值必须在 Runtime 部署范围内全局唯一，删除
        后不得复用；推荐使用 UUIDv7 或 ULID，不接受仅在某个 tenant 或 user
        内唯一的短 ID。
    AgentId:
      allOf:
        - $ref: '#/components/schemas/Identifier'
      description: |
        调用方在 connect 中提供 agent_id。服务端通过 Agent Manager 校验，并在
        创建 Runtime Session 时固定绑定；恢复时，不一致的值导致请求失败。
    ModelId:
      allOf:
        - $ref: '#/components/schemas/Identifier'
      description: |
        调用方在创建 Session 时提供 model_id，或在恢复和 model.set 时请求
        切换。服务端通过 Model Manager 校验允许集合；active run 存在时不执行
        切换，每个 run 固化实际使用的模型。
    MessageId:
      allOf:
        - $ref: '#/components/schemas/Identifier'
      description: 服务端持久化一条消息时生成 message_id，并在消息事件及历史结果中返回。
    RunId:
      allOf:
        - $ref: '#/components/schemas/Identifier'
      description: |
        服务端首次接受新的 chat.send 时生成 run_id；同一 idempotency_key 且
        负载一致的重试返回原 run_id，负载不一致时返回 INVALID_REQUEST；连接
        断开或重连不会改变该值。
    ToolCallId:
      allOf:
        - $ref: '#/components/schemas/Identifier'
      description: |
        模型或 Runtime 为一个 run 内的工具调用提供 tool_call_id。服务端用它
        关联 toolcall 内容和 Tool Manager 事件；它不参与 Session 路由。
    RequestId:
      type: string
      minLength: 1
      maxLength: 128
      description: |
        调用方生成的连接内请求关联 ID。在同一物理连接的整个生命周期内不得
        重复使用。调用方用它保存 method 和预期成功 payload Schema；服务端
        可以乱序返回并发请求的 ResponseFrame，但每个可解析请求恰好返回一次。
    TraceParent:
      type: string
      minLength: 55
      maxLength: 128
      pattern: '^(?!ff-)[0-9a-f]{2}-(?!00000000000000000000000000000000-)[0-9a-f]{32}-(?!0000000000000000-)[0-9a-f]{16}-[0-9a-f]{2}(?:-.+)?$'
      description: |
        调用方可以在 RequestFrame 中提供 W3C traceparent。服务端收到请求后先
        执行 Schema 预检，再使用标准解析器校验完整规则；非法值返回
        INVALID_REQUEST。合法值只传播到遥测、Model Manager 和 Tool Manager，
        不写入 Prompt、JSONL 或业务事件。
    IdempotencyKey:
      type: string
      minLength: 8
      maxLength: 128
      description: |
        副作用命令的幂等键，作用域为 session_id + method。Request 超时或连接
        中断后，调用方使用新的 RequestFrame.id 和原 idempotency_key 重试。
        traceparent 和 RequestFrame.id 不参与业务负载等价比较。服务端在
        Session 未删除期间保留已接受结果。
    Timestamp:
      type: string
      format: date-time
    ThinkingLevel:
      type: string
      enum:
        - hidden
        - summary
        - full
      description: |
        当前连接的 thinking 投影级别。full 只有在 connect 返回的
        features.capabilities 包含 full_thinking 时才合法；capability 只开放
        选择上限，不会自动把级别切换为 full。
    ClientInfo:
      type: object
      additionalProperties: false
      required:
        - id
        - version
        - platform
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        version:
          type: string
          minLength: 1
          maxLength: 64
        platform:
          type: string
          enum:
            - cli
            - sdk
            - service
            - other
    ClientCapabilities:
      type: array
      uniqueItems: true
      default: []
      description: |
        调用方可以在 connect 中声明可选增强能力；省略等价于空数组。协议 v2
        固定使用 typed structured delta，因此 delta 不属于 capability。
        当前已知值只有 full_thinking，它只表示客户端可以安全消费完整 thinking，
        不会自动把 Session 的 thinking 级别设为 full，也不构成披露授权。
        未知字符串允许发送，以便客户端前向演进；服务端忽略且不回显。
      x-known-capabilities:
        - full_thinking
      items:
        type: string
        minLength: 1
        maxLength: 128
    SessionConnectMode:
      type: string
      enum:
        - create
        - resume
      description: |
        调用方使用 create 请求幂等建立上层已经分配 session_id 的 Runtime
        Session；使用 resume 只能恢复已有 Session，目标不存在时服务端返回
        SESSION_NOT_FOUND。
    ConnectParams:
      type: object
      additionalProperties: false
      description: |
        调用方在首个 connect Frame 中提供 mode、全局唯一 session_id、agent_id
        和客户端信息，并可声明可选 capabilities。使用 create 时还必须提供
        model_id；服务端
        对相同 Session、Agent 和 Model 的重试保持幂等。使用 resume 时服务端
        不创建缺失或已删除的 Session；只有不存在 active run 时，显式不同的
        model_id 才表示切换。min_protocol 必须小于或等于 max_protocol；服务端
        选择双方共同支持的最高版本，本制品只支持 2。没有交集时返回
        UNSUPPORTED_PROTOCOL。create 请求的响应丢失时，调用方必须在新连接上
        使用完全相同的 session_id + agent_id + model_id 重试 mode=create；不得直接
        改用 resume，因为原 create 可能尚未提交。
      required:
        - mode
        - min_protocol
        - max_protocol
        - agent_id
        - session_id
        - client
      properties:
        mode:
          $ref: '#/components/schemas/SessionConnectMode'
        min_protocol:
          type: integer
          minimum: 1
        max_protocol:
          type: integer
          minimum: 1
        agent_id:
          $ref: '#/components/schemas/AgentId'
        session_id:
          $ref: '#/components/schemas/SessionId'
        model_id:
          $ref: '#/components/schemas/ModelId'
          description: 调用方在 create 时必须提供；在 resume 时可以省略以沿用保存值，也可以显式请求切换。
        client:
          $ref: '#/components/schemas/ClientInfo'
        capabilities:
          $ref: '#/components/schemas/ClientCapabilities'
      allOf:
        - if:
            properties:
              mode:
                const: create
          then:
            required:
              - model_id
    ConnectRequest:
      type: object
      additionalProperties: false
      description: |
        必须是 101 后五秒内的首个 Text Message。connect 成功 Response 写出前
        不得发送其他 RequestFrame。任何 connect 失败都会先在可关联时返回
        ErrorResponseFrame，再关闭尚未绑定的连接：协议无交集使用 1002，暂时
        不可用使用 1013，其他身份、参数或绑定失败使用 1008。
      required:
        - type
        - id
        - method
        - params
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: connect
        params:
          $ref: '#/components/schemas/ConnectParams'
    ChatSendParams:
      type: object
      additionalProperties: false
      description: |
        幂等负载由 message、attachment_ids 的顺序和值以及 thinking 是否省略和
        具体值共同决定；RequestFrame.id 和 traceparent 不参与。相同 key 携带
        不同幂等负载返回 INVALID_REQUEST。
      required:
        - message
        - idempotency_key
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 262144
          description: |
            用户文本。字符上限不是线上的最终大小判断；调用方还必须确保完整
            JSON Text Message 的 UTF-8 字节数不超过 connect 返回的
            max_message_bytes。
        attachment_ids:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Identifier'
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
        thinking:
          $ref: '#/components/schemas/ThinkingLevel'
          description: |
            省略时使用当前连接看到的 Session 默认级别。显式值只能低于或等于
            该默认级别；请求更高值返回 FORBIDDEN，不执行静默降级。
    ChatSendRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
        - params
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: chat.send
        params:
          $ref: '#/components/schemas/ChatSendParams'
    ChatSteerParams:
      type: object
      additionalProperties: false
      required:
        - run_id
        - message
        - idempotency_key
      properties:
        run_id:
          $ref: '#/components/schemas/RunId'
        message:
          type: string
          minLength: 1
          maxLength: 262144
          description: |
            Steering 文本。字符上限不是线上的最终大小判断；调用方还必须
            确保完整 JSON Text Message 的 UTF-8 字节数不超过 connect 返回的
            max_message_bytes。
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
    ChatSteerRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
        - params
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: chat.steer
        params:
          $ref: '#/components/schemas/ChatSteerParams'
    ChatAbortParams:
      type: object
      additionalProperties: false
      required:
        - run_id
        - idempotency_key
      properties:
        run_id:
          $ref: '#/components/schemas/RunId'
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
    ChatAbortRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
        - params
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: chat.abort
        params:
          $ref: '#/components/schemas/ChatAbortParams'
    CursorPageParams:
      type: object
      additionalProperties: false
      properties:
        cursor:
          type: string
          minLength: 1
          maxLength: 1024
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
    ChatHistoryFirstPageParams:
      type: object
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        run_id:
          $ref: '#/components/schemas/RunId'
          description: 只返回指定 run 的 Message 和 RunRecord；active-run 同步时必须使用。
        through_history_seq:
          type: integer
          minimum: 0
          description: |
            首页查询的包含性 history_seq 上界。active_run 恢复时传入快照返回的
            history_seq。
    ChatHistoryCursorParams:
      type: object
      additionalProperties: false
      required:
        - cursor
      properties:
        cursor:
          type: string
          minLength: 1
          maxLength: 1024
          description: 服务端上一页返回的不透明游标；它已固定首页的过滤条件和上界。
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
    ChatHistoryParams:
      oneOf:
        - $ref: '#/components/schemas/ChatHistoryFirstPageParams'
        - $ref: '#/components/schemas/ChatHistoryCursorParams'
      description: 首页可设置 run_id 和水位；后续页只使用不透明 cursor，不重复或变更过滤条件。
    ChatHistoryRequest:
      type: object
      additionalProperties: false
      description: |
        读取当前 Session 的权威持久历史。省略 cursor 时返回查询时刻最新的一页；
        next_cursor 用于继续读取更早的数据。每页 items 按 history_seq 从旧到新
        排列，游标不透明、固定首次查询的过滤条件和上界，分页不重叠。
        active-run 恢复必须在首页提交 snapshot.run_id 和
        snapshot.history_seq，并在应用 post-snapshot 事件前读完该过滤历史。
      required:
        - type
        - id
        - method
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: chat.history
        params:
          $ref: '#/components/schemas/ChatHistoryParams'
    SessionGetRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: session.get
    ModelsListRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: models.list
    ModelSetParams:
      type: object
      additionalProperties: false
      required:
        - model_id
      properties:
        model_id:
          $ref: '#/components/schemas/ModelId'
    ModelSetRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
        - params
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: model.set
        params:
          $ref: '#/components/schemas/ModelSetParams'
    ThinkingSetParams:
      type: object
      additionalProperties: false
      description: |
        修改 Session 默认披露级别。请求 full 时，当前 connect 的有效 capability
        必须包含 full_thinking；否则返回 FORBIDDEN。active run 存在时返回
        RUN_ACTIVE。服务端不静默降级请求值。
      required:
        - level
      properties:
        level:
          $ref: '#/components/schemas/ThinkingLevel'
    ThinkingSetRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
        - params
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: thinking.set
        params:
          $ref: '#/components/schemas/ThinkingSetParams'
    PromptTemplatesListRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: prompt_templates.list
        params:
          $ref: '#/components/schemas/CursorPageParams'
    SkillsListRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: skills.list
    AnyRequestFrame:
      oneOf:
        - $ref: '#/components/schemas/ConnectRequest'
        - $ref: '#/components/schemas/ChatSendRequest'
        - $ref: '#/components/schemas/ChatSteerRequest'
        - $ref: '#/components/schemas/ChatAbortRequest'
        - $ref: '#/components/schemas/ChatHistoryRequest'
        - $ref: '#/components/schemas/SessionGetRequest'
        - $ref: '#/components/schemas/ModelsListRequest'
        - $ref: '#/components/schemas/ModelSetRequest'
        - $ref: '#/components/schemas/ThinkingSetRequest'
        - $ref: '#/components/schemas/PromptTemplatesListRequest'
        - $ref: '#/components/schemas/SkillsListRequest'
    ModelSummary:
      type: object
      additionalProperties: false
      required:
        - model_id
        - name
      properties:
        model_id:
          $ref: '#/components/schemas/ModelId'
        name:
          type: string
          minLength: 1
          maxLength: 256
        reasoning:
          type: boolean
        context_window:
          type: integer
          minimum: 1
        max_output_tokens:
          type: integer
          minimum: 1
    SessionSummary:
      type: object
      additionalProperties: false
      required:
        - state
        - thinking
      properties:
        state:
          type: string
          enum:
            - idle
            - running
        thinking:
          $ref: '#/components/schemas/ThinkingLevel'
          description: 当前连接经过 capability 与授权上限投影后的 Session 默认值。
    ConnectionLimits:
      type: object
      additionalProperties: false
      required:
        - max_message_bytes
        - max_connection_buffer_bytes
        - heartbeat_seconds
        - pong_timeout_seconds
        - connect_timeout_seconds
      properties:
        max_message_bytes:
          type: integer
          minimum: 1024
          default: 1048576
          description: |
            一个完整 WebSocket Text Message 在解压、重组并编码为 UTF-8 JSON 后
            的最大字节数；不是底层分片数量或单个 wire frame 的上限。
        max_connection_buffer_bytes:
          type: integer
          minimum: 1024
          default: 4194304
        heartbeat_seconds:
          type: integer
          minimum: 1
          default: 20
        pong_timeout_seconds:
          type: integer
          minimum: 1
          default: 10
        connect_timeout_seconds:
          type: integer
          minimum: 1
          default: 5
    NegotiatedMethods:
      type: array
      minItems: 1
      uniqueItems: true
      contains:
        const: chat.history
      description: |
        服务端在 connect 成功响应中返回当前连接可发现的方法，并按本 Schema
        的枚举顺序稳定排列。调用方可据此决定展示哪些功能；服务端仍对每个
        请求重新执行状态和权限校验。chat.history 是快照恢复的必备方法，
        每个成功 connect 的列表都必须包含；调用服务无权读取投影历史时，
        服务端必须拒绝 connect，不得返回无法恢复的连接。
      items:
        type: string
        enum:
          - chat.send
          - chat.steer
          - chat.abort
          - chat.history
          - session.get
          - models.list
          - model.set
          - thinking.set
          - prompt_templates.list
          - skills.list
    NegotiatedEvents:
      type: array
      minItems: 8
      maxItems: 8
      uniqueItems: true
      description: |
        协议 2 的 Chat 事件族是不可拆分的完整集合，服务端按本
        Schema 的枚举顺序稳定返回全部八项。若不能提供完整集合，
        connect 必须失败，不得建立一条无法判定 Message 或 run 终态的连接。
      items:
        type: string
        enum:
          - run.started
          - message.started
          - message.updated
          - tool.started
          - tool.updated
          - tool.completed
          - message.completed
          - run.completed
    EffectiveCapabilities:
      type: array
      uniqueItems: true
      description: |
        服务端根据客户端声明、服务能力和当前授权计算可选增强能力的交集，并
        在 connect 成功响应中返回。空数组表示没有可选增强，不影响协议 v2
        固有的 typed structured delta。只有调用服务 scope、Agent、Model、
        可选委托披露上限和客户端声明全部允许时，结果才包含 full_thinking。
      items:
        type: string
        enum:
          - full_thinking
    NegotiatedFeatures:
      type: object
      additionalProperties: false
      required:
        - methods
        - events
        - capabilities
      properties:
        methods:
          $ref: '#/components/schemas/NegotiatedMethods'
        events:
          $ref: '#/components/schemas/NegotiatedEvents'
        capabilities:
          $ref: '#/components/schemas/EffectiveCapabilities'
    TextContent:
      type: object
      additionalProperties: false
      required:
        - type
        - text
      properties:
        type:
          const: text
        text:
          type: string
    ThinkingContent:
      type: object
      additionalProperties: false
      required:
        - type
        - disclosure
      properties:
        type:
          const: thinking
        text:
          type: string
        disclosure:
          type: string
          enum:
            - hidden
            - summary
            - full
      allOf:
        - if:
            properties:
              disclosure:
                const: hidden
            required:
              - disclosure
          then:
            not:
              required:
                - text
        - if:
            properties:
              disclosure:
                enum:
                  - summary
                  - full
            required:
              - disclosure
          then:
            required:
              - text
      description: |
        Thinking 内容块始终占用原 content_index，因此 hidden 投影也保留
        一个不含 text 的占位块，后续可见块的索引不会前移。disclosure=full
        只允许出现在有效 capability 包含 full_thinking 的连接投影中。
    ToolCallContent:
      type: object
      additionalProperties: false
      required:
        - type
        - tool_call_id
        - tool_id
        - arguments
      properties:
        type:
          const: tool_call
        tool_call_id:
          $ref: '#/components/schemas/ToolCallId'
        tool_id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
          minLength: 1
          maxLength: 256
        arguments:
          type: object
          additionalProperties: true
    ToolResultContent:
      type: object
      additionalProperties: false
      required:
        - type
        - tool_call_id
        - status
      properties:
        type:
          const: tool_result
        tool_call_id:
          $ref: '#/components/schemas/ToolCallId'
        status:
          type: string
          enum:
            - done
            - error
            - aborted
        result: {}
        error:
          $ref: '#/components/schemas/Error'
      allOf:
        - if:
            properties:
              status:
                const: done
            required:
              - status
          then:
            required:
              - result
            not:
              required:
                - error
        - if:
            properties:
              status:
                const: error
            required:
              - status
          then:
            required:
              - error
            not:
              required:
                - result
        - if:
            properties:
              status:
                const: aborted
            required:
              - status
          then:
            not:
              anyOf:
                - required:
                    - result
                - required:
                    - error
    ProjectedMessage:
      type: object
      additionalProperties: false
      required:
        - message_id
        - role
        - status
        - content
        - created_at
      properties:
        message_id:
          $ref: '#/components/schemas/MessageId'
        role:
          type: string
          enum:
            - user
            - assistant
            - tool
        status:
          type: string
          enum:
            - streaming
            - completed
            - aborted
            - error
        content:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/TextContent'
              - $ref: '#/components/schemas/ThinkingContent'
              - $ref: '#/components/schemas/ToolCallContent'
              - $ref: '#/components/schemas/ToolResultContent'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        completed_at:
          $ref: '#/components/schemas/Timestamp'
    TerminalProjectedMessage:
      allOf:
        - $ref: '#/components/schemas/ProjectedMessage'
        - type: object
          properties:
            status:
              type: string
              enum:
                - completed
                - aborted
                - error
      description: message.completed 和 chat.history 使用的终态 Message；status 不得为 streaming。
    StreamingProjectedMessage:
      allOf:
        - $ref: '#/components/schemas/ProjectedMessage'
        - type: object
          properties:
            status:
              const: streaming
      description: active-run 快照中当前未完成的 Assistant Message。
    OpenTextContentState:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          const: text
    OpenThinkingContentState:
      type: object
      additionalProperties: false
      required:
        - type
        - disclosure
      properties:
        type:
          const: thinking
        disclosure:
          type: string
          enum:
            - hidden
            - summary
            - full
    OpenToolCallContentState:
      type: object
      additionalProperties: false
      required:
        - type
        - tool_call_id
        - tool_id
        - arguments_delta
      properties:
        type:
          const: tool_call
        tool_call_id:
          $ref: '#/components/schemas/ToolCallId'
        tool_id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
          maxLength: 256
        arguments_delta:
          type: string
          description: 已累计但可能仍不是合法 JSON 的参数文本；最终以 toolcall_end.arguments 为准。
    OpenContentState:
      oneOf:
        - $ref: '#/components/schemas/OpenTextContentState'
        - $ref: '#/components/schemas/OpenThinkingContentState'
        - $ref: '#/components/schemas/OpenToolCallContentState'
    ActiveTool:
      type: object
      additionalProperties: false
      required:
        - tool_call_id
        - tool_id
        - status
      properties:
        tool_call_id:
          $ref: '#/components/schemas/ToolCallId'
        tool_id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
        status:
          type: string
          enum:
            - starting
            - running
        input:
          type: object
          additionalProperties: true
    ActiveRunSnapshot:
      type: object
      additionalProperties: false
      required:
        - run_id
        - run_seq
        - history_seq
        - model_id
        - thinking
        - message_snapshot
        - open_contents
        - active_tools
      properties:
        run_id:
          $ref: '#/components/schemas/RunId'
        run_seq:
          type: integer
          minimum: 0
          description: 快照已经包含的最后一个 run_seq；后续只发送更大的值。
        history_seq:
          type: integer
          minimum: 0
          description: |
            快照临界区已持久化的最大 history_seq。客户端在应用快照前使用
            chat.history(run_id, through_history_seq) 读取不超过该值的当前 run
            终态 Message，以恢复用户消息、先前完成的 Assistant Message 和
            ToolResult。
        model_id:
          $ref: '#/components/schemas/ModelId'
        thinking:
          $ref: '#/components/schemas/ThinkingLevel'
          description: 当前连接对该 run 冻结 thinking 级别的有效投影。
        message_snapshot:
          oneOf:
            - $ref: '#/components/schemas/StreamingProjectedMessage'
            - type: 'null'
          description: |
            当前未完成 Assistant Message 的完整可见投影。run 已建立但尚未发生
            message.started 时为 null。先前已完成的 Message 通过上述 history_seq
            水位读取，而不在此字段重复。
        open_contents:
          type: object
          propertyNames:
            pattern: '^(0|[1-9][0-9]*)$'
          additionalProperties:
            $ref: '#/components/schemas/OpenContentState'
          description: |
            快照时刻已 start 但尚未 end 的内容块；对象 key 是十进制
            content_index，因此同一索引不可重复。客户端先应用历史水位和
            message_snapshot，再据此初始化开放块，随后只归并 run_seq 大于
            快照值的 delta。message_snapshot 为 null 时该对象必须为空。
        active_tools:
          type: array
          items:
            $ref: '#/components/schemas/ActiveTool'
      allOf:
        - if:
            properties:
              message_snapshot:
                type: 'null'
            required:
              - message_snapshot
          then:
            properties:
              open_contents:
                maxProperties: 0
    ConnectResult:
      type: object
      additionalProperties: false
      required:
        - protocol
        - connection_id
        - agent_id
        - session_id
        - model
        - session
        - limits
        - features
        - active_run
      properties:
        protocol:
          const: 2
        connection_id:
          $ref: '#/components/schemas/ConnectionId'
        agent_id:
          $ref: '#/components/schemas/AgentId'
        session_id:
          $ref: '#/components/schemas/SessionId'
        model:
          $ref: '#/components/schemas/ModelSummary'
        session:
          $ref: '#/components/schemas/SessionSummary'
        limits:
          $ref: '#/components/schemas/ConnectionLimits'
        features:
          $ref: '#/components/schemas/NegotiatedFeatures'
        active_run:
          oneOf:
            - $ref: '#/components/schemas/ActiveRunSnapshot'
            - type: 'null'
      description: |
        session.state=running 当且仅当 active_run 非 null；session.state=idle 当且
        仅当 active_run 为 null。connect Response 必须先于新连接上的任何
        EventFrame 写出。
    ChatSendResult:
      type: object
      additionalProperties: false
      description: |
        accepted=true 表示用户消息已持久化、run_id 已分配且 active-run 占位已
        原子提交；随后即使连接断开，run 仍继续。服务端必须先向发起连接写出
        本 ResponseFrame，再向该连接写出该 run 的 run.started；其他观察连接
        不受这一局部排序约束。同一 idempotency_key 的等价重试优先返回原结果，
        不因原 run 已处于 active 状态而返回 RUN_ACTIVE。
      required:
        - run_id
        - user_message_id
        - accepted
      properties:
        run_id:
          $ref: '#/components/schemas/RunId'
        user_message_id:
          $ref: '#/components/schemas/MessageId'
          description: |
            服务端已经持久化的权威用户消息 ID。调用方用它替换本地乐观消息的
            临时 ID；同一 idempotency_key 的等价重试返回相同值。
        accepted:
          type: boolean
          const: true
    ChatSteerResult:
      type: object
      additionalProperties: false
      required:
        - run_id
        - user_message_id
        - accepted
        - idempotent
      properties:
        run_id:
          $ref: '#/components/schemas/RunId'
        user_message_id:
          $ref: '#/components/schemas/MessageId'
        accepted:
          type: boolean
        idempotent:
          type: boolean
    ChatAbortResult:
      type: object
      additionalProperties: false
      required:
        - run_id
        - accepted
        - idempotent
      properties:
        run_id:
          $ref: '#/components/schemas/RunId'
        accepted:
          type: boolean
        idempotent:
          type: boolean
    RunRecord:
      type: object
      additionalProperties: false
      required:
        - run_id
        - outcome
        - completed_at
      properties:
        run_id:
          $ref: '#/components/schemas/RunId'
        outcome:
          type: string
          enum:
            - done
            - aborted
            - error
        completed_at:
          $ref: '#/components/schemas/Timestamp'
        usage:
          $ref: '#/components/schemas/Usage'
        stop_reason:
          type: string
          maxLength: 256
        error:
          $ref: '#/components/schemas/Error'
      allOf:
        - if:
            properties:
              outcome:
                const: error
            required:
              - outcome
          then:
            required:
              - error
        - if:
            properties:
              outcome:
                enum:
                  - done
                  - aborted
            required:
              - outcome
          then:
            not:
              required:
                - error
      description: |
        run.completed 的持久化投影。outcome=error 时必须携带 error；outcome=done
        或 aborted 时不得携带 error。调用方按 run_id 与实时状态对账。
    HistoryMessageItem:
      type: object
      additionalProperties: false
      required:
        - type
        - history_seq
        - run_id
        - message
      properties:
        type:
          const: message
        history_seq:
          type: integer
          minimum: 1
        run_id:
          $ref: '#/components/schemas/RunId'
        message:
          $ref: '#/components/schemas/TerminalProjectedMessage'
    HistoryRunItem:
      type: object
      additionalProperties: false
      required:
        - type
        - history_seq
        - run
      properties:
        type:
          const: run
        history_seq:
          type: integer
          minimum: 1
        run:
          $ref: '#/components/schemas/RunRecord'
    HistoryItem:
      oneOf:
        - $ref: '#/components/schemas/HistoryMessageItem'
        - $ref: '#/components/schemas/HistoryRunItem'
    HistoryResult:
      type: object
      additionalProperties: false
      required:
        - items
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HistoryItem'
          description: |
            同一页内按 history_seq 从旧到新排列。调用方按 message_id 和 run_id
            去重并以较新的权威投影覆盖本地状态。
        next_cursor:
          type: string
          minLength: 1
          maxLength: 1024
        has_more:
          type: boolean
      allOf:
        - if:
            properties:
              has_more:
                const: true
            required:
              - has_more
          then:
            required:
              - next_cursor
        - if:
            properties:
              has_more:
                const: false
            required:
              - has_more
          then:
            not:
              required:
                - next_cursor
    SessionGetResult:
      type: object
      additionalProperties: false
      required:
        - agent_id
        - session_id
        - model
        - session
        - active_run
      properties:
        agent_id:
          $ref: '#/components/schemas/AgentId'
        session_id:
          $ref: '#/components/schemas/SessionId'
        model:
          $ref: '#/components/schemas/ModelSummary'
        session:
          $ref: '#/components/schemas/SessionSummary'
        active_run:
          oneOf:
            - $ref: '#/components/schemas/ActiveRunSnapshot'
            - type: 'null'
    ModelsListResult:
