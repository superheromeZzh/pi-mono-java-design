x-websocket:
  handshake:
    clientUri: wss://api.example.com/api/ws/chat
    conceptualHttpTarget: https://api.example.com/api/ws/chat
    http11Method: GET
    requiredHttp11Headers:
      - 'Connection: Upgrade'
      - 'Upgrade: websocket'
      - 'Sec-WebSocket-Version: 13'
      - 'Sec-WebSocket-Key: <random-base64-key>'
    serviceAuthentication:
      - 'Authorization: Bearer <token>'
      - optional mTLS before the HTTP request
    successStatus: 101
    preUpgradeFailureStatuses:
      - 400
      - 401
      - 403
      - 426
    firstApplicationFrame: connect RequestFrame
    description: |
      wss 是客户端 URI；https 形式只说明同一 host、port 和 path 上承载
      opening handshake 的 HTTP/TLS 视角，不定义 RESTful API。101 之前不能
      发送 ResponseFrame 或 WebSocket close code；101 之后不再使用 HTTP
      status 表达应用错误。HTTP Upgrade 只建立传输，connect RequestFrame
      才绑定 Runtime Session。
  firstFrameTimeoutSeconds: 5
  pingPongIntervalSeconds: 20
  defaultMaxFrameBytes: 1048576
  defaultMaxConnectionBufferBytes: 4194304
  closeCodes:
    '1000': 正常关闭
    '1002': 不支持的协议版本
    '1008': connect 超时或违反连接策略
    '1009': 帧大小超过协商上限
    '1013': 消费端过慢；需要重连并通过快照恢复
