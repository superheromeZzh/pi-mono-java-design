    errors: [INVALID_REQUEST, FORBIDDEN, RUN_NOT_FOUND, MANAGER_UNAVAILABLE]
  chat.history:
    requestSchema: '#/components/schemas/ChatHistoryRequest'
    successPayloadSchema: '#/components/schemas/HistoryResult'
    errors: [INVALID_REQUEST, FORBIDDEN, MANAGER_UNAVAILABLE]
  session.get:
    requestSchema: '#/components/schemas/SessionGetRequest'
    successPayloadSchema: '#/components/schemas/SessionGetResult'
    errors: [INVALID_REQUEST, FORBIDDEN, SESSION_NOT_FOUND]
  models.list:
    requestSchema: '#/components/schemas/ModelsListRequest'
    successPayloadSchema: '#/components/schemas/ModelsListResult'
    errors: [INVALID_REQUEST, FORBIDDEN, MANAGER_AUTH_FAILED, MANAGER_UNAVAILABLE]
  model.set:
    requestSchema: '#/components/schemas/ModelSetRequest'
    successPayloadSchema: '#/components/schemas/ModelSetResult'
    errors: [INVALID_REQUEST, FORBIDDEN, RUN_ACTIVE, MODEL_NOT_ALLOWED, MANAGER_AUTH_FAILED, MANAGER_UNAVAILABLE]
  thinking.set:
    requestSchema: '#/components/schemas/ThinkingSetRequest'
    successPayloadSchema: '#/components/schemas/ThinkingSetResult'
    errors: [INVALID_REQUEST, FORBIDDEN, RUN_ACTIVE]
  prompt_templates.list:
