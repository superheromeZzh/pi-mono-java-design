    referencedAt: null-to-timestamp, one-way
  internalContent:
    method: GET
    path: /mate-service/internal/v1/sessions/{session_id}/attachments/{attachment_id}/content
    response: bounded byte stream
  storage:
    metadata: openGauss
    body: OBS
    sharedAcrossReplicas: true
    runtimeDirectObsAccess: false
    objectKeyEqualsAttachmentId: true
    objectKeyStoredInDatabase: false
    objectKeyContainsFilenameOrSessionPath: false
