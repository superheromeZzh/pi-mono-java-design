    successPayloadSchema: '#/components/schemas/ChatSendResult'
    errors: [INVALID_REQUEST, FORBIDDEN, RUN_ACTIVE, INVALID_ATTACHMENT, MANAGER_AUTH_FAILED, MANAGER_UNAVAILABLE]
  chat.steer:
    requestSchema: '#/components/schemas/ChatSteerRequest'
