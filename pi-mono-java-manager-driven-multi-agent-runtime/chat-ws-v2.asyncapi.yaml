asyncapi: 3.1.0
id: urn:campusagent:chat-websocket:v2
x-locale: zh-CN
info:
  title: CampusAgent 会话 WebSocket API
  version: 2.9.1
  description: |
    调用方使用 `wss://api.example.com/agent-service/v1/ws/chat` 请求建立
    安全 WebSocket。
    客户端库先建立 TCP/TLS 连接，再通过 HTTP opening handshake 协商切换
    协议；服务端返回 101 后，WebSocket 才正式建立。

    调用方必须在 101 后五秒内发送首个 `connect` RequestFrame。服务端根据
    `mode` 创建或恢复 `session_id` 对应的 CampusAgent Runtime Session，并校验
    `agent_id`、`model_id` 和可选 capabilities；成功后，这条连接在整个生命周期
    内固定绑定到对应的 `(agent_id, session_id)`。

    连接随后承载 RequestFrame、ResponseFrame 和 EventFrame。同一 Pod 内的
    active run 由 ManagedSessionPool 持有，因此普通断线只取消连接订阅，
    不终止模型调用或工具执行。同一 Pod 内每个 Session 只允许一个
    活动读写连接；新的 `resume` 原子递增 connection generation 并接管
    Session，旧连接使用私有关闭码 `4409 SESSION_REPLACED` 结束。

    上层会话服务负责创建和管理 `session_id`，以及用户会话列表、数量限制和
    业务删除。CampusAgent 将 `session_id` 作为不透明的 Runtime Session 标识，
    不接收或维护 tenant_id、user_id。调用方提供的 `session_id` 必须在一个
    CampusAgent Runtime 部署范围内全局唯一，删除后不得复用。

    文件正文由 `mate-service` Attachment Service 写入 OBS，状态和
    可信元数据写入 openGauss；WebSocket `chat.send` 只传
    `attachment_ids`。附件引用是协议 2 的标准可选字段，不是 capability。
    CampusAgent Runtime 只调用 Attachment Service 内部 resolve/content，
    不直连 OBS，不接触 Bucket、存储凭据、预签名 URL、
    客户端 MIME/文件名/Base64 或 tenant/user 字段。

    URL 中的 `/v1` 是 `agent-service` 对外服务 API 版本；首帧协商的
    `protocol: 2` 是 WebSocket Frame 协议版本，二者独立演进。协议 2 固定
    使用 request/response/event Frame 和结构化消息增量，不通过 capability
    协商累计 Message 格式。它是 CampusAgent 的目标协议；当前
    pi-mono-java v1 使用 `/api/ws/chat`。调用方不得通过业务查询参数
    或 URL token 传递身份及 Session
    信息，也不能在已绑定的连接内创建另一个 Session。

    实现调用方、请求关联、消息归并、断线恢复和错误处理时，先阅读同目录的
    `chat-ws-v2-client-integration.md`；字段和取值仍以本文件为规范来源。

    `https://api.example.com/agent-service/v1/ws/chat` 只是同一 host、port 和
    path 的 HTTP 握手视角，不是 RESTful API，也不表示第二条连接。
  contact:
    name: CampusAgent
  license:
    name: MIT
defaultContentType: application/json
servers:
  production:
    host: api.example.com
    pathname: /agent-service
    protocol: wss
    description: |
      本通道只供 `mate-service`、其他获授权服务端调用方和服务端 SDK
      连接。调用方按现有内部网关认证能力在 HTTP opening handshake 中
      建立服务身份；本公开规范不复制私有 Header、claim 或密钥格式。
      私钥原文不得在 HTTP 或 WebSocket 中传输。
      服务端在返回 101 前完成认证，并拒绝业务查询参数、URL token 或
      缺少合法 Upgrade headers 的普通 HTTP 请求。浏览器到
      `mate-service` 的协议另行定义，不直接连接 CampusAgent Runtime。
  local:
    host: localhost:3000
    pathname: /agent-service
    protocol: ws
    description: |
      开发客户端使用 `ws://localhost:3000/agent-service/v1/ws/chat` 建立连接。
      开发部署也必须按该环境现有内部网关和服务认证配置完成身份校验；
      只有 URL 使用 `ws`，HTTP opening handshake、首帧 `connect` 和后续 Frame
      协议边界不变。
channels:
  sessionChat:
    address: /v1/ws/chat
    title: 会话范围的对话通道
    description: |
      调用方完成 HTTP opening handshake 并收到 101 后，才可以在这条连接上
      传输 JSON Frame。调用方必须在五秒内发送 `connect` RequestFrame；服务端
      校验并绑定 Agent 和 Session 后，才接受其他 Session 命令。101 之前的失败
      使用 HTTP status，101 之后的失败使用 ResponseFrame、EventFrame 或
      WebSocket close code。连接绑定成功后不能更换 Agent 或 Session。
    messages:
      ClientRequestFrame:
        $ref: '#/components/messages/ClientRequestFrame'
      ServerResponseFrame:
        $ref: '#/components/messages/ServerResponseFrame'
      ServerEventFrame:
        $ref: '#/components/messages/ServerEventFrame'
operations:
  receiveRequest:
    action: receive
    channel:
      $ref: '#/channels/sessionChat'
    summary: CampusAgent 服务端先接收 connect RequestFrame；绑定成功后接收当前 Session 的命令请求。
    messages:
      - $ref: '#/channels/sessionChat/messages/ClientRequestFrame'
  sendResponseOrEvent:
    action: send
    channel:
      $ref: '#/channels/sessionChat'
    summary: CampusAgent 服务端为命令发送同 id 的 ResponseFrame，并按 seq 发送当前 Session 的有序事件。
    messages:
      - $ref: '#/channels/sessionChat/messages/ServerResponseFrame'
      - $ref: '#/channels/sessionChat/messages/ServerEventFrame'
components:
  messages:
    ClientRequestFrame:
      name: ClientRequestFrame
      title: 客户端请求 Frame
      description: 调用方使用首个 connect RequestFrame 建立应用级 Session 绑定，随后用相同 Frame 结构发送命令。
      correlationId:
        location: $message.payload#/id
      payload:
        $ref: '#/components/schemas/AnyRequestFrame'
      examples:
        - name: 新建会话
          payload:
            type: req
            id: connect-1
            method: connect
            params:
              mode: create
              min_protocol: 2
              max_protocol: 2
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              agent_id: agent_011CZkYqphY8vELVzwCUpqiQ
              model_id: model_011CZq2GkV8aD4NwP7sLmXfR
              client:
                id: mate-service
                version: 1.0.0
                platform: service
        - name: 恢复会话
          payload:
            type: req
            id: connect-2
            method: connect
            params:
              mode: resume
              min_protocol: 2
              max_protocol: 2
              agent_id: agent_011CZkYqphY8vELVzwCUpqiQ
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              client:
                id: campusagent-sdk
                version: 1.0.0
                platform: sdk
              capabilities:
                - full_thinking
        - name: 发送纯文本用户消息
          payload:
            type: req
            id: send-text-1
            method: chat.send
            params:
              message: 查询订单 20260730001
              idempotency_key: b27da7cc-98e8-42c9-bc4c-1a0fc694956e
              thinking: hidden
        - name: 发送文本和附件用户消息
          payload:
            type: req
            id: send-1
            method: chat.send
            traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
            params:
              message: 查询订单 20260730001
              attachment_ids:
                - attachment_011CZm8VpK4rNs6WtY2hDqfB
              idempotency_key: 6f46bc26-8a14-4d63-b7b1-8f1f933a0d50
              thinking: hidden
        - name: 仅使用附件发送用户消息
          payload:
            type: req
            id: send-attachment-1
            method: chat.send
            params:
              attachment_ids:
                - attachment_011CZm8VpK4rNs6WtY2hDqfB
              idempotency_key: b38b138f-e992-4ed5-b74f-0155ba0acd10
    ServerResponseFrame:
      name: ServerResponseFrame
      title: 关联命令响应
      description: 服务端为每个 RequestFrame 返回相同 id 的响应；成功时携带 payload，失败时携带 error。
      correlationId:
        location: $message.payload#/id
      payload:
        $ref: '#/components/schemas/AnyResponseFrame'
      examples:
        - name: 连接成功并返回 active run 快照
          payload:
            type: res
            id: connect-2
            ok: true
            payload:
              protocol: 2
              connection_id: conn-01
              connection_generation: 3
              agent_id: agent_011CZkYqphY8vELVzwCUpqiQ
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              model:
                model_id: model_011CZq2GkV8aD4NwP7sLmXfR
                name: 模型 A
                reasoning: true
                input:
                  modalities:
                    - text
                    - image
                    - document
                  attachment_media_types:
                    - image/png
                    - image/jpeg
                    - application/pdf
                    - text/plain
                  max_attachments: 10
                  max_attachment_bytes: 20971520
                  max_total_attachment_bytes: 52428800
              session:
                state: running
                thinking: hidden
              limits:
                max_message_bytes: 1048576
                max_connection_buffer_bytes: 4194304
                heartbeat_seconds: 20
                pong_timeout_seconds: 10
                connect_timeout_seconds: 5
              features:
                methods:
                  - chat.send
                  - chat.steer
                  - chat.abort
                  - chat.history
                  - session.get
                  - models.list
                  - model.set
                  - thinking.set
                events:
                  - run.started
                  - message.started
                  - message.updated
                  - tool.started
                  - tool.updated
                  - tool.completed
                  - message.completed
                  - run.completed
                capabilities:
                  - full_thinking
              active_run:
                run_id: run-01
                run_seq: 14
                history_seq: 41
                model_id: model_011CZq2GkV8aD4NwP7sLmXfR
                thinking: hidden
                message_snapshot:
                  message_id: message-01
                  role: assistant
                  status: streaming
                  content:
                    - type: text
                      text: 订单当前状态为
                  created_at: '2026-07-30T08:00:00Z'
                open_contents:
                  '0':
                    type: text
                active_tools: []
        - name: 发送消息已接受
          payload:
            type: res
            id: send-1
            ok: true
            payload:
              run_id: run-01
              user_message_id: message-user-01
              accepted: true
        - name: 读取权威历史
          payload:
            type: res
            id: history-1
            ok: true
            payload:
              items:
                - type: message
                  history_seq: 20
                  run_id: run-01
                  message:
                    message_id: message-user-01
                    role: user
                    status: completed
                    content:
                      - type: text
                        text: 分析附件中的订单数据
                      - type: attachment
                        attachment_id: attachment_011CZm8VpK4rNs6WtY2hDqfB
                        filename: orders.pdf
                        media_type: application/pdf
                        size_bytes: 182734
                        sha256: 3b6f75a86ac2f94c6b20252a66f4d71a7b37b1f48e325ef1698025c813b31c5f
                    created_at: '2026-07-30T07:59:59Z'
                    completed_at: '2026-07-30T07:59:59Z'
                - type: message
                  history_seq: 21
                  run_id: run-01
                  message:
                    message_id: message-01
                    role: assistant
                    status: completed
                    content:
                      - type: text
                        text: 已发货
                    created_at: '2026-07-30T08:00:00Z'
                    completed_at: '2026-07-30T08:00:02Z'
                - type: run
                  history_seq: 22
                  run:
                    run_id: run-01
                    outcome: done
                    completed_at: '2026-07-30T08:00:03Z'
                - type: message
                  history_seq: 23
                  run_id: run-02
                  message:
                    message_id: message-user-02
                    role: user
                    status: completed
                    content:
                      - type: attachment
                        attachment_id: attachment_011CZn9WqL5sOt7XuZ3iErgC
                        filename: image.png
                        media_type: image/png
                        size_bytes: 48372
                        sha256: 4c1bcf6f2f7bfaca3ec682e417612c7d8ac3f6412cbb9fece749e3f0062e4f31
                    created_at: '2026-07-30T08:00:04Z'
                    completed_at: '2026-07-30T08:00:04Z'
              has_more: false
        - name: Pod 重启后读取 interrupted 终态
          payload:
            type: res
            id: history-interrupted-1
            ok: true
            payload:
              items:
                - type: message
                  history_seq: 30
                  run_id: run-interrupted-01
                  message:
                    message_id: message-interrupted-01
                    role: assistant
                    status: interrupted
                    content:
                      - type: text
                        text: 已完成并持久化的内容块
                    created_at: '2026-07-30T08:10:00Z'
                    completed_at: '2026-07-30T08:10:03Z'
                - type: run
                  history_seq: 31
                  run:
                    run_id: run-interrupted-01
                    outcome: interrupted
                    completed_at: '2026-07-30T08:10:03Z'
                    error:
                      code: RUN_INTERRUPTED
                      message: CampusAgent Runtime 重启后无法继续原 active run。
              has_more: false
        - name: active run 冲突
          payload:
            type: res
            id: send-2
            ok: false
            error:
              code: RUN_ACTIVE
              message: 当前 Session 已存在 active run。
              retryable: true
        - name: 附件仍在处理
          payload:
            type: res
            id: send-3
            ok: false
            error:
              code: ATTACHMENT_NOT_READY
              message: 附件处理尚未完成。
              retryable: true
              retry_after_ms: 1000
        - name: 当前模型不支持附件
          payload:
            type: res
            id: send-4
            ok: false
            error:
              code: ATTACHMENT_NOT_SUPPORTED
              message: 附件类型、数量或大小不符合当前模型输入策略。
              retryable: false
    ServerEventFrame:
      name: ServerEventFrame
      title: 有序 Session 事件
      description: 服务端在 Session 绑定成功后主动发送事件；调用方用连接级 seq 和 Run 级 run_seq 检测顺序与恢复位置。
      payload:
        $ref: '#/components/schemas/AnyEventFrame'
      examples:
        - name: 1 run 开始
          payload:
            type: event
            event: run.started
            seq: 1
            payload:
              agent_id: agent_011CZkYqphY8vELVzwCUpqiQ
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              run_id: run-01
              run_seq: 1
              timestamp: '2026-07-30T08:00:00Z'
              model_id: model_011CZq2GkV8aD4NwP7sLmXfR
              thinking: hidden
        - name: 2 Assistant Message 开始
          payload:
            type: event
            event: message.started
            seq: 2
            payload:
              agent_id: agent_011CZkYqphY8vELVzwCUpqiQ
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              run_id: run-01
              message_id: message-01
              run_seq: 2
              timestamp: '2026-07-30T08:00:00Z'
              role: assistant
        - name: 3 文本块开始
          payload:
            type: event
            event: message.updated
            seq: 3
            payload:
              agent_id: agent_011CZkYqphY8vELVzwCUpqiQ
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              run_id: run-01
              message_id: message-01
              run_seq: 3
              content_index: 0
              timestamp: '2026-07-30T08:00:01Z'
              update:
                type: text_start
        - name: 4 文本增量
          payload:
            type: event
            event: message.updated
            seq: 4
            payload:
              agent_id: agent_011CZkYqphY8vELVzwCUpqiQ
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              run_id: run-01
              message_id: message-01
              run_seq: 4
              content_index: 0
              timestamp: '2026-07-30T08:00:01Z'
              update:
                type: text_delta
                delta: 已发货
        - name: 5 文本块结束
          payload:
            type: event
            event: message.updated
            seq: 5
            payload:
              agent_id: agent_011CZkYqphY8vELVzwCUpqiQ
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              run_id: run-01
              message_id: message-01
              run_seq: 5
              content_index: 0
              timestamp: '2026-07-30T08:00:02Z'
              update:
                type: text_end
        - name: 6 Message 完成
          payload:
            type: event
            event: message.completed
            seq: 6
            payload:
              agent_id: agent_011CZkYqphY8vELVzwCUpqiQ
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              run_id: run-01
              message_id: message-01
              run_seq: 6
              timestamp: '2026-07-30T08:00:02Z'
              message:
                message_id: message-01
                role: assistant
                status: completed
                content:
                  - type: text
                    text: 已发货
                created_at: '2026-07-30T08:00:00Z'
                completed_at: '2026-07-30T08:00:02Z'
        - name: 7 run 完成
          payload:
            type: event
            event: run.completed
            seq: 7
            payload:
              agent_id: agent_011CZkYqphY8vELVzwCUpqiQ
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              run_id: run-01
              run_seq: 7
              timestamp: '2026-07-30T08:00:03Z'
              outcome: done
              stop_reason: stop
              usage:
                input_tokens: 230
                output_tokens: 48
                total_tokens: 278
        - name: Tool 开始事件携带完整脱敏 parameters
          payload:
            type: event
            event: tool.started
            seq: 100
            payload:
              agent_id: agent_011CZkYqphY8vELVzwCUpqiQ
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              run_id: run-tool-01
              run_seq: 3
              timestamp: '2026-07-30T08:20:00Z'
              tool_call_id: tool-call-01
              tool_id: order-query
              parameters:
                truncated: false
                value:
                  order_id: '20260730001'
        - name: Tool 完成事件携带截断结果引用
          payload:
            type: event
            event: tool.completed
            seq: 101
            payload:
              agent_id: agent_011CZkYqphY8vELVzwCUpqiQ
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              run_id: run-tool-01
              run_seq: 4
              timestamp: '2026-07-30T08:20:01Z'
              tool_call_id: tool-call-01
              tool_id: order-query
              status: done
              result:
                truncated: true
                preview: '{"orders":[...]}'
                original_size_bytes: 2097152
                result_ref: tool-result-opaque-01
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
    ConnectionId:
      allOf:
        - $ref: '#/components/schemas/Identifier'
      description: |
        服务端在 connect 成功响应中返回当前物理连接的 connection_id。调用方
        可用它关联连接日志和连接级序列；重连后服务端生成新值，它不作为
        Session、Message 或 Run 的持久归属键。
    SessionId:
      allOf:
        - $ref: '#/components/schemas/Identifier'
      description: |
        调用方在 connect 中提供上层会话服务生成的 session_id。服务端用它创建
        或恢复 CampusAgent Runtime Session。该值必须在 CampusAgent Runtime
        部署范围内全局唯一，删除
        后不得复用；推荐使用 UUIDv7 或 ULID，不接受仅在某个 tenant 或 user
        内唯一的短 ID。
    AgentId:
      type: string
      minLength: 30
      maxLength: 30
      pattern: '^agent_[0-9A-Za-z]{24}$'
      example: agent_011CZkYqphY8vELVzwCUpqiQ
      description: |
        Agent 元数据服务签发的、大小写敏感且不透明的资源 ID。agent-service
        只按本 Schema 解析并将完整值交给 Agent Manager 校验，不负责签发。
        调用方不得解析 24 位后缀、推断生成时间或其他业务含义，也不得依赖
        字典序进行新旧或优先级排序。调用方在 connect 中提供 agent_id，并在
        创建 CampusAgent Runtime Session 时固定绑定；恢复时，不一致的值导致
        请求失败。该 ID 不是授权凭据，逐请求授权仍由 Manager 执行。本前缀和
        正则是 CampusAgent 自身的协议约束，不代表
        Anthropic API 对资源 ID 的官方正则定义。
    ModelId:
      type: string
      minLength: 30
      maxLength: 30
      pattern: '^model_[0-9A-Za-z]{24}$'
      example: model_011CZq2GkV8aD4NwP7sLmXfR
      description: |
        model-service 签发的、大小写敏感且不透明的 CampusModel Manager 资源
        ID。agent-service 只按本 Schema 解析并将完整值交给 Model Manager
        校验，不负责签发。该资源在 Model Manager 内映射为私有
        provider_model_id/descriptor；
        Anthropic 等 Provider 自身的模型 ID 不是 `model_...` 资源 ID，也不直接
        暴露为本字段。调用方不得解析 24 位后缀、推断 Provider 或其他业务含义，
        也不得依赖字典序进行新旧或优先级排序。调用方在创建 Session 时提供
        model_id，或在恢复和 model.set 时请求切换；active run 存在时不执行
        切换，每个 run 固化实际使用的模型。该 ID 不是授权凭据，Agent-model
        允许关系仍由 Model Manager 校验。本前缀和正则是 CampusAgent 自身
        的协议约束，不代表 Anthropic API 对资源 ID 的官方正则定义。
    MessageId:
      allOf:
        - $ref: '#/components/schemas/Identifier'
      description: 服务端持久化一条消息时生成 message_id，并在消息事件及历史结果中返回。
    RunId:
      allOf:
        - $ref: '#/components/schemas/Identifier'
      description: |
        服务端首次接受新的 chat.send 时生成 run_id；同一 idempotency_key 且
        负载一致的重试返回原 run_id，负载不一致时返回 INVALID_REQUEST；连接
        断开或重连不会改变该值。
    ToolCallId:
      allOf:
        - $ref: '#/components/schemas/Identifier'
      description: |
        模型或 CampusAgent Runtime 为一个 run 内的工具调用提供 tool_call_id。
        服务端用它
        关联 toolcall 内容和 Tool Manager 事件；它不参与 Session 路由。
    AttachmentId:
      type: string
      minLength: 35
      maxLength: 35
      pattern: '^attachment_[0-9A-Za-z]{24}$'
      example: attachment_011CZm8VpK4rNs6WtY2hDqfB
      description: |
        上层 Attachment Service 在服务端签发的不透明资源 ID。固定前缀后是
        24 位 ASCII 大小写字母或数字，总长 35；ID 大小写敏感，客户端和
        Runtime 必须按原始字节比较，不得自行生成、转小写、解析后缀或推断
        时间、顺序和归属。

        一个 Attachment Service 部署内必须用经实际 openGauss/JDBC 验证的
        大小写敏感比较语义和数据库主键唯一约束保证全局唯一；生成碰撞时
        重新签发。唯一约束必须
        覆盖活动记录和永久 issued-ID/tombstone，物理删除不能释放 ID。ID 从
        签发起绑定同一上传记录，READY 后不得重新指向其他内容，DELETED 后
        不得复用。

        格式正确和全局唯一都不构成授权，也不扩展 CampusAgent Runtime
        Session 路由。每次首次接受的新 chat.send 仍必须结合不可变调用服务
        身份和当前 session_id 解析；已接受幂等重试直接读取冻结结果，不重新
        解析。调用方不能用 URL、路径或对象存储 key 替代该值。接受时冻结
        filename、media_type、size_bytes 和 sha256 元数据快照。
    AttachmentMediaType:
      type: string
      minLength: 3
      maxLength: 127
      pattern: '^[a-z0-9!#$&^_.+-]+/[a-z0-9!#$&^_.+-]+$'
      description: Attachment Service 通过内容嗅探得到并规范化为小写的可信 MIME type。
    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: Attachment Service 对不可变原始内容计算并验证的十六进制 SHA-256。
    RequestId:
      type: string
      minLength: 1
      maxLength: 128
      description: |
        调用方生成的连接内请求关联 ID。在同一物理连接的整个生命周期内不得
        重复使用。调用方用它保存 method 和预期成功 payload Schema；服务端
        可以乱序返回并发请求的 ResponseFrame，但每个可解析请求恰好返回一次。
    TraceParent:
      type: string
      minLength: 55
      maxLength: 128
      pattern: '^(?!ff-)[0-9a-f]{2}-(?!00000000000000000000000000000000-)[0-9a-f]{32}-(?!0000000000000000-)[0-9a-f]{16}-[0-9a-f]{2}(?:-.+)?$'
      description: |
        调用方可以在 RequestFrame 中提供 W3C traceparent。服务端收到请求后先
        执行 Schema 预检，再使用标准解析器校验完整规则；非法值返回
        INVALID_REQUEST。合法值只传播到遥测、Model Manager、Tool Manager 和
        Attachment Service 调用，不写入 Prompt、RuntimeSessionStore 或业务事件。
    IdempotencyKey:
      type: string
      minLength: 8
      maxLength: 128
      description: |
        副作用命令的幂等键，作用域为 session_id + method。Request 超时或连接
        中断后，调用方使用新的 RequestFrame.id 和原 idempotency_key 重试。
        traceparent 和 RequestFrame.id 不参与业务负载等价比较。服务端在
        Session 未删除期间保留已接受结果。chat.send 在执行 active-run 与附件
        当前状态检查前，先查询已接受的同 key 结果；接受前错误不占用幂等键。
    Timestamp:
      type: string
      format: date-time
    ThinkingLevel:
      type: string
      enum:
        - hidden
        - summary
        - full
      description: |
        当前连接的 thinking 投影级别。full 只有在 connect 返回的
        features.capabilities 包含 full_thinking 时才合法；capability 只开放
        选择上限，不会自动把级别切换为 full。
    ClientInfo:
      type: object
      additionalProperties: false
      description: |
        只用于可观测和协议兼容判断，不构成授权。本通道的调用方必须是
        mate-service、其他获授权服务端调用方或服务端 SDK；浏览器不得
        通过修改本字段直连 agent-service。
      required:
        - id
        - version
        - platform
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        version:
          type: string
          minLength: 1
          maxLength: 64
        platform:
          type: string
          enum:
            - sdk
            - service
    ClientCapabilities:
      type: array
      uniqueItems: true
      default: []
      description: |
        调用方可以在 connect 中声明可选增强能力；省略等价于空数组。协议 v2
        固定使用 typed structured delta，因此 delta 不属于 capability。
        当前已知值只有 full_thinking，它只表示客户端可以安全消费完整 thinking，
        不会自动把 Session 的 thinking 级别设为 full，也不构成披露授权。
        未知字符串允许发送，以便客户端前向演进；服务端忽略且不回显。
      x-known-capabilities:
        - full_thinking
      items:
        type: string
        minLength: 1
        maxLength: 128
    SessionConnectMode:
      type: string
      enum:
        - create
        - resume
      description: |
        调用方使用 create 请求幂等建立上层已经分配 session_id 的
        CampusAgent Runtime Session；使用 resume 只能恢复已有 Session，目标不存在时
        服务端返回
        SESSION_NOT_FOUND。
    ConnectParams:
      type: object
      additionalProperties: false
      description: |
        调用方在首个 connect Frame 中提供 mode、全局唯一 session_id、agent_id
        和客户端信息，并可声明可选 capabilities。使用 create 时还必须提供
        model_id；服务端
        对相同 Session、Agent 和 Model 的重试保持幂等。使用 resume 时服务端
        不创建缺失或已删除的 Session；只有不存在 active run 时，显式不同的
        model_id 才表示切换。同一 Pod 内已有活动连接时，新的
        resume 仍可以成功：服务端原子递增 connection generation、将读写权
        接管给新连接，再关闭旧连接。min_protocol 必须小于或等于 max_protocol；服务端
        选择双方共同支持的最高版本，本制品只支持 2。没有交集时返回
        UNSUPPORTED_PROTOCOL。create 请求的响应丢失时，调用方必须在新连接上
        使用完全相同的 session_id + agent_id + model_id 重试 mode=create；不得直接
        改用 resume，因为原 create 可能尚未提交。
      required:
        - mode
        - min_protocol
        - max_protocol
        - agent_id
        - session_id
        - client
      properties:
        mode:
          $ref: '#/components/schemas/SessionConnectMode'
        min_protocol:
          type: integer
          minimum: 1
        max_protocol:
          type: integer
          minimum: 1
        agent_id:
          $ref: '#/components/schemas/AgentId'
        session_id:
          $ref: '#/components/schemas/SessionId'
        model_id:
          $ref: '#/components/schemas/ModelId'
          description: 调用方在 create 时必须提供；在 resume 时可以省略以沿用保存值，也可以显式请求切换。
        client:
          $ref: '#/components/schemas/ClientInfo'
        capabilities:
          $ref: '#/components/schemas/ClientCapabilities'
      allOf:
        - if:
            properties:
              mode:
                const: create
          then:
            required:
              - model_id
    ConnectRequest:
      type: object
      additionalProperties: false
      description: |
        必须是 101 后五秒内的首个 Text Message。connect 成功 Response 写出前
        不得发送其他 RequestFrame。任何 connect 失败都会先在可关联时返回
        ErrorResponseFrame，再关闭尚未绑定的连接：协议无交集使用 1002，暂时
        不可用使用 1013，其他身份、参数或绑定失败使用 1008。
      required:
        - type
        - id
        - method
        - params
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: connect
        params:
          $ref: '#/components/schemas/ConnectParams'
    ChatSendParams:
      type: object
      additionalProperties: false
      description: |
        幂等负载由 message、attachment_ids 的顺序和值以及 thinking 是否省略和
        具体值共同决定；message 省略与空字符串规范化为同一值，
        attachment_ids 省略与空数组也规范化为同一值。RequestFrame.id 和
        traceparent 不参与。相同 key 携带
        不同幂等负载返回 INVALID_REQUEST。服务端先返回已经接受的同 key 结果，
        再处理 RUN_ACTIVE 或重新解析附件；首次请求只有在全部附件原子解析为
        可信元数据快照且 Attachment Service 已在 openGauss 中单向设置
        referenced_at，并验证
        “有效历史附件 + 本次新附件”的完整 AttachmentContextPlan 符合模型输入
        策略、持久化用户消息后，才可以提交 accepted=true。
        message 可以省略或为空字符串，但此时 attachment_ids 必须非空；
        服务端不得为仅附件消息合成隐藏的默认 Prompt。message 非空且
        附件非空时，持久化的用户 Message 必须先保存文本，再按请求顺序
        保存附件快照。
      required:
        - idempotency_key
      properties:
        message:
          type: string
          maxLength: 262144
          description: |
            可选用户文本。省略或空字符串仅在 attachment_ids 非空时合法。
            字符上限不是线上的最终大小判断；调用方还必须确保完整
            JSON Text Message 的 UTF-8 字节数不超过 connect 返回的
            max_message_bytes。
        attachment_ids:
          type: array
          default: []
          maxItems: 32
          uniqueItems: true
          description: |
            已由上层 Attachment Service 绑定当前 session_id 的不透明 ID。数组
            省略或为空表示没有附件。协议 2 对附件引用不要求 capability；32 是
            线协议硬上限，当前 ModelSummary.input 可能给出更低的有效数量和
            字节限制。调用方不得同时提交 URL、MIME、文件名或 Base64。
            服务端必须保留数组顺序，并按同一顺序写入用户 Message 的
            AttachmentContent。
          items:
            $ref: '#/components/schemas/AttachmentId'
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
        thinking:
          $ref: '#/components/schemas/ThinkingLevel'
          description: |
            省略时使用当前连接看到的 Session 默认级别。显式值只能低于或等于
            该默认级别；请求更高值返回 FORBIDDEN，不执行静默降级。
      anyOf:
        - required:
            - message
          properties:
            message:
              minLength: 1
        - required:
            - attachment_ids
          properties:
            attachment_ids:
              minItems: 1
    ChatSendRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
        - params
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: chat.send
        params:
          $ref: '#/components/schemas/ChatSendParams'
    ChatSteerParams:
      type: object
      additionalProperties: false
      description: |
        v1 服务 API 的 steering 只接受非空文本，不接受 attachment_ids。
        需要增加附件时，调用方必须等当前 run 结束后发起新的 chat.send。
      required:
        - run_id
        - message
        - idempotency_key
      properties:
        run_id:
          $ref: '#/components/schemas/RunId'
        message:
          type: string
          minLength: 1
          maxLength: 262144
          description: |
            Steering 文本。字符上限不是线上的最终大小判断；调用方还必须
            确保完整 JSON Text Message 的 UTF-8 字节数不超过 connect 返回的
            max_message_bytes。
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
    ChatSteerRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
        - params
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: chat.steer
        params:
          $ref: '#/components/schemas/ChatSteerParams'
    ChatAbortParams:
      type: object
      additionalProperties: false
      required:
        - run_id
        - idempotency_key
      properties:
        run_id:
          $ref: '#/components/schemas/RunId'
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
    ChatAbortRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
        - params
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: chat.abort
        params:
          $ref: '#/components/schemas/ChatAbortParams'
    ChatHistoryFirstPageParams:
      type: object
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        run_id:
          $ref: '#/components/schemas/RunId'
          description: 只返回指定 run 的 Message 和 RunRecord；active-run 同步时必须使用。
        through_history_seq:
          type: integer
          minimum: 0
          description: |
            首页查询的包含性 history_seq 上界。active_run 恢复时传入快照返回的
            history_seq。
    ChatHistoryCursorParams:
      type: object
      additionalProperties: false
      required:
        - cursor
      properties:
        cursor:
          type: string
          minLength: 1
          maxLength: 1024
          description: 服务端上一页返回的不透明游标；它已固定首页的过滤条件和上界。
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
    ChatHistoryParams:
      oneOf:
        - $ref: '#/components/schemas/ChatHistoryFirstPageParams'
        - $ref: '#/components/schemas/ChatHistoryCursorParams'
      description: 首页可设置 run_id 和水位；后续页只使用不透明 cursor，不重复或变更过滤条件。
    ChatHistoryRequest:
      type: object
      additionalProperties: false
      description: |
        读取当前 Session 的权威持久历史。省略 cursor 时返回查询时刻最新的一页；
        next_cursor 用于继续读取更早的数据。每页 items 按 history_seq 从旧到新
        排列，游标不透明、固定首次查询的过滤条件和上界，分页不重叠。
        active-run 恢复必须在首页提交 snapshot.run_id 和
        snapshot.history_seq，并在应用 post-snapshot 事件前读完该过滤历史。
      required:
        - type
        - id
        - method
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: chat.history
        params:
          $ref: '#/components/schemas/ChatHistoryParams'
    SessionGetRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: session.get
    ModelsListRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: models.list
    ModelSetParams:
      type: object
      additionalProperties: false
      description: |
        active run 期间拒绝。服务端在持久化切换前，为当前有效 transcript 生成
        AttachmentContextPlan；若任何仍会进入下一次模型调用的历史附件不符合
        目标 ModelSummary.input，返回 ATTACHMENT_NOT_SUPPORTED 且保持原模型。
      required:
        - model_id
      properties:
        model_id:
          $ref: '#/components/schemas/ModelId'
    ModelSetRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
        - params
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: model.set
        params:
          $ref: '#/components/schemas/ModelSetParams'
    ThinkingSetParams:
      type: object
      additionalProperties: false
      description: |
        修改 Session 默认披露级别。请求 full 时，当前 connect 的有效 capability
        必须包含 full_thinking；否则返回 FORBIDDEN。active run 存在时返回
        RUN_ACTIVE。服务端不静默降级请求值。
      required:
        - level
      properties:
        level:
          $ref: '#/components/schemas/ThinkingLevel'
    ThinkingSetRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
        - params
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: thinking.set
        params:
          $ref: '#/components/schemas/ThinkingSetParams'
    AnyRequestFrame:
      oneOf:
        - $ref: '#/components/schemas/ConnectRequest'
        - $ref: '#/components/schemas/ChatSendRequest'
        - $ref: '#/components/schemas/ChatSteerRequest'
        - $ref: '#/components/schemas/ChatAbortRequest'
        - $ref: '#/components/schemas/ChatHistoryRequest'
        - $ref: '#/components/schemas/SessionGetRequest'
        - $ref: '#/components/schemas/ModelsListRequest'
        - $ref: '#/components/schemas/ModelSetRequest'
        - $ref: '#/components/schemas/ThinkingSetRequest'
    ModelInputPolicy:
      type: object
      additionalProperties: false
      description: |
        Model Manager 返回的当前 Agent 与 Model 的有效输入策略。调用方用它在
        上传和 chat.send 前完成 UI 预检；CampusAgent Runtime 仍以 Attachment Service
        返回的可信大小和 MIME 重新校验。数量和字节限制作用于下一次模型调用
        的完整 AttachmentContextPlan，包括当前有效 transcript 中仍保留的历史
        附件与本次新附件，而不只是 attachment_ids。max_attachments=0 表示该模型只接受
        无附件消息，此时 media type 数组和两个字节限制都必须为空或为零。
      required:
        - modalities
        - attachment_media_types
        - max_attachments
        - max_attachment_bytes
        - max_total_attachment_bytes
      properties:
        modalities:
          type: array
          minItems: 1
          uniqueItems: true
          contains:
            const: text
          items:
            type: string
            enum:
              - text
              - image
              - document
          description: |
            当前有效 Model 能消费的规范化输入模态。CampusAgent 的对话模型必须
            支持 text，但单次 chat.send 可以只包含附件；CampusAgent Runtime
            不为此类请求合成隐藏文本。
        attachment_media_types:
          type: array
          maxItems: 128
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AttachmentMediaType'
          description: 经过 Agent、Model、部署和 Attachment Service 策略求交集后的精确 MIME allowlist。
        max_attachments:
          type: integer
          minimum: 0
          maximum: 32
        max_attachment_bytes:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        max_total_attachment_bytes:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      allOf:
        - if:
            properties:
              max_attachments:
                const: 0
            required:
              - max_attachments
          then:
            properties:
              modalities:
                maxItems: 1
              attachment_media_types:
                maxItems: 0
              max_attachment_bytes:
                const: 0
              max_total_attachment_bytes:
                const: 0
        - if:
            properties:
              max_attachments:
                minimum: 1
            required:
              - max_attachments
          then:
            properties:
              attachment_media_types:
                minItems: 1
              max_attachment_bytes:
                minimum: 1
              max_total_attachment_bytes:
                minimum: 1
              modalities:
                anyOf:
                  - contains:
                      const: image
                  - contains:
                      const: document
      x-runtime-constraints:
        - max_attachment_bytes must be less than or equal to max_total_attachment_bytes
        - MIME, count and byte checks use trusted Attachment Service metadata, not Frame metadata
    ModelSummary:
      type: object
      additionalProperties: false
      required:
        - model_id
        - name
        - input
      properties:
        model_id:
          $ref: '#/components/schemas/ModelId'
        name:
          type: string
          minLength: 1
          maxLength: 256
        reasoning:
          type: boolean
        context_window:
          type: integer
          minimum: 1
        max_output_tokens:
          type: integer
          minimum: 1
        input:
          $ref: '#/components/schemas/ModelInputPolicy'
    SessionSummary:
      type: object
      additionalProperties: false
      required:
        - state
        - thinking
      properties:
        state:
          type: string
          enum:
            - idle
            - running
        thinking:
          $ref: '#/components/schemas/ThinkingLevel'
          description: 当前连接经过 capability 与授权上限投影后的 Session 默认值。
    ConnectionLimits:
      type: object
      additionalProperties: false
      required:
        - max_message_bytes
        - max_connection_buffer_bytes
        - heartbeat_seconds
        - pong_timeout_seconds
        - connect_timeout_seconds
      properties:
        max_message_bytes:
          type: integer
          minimum: 1024
          default: 1048576
          description: |
            一个完整 WebSocket Text Message 在解压、重组并编码为 UTF-8 JSON 后
            的最大字节数；不是底层分片数量或单个 wire frame 的上限。
        max_connection_buffer_bytes:
          type: integer
          minimum: 1024
          default: 4194304
        heartbeat_seconds:
          type: integer
          minimum: 1
          default: 20
        pong_timeout_seconds:
          type: integer
          minimum: 1
          default: 10
        connect_timeout_seconds:
          type: integer
          minimum: 1
          default: 5
    NegotiatedMethods:
      type: array
      minItems: 1
      uniqueItems: true
      contains:
        const: chat.history
      description: |
        服务端在 connect 成功响应中返回当前连接可发现的方法，并按本 Schema
        的枚举顺序稳定排列。调用方可据此决定展示哪些功能；服务端仍对每个
        请求重新执行状态和权限校验。chat.history 是快照恢复的必备方法，
        每个成功 connect 的列表都必须包含；调用服务无权读取投影历史时，
        服务端必须拒绝 connect，不得返回无法恢复的连接。
        协议 2 不提供 prompt_templates.list 或 skills.list。`/skill:name`
        作为 chat.send.message 的普通文本由 AgentSession 展开；Skill 和模板的
        展示信息由 mate-service 或元数据 REST API 提供。
      items:
        type: string
        enum:
          - chat.send
          - chat.steer
          - chat.abort
          - chat.history
          - session.get
          - models.list
          - model.set
          - thinking.set
    NegotiatedEvents:
      type: array
      minItems: 8
      maxItems: 8
      uniqueItems: true
      description: |
        协议 2 的 Chat 事件族是不可拆分的完整集合，服务端按本
        Schema 的枚举顺序稳定返回全部八项。若不能提供完整集合，
        connect 必须失败，不得建立一条无法判定 Message 或 run 终态的连接。
      items:
        type: string
        enum:
          - run.started
          - message.started
          - message.updated
          - tool.started
          - tool.updated
          - tool.completed
          - message.completed
          - run.completed
    EffectiveCapabilities:
      type: array
      uniqueItems: true
      description: |
        服务端根据客户端声明、服务能力和当前授权计算可选增强能力的交集，并
        在 connect 成功响应中返回。空数组表示没有可选增强，不影响协议 v2
        固有的 typed structured delta。只有调用服务 scope、Agent、Model、
        可选委托披露上限和客户端声明全部允许时，结果才包含 full_thinking。
      items:
        type: string
        enum:
          - full_thinking
    NegotiatedFeatures:
      type: object
      additionalProperties: false
      required:
        - methods
        - events
        - capabilities
      properties:
        methods:
          $ref: '#/components/schemas/NegotiatedMethods'
        events:
          $ref: '#/components/schemas/NegotiatedEvents'
        capabilities:
          $ref: '#/components/schemas/EffectiveCapabilities'
    TextContent:
      type: object
      additionalProperties: false
      required:
        - type
        - text
      properties:
        type:
          const: text
        text:
          type: string
          minLength: 1
    ThinkingContent:
      type: object
      additionalProperties: false
      required:
        - type
        - disclosure
      properties:
        type:
          const: thinking
        text:
          type: string
          minLength: 1
        disclosure:
          type: string
          enum:
            - hidden
            - summary
            - full
      allOf:
        - if:
            properties:
              disclosure:
                const: hidden
            required:
              - disclosure
          then:
            not:
              required:
                - text
        - if:
            properties:
              disclosure:
                const: full
            required:
              - disclosure
          then:
            required:
              - text
      description: |
        Thinking 内容块始终占用原 content_index，因此 hidden 投影也保留
        一个不含 text 的占位块，后续可见块的索引不会前移。disclosure=summary
        时 text 可选：只有 Model Manager 明确提供非空安全摘要时才携带；没有
        安全摘要时省略 text，不从原始 thinking 合成文字或伪造占位文案。
        disclosure=full 只允许出现在有效 capability 包含 full_thinking 的连接投影中。
    ToolResultRef:
      type: string
      minLength: 1
      maxLength: 256
      description: |
        agent-service 为已持久的完整脱敏工具值生成的不透明引用。
        调用方不得解析或将它当作 URL、存储 key 或授权凭据；服务 API v1
        不提供通过 result_ref 读取完整值的公开接口。
    CompleteToolValueProjection:
      type: object
      additionalProperties: false
      required:
        - truncated
        - value
      properties:
        truncated:
          const: false
        value: {}
      description: |
        脱敏后的完整业务 parameters 或 result。服务端必须先移除凭据、
        内部 Header、执行器秘密和不允许披露的字段，再计算规范化 JSON
        UTF-8 字节数。value 最多 524288 字节，且只有完整 Frame 不超过
        协商上限时才使用此形态。
      x-maxValueSerializedBytes: 524288
    TruncatedToolValueProjection:
      type: object
      additionalProperties: false
      required:
        - truncated
        - preview
        - original_size_bytes
        - result_ref
      properties:
        truncated:
          const: true
        preview:
          type: string
          maxLength: 65536
          description: 对完整脱敏值生成的有界文本预览；不保证本身是可解析 JSON。
          x-maxUtf8Bytes: 65536
        original_size_bytes:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: 完整脱敏值的规范化 JSON UTF-8 字节数。
        result_ref:
          $ref: '#/components/schemas/ToolResultRef'
      description: |
        完整脱敏值会导致 Frame 超限时的有界投影。agent-service 先将
        完整脱敏值保存到 RuntimeSessionStore，再在 WebSocket 事件和历史中
        返回本对象。
    ToolValueProjection:
      oneOf:
        - $ref: '#/components/schemas/CompleteToolValueProjection'
        - $ref: '#/components/schemas/TruncatedToolValueProjection'
      description: |
        工具业务值的唯一对外投影。`truncated=false` 时 value 是完整脱敏值；
        `truncated=true` 时只返回预览和不透明引用。两种形态都不得包含凭据、
        内部 Header 或执行器秘密。
    CompleteToolParametersProjection:
      allOf:
        - $ref: '#/components/schemas/CompleteToolValueProjection'
        - type: object
          properties:
            value:
              type: object
              additionalProperties: true
      description: 完整脱敏 parameters；value 必须是 JSON object。
    ToolParametersProjection:
      oneOf:
        - $ref: '#/components/schemas/CompleteToolParametersProjection'
        - $ref: '#/components/schemas/TruncatedToolValueProjection'
      description: 工具 parameters 的完整脱敏投影或超限引用投影。
    ToolCallContent:
      type: object
      additionalProperties: false
      required:
        - type
        - tool_call_id
        - tool_id
        - arguments
      properties:
        type:
          const: tool_call
        tool_call_id:
          $ref: '#/components/schemas/ToolCallId'
        tool_id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
          minLength: 1
          maxLength: 256
        arguments:
          $ref: '#/components/schemas/ToolParametersProjection'
    ToolResultContent:
      type: object
      additionalProperties: false
      required:
        - type
        - tool_call_id
        - status
      properties:
        type:
          const: tool_result
        tool_call_id:
          $ref: '#/components/schemas/ToolCallId'
        status:
          type: string
          enum:
            - done
            - error
            - aborted
        result:
          $ref: '#/components/schemas/ToolValueProjection'
        error:
          $ref: '#/components/schemas/Error'
      allOf:
        - if:
            properties:
              status:
                const: done
            required:
              - status
          then:
            required:
              - result
            not:
              required:
                - error
        - if:
            properties:
              status:
                const: error
            required:
              - status
          then:
            required:
              - error
            not:
              required:
                - result
        - if:
            properties:
              status:
                const: aborted
            required:
              - status
          then:
            not:
              anyOf:
                - required:
                    - result
                - required:
                    - error
    AttachmentContent:
      type: object
      additionalProperties: false
      description: |
        已接受用户消息中的稳定附件快照，用于 RuntimeSessionStore、
        chat.history 和 UI 恢复。
        字段来自 Attachment Service 的可信描述，不来自 chat.send。它只允许
        出现在 role=user 的持久化 Message；不包含 URL、OBS Bucket、认证凭据、
        预签名 URL、Base64 或任何运行时凭据。filename 仅用于转义后的 UI
        显示，不能解释为路径。
      required:
        - type
        - attachment_id
        - filename
        - media_type
        - size_bytes
        - sha256
      properties:
        type:
          const: attachment
        attachment_id:
          $ref: '#/components/schemas/AttachmentId'
        filename:
          type: string
          minLength: 1
          maxLength: 512
          pattern: '^[^\x00-\x1F\x7F/\\]+$'
          description: Attachment Service 清理控制字符后的显示名；调用方渲染时仍必须转义。
        media_type:
          $ref: '#/components/schemas/AttachmentMediaType'
        size_bytes:
          type: integer
          minimum: 1
          maximum: 20971520
        sha256:
          $ref: '#/components/schemas/Sha256'
    ProjectedMessage:
      type: object
      additionalProperties: false
      description: |
        CampusAgent Runtime 对客户端和历史返回的权威 Message。AttachmentContent
        只允许出现
        在 role=user 的 content 中，并表示 chat.send 接受时保存的可信
        元数据快照；
        assistant/tool Message 不得生成附件引用。status=interrupted 只用于
        CampusAgent Runtime 重启对账；content 只包含已到达 text_end、thinking_end、
        toolcall_end 或工具终态边界且已持久化的完整块。
      required:
        - message_id
        - role
        - status
        - content
        - created_at
      properties:
        message_id:
          $ref: '#/components/schemas/MessageId'
        role:
          type: string
          enum:
            - user
            - assistant
            - tool
        status:
          type: string
          enum:
            - streaming
            - completed
            - aborted
            - error
            - interrupted
        content:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/TextContent'
              - $ref: '#/components/schemas/ThinkingContent'
              - $ref: '#/components/schemas/ToolCallContent'
              - $ref: '#/components/schemas/ToolResultContent'
              - $ref: '#/components/schemas/AttachmentContent'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        completed_at:
          $ref: '#/components/schemas/Timestamp'
      allOf:
        - if:
            properties:
              role:
                const: user
            required:
              - role
          then:
            properties:
              status:
                const: completed
              content:
                oneOf:
                  - type: array
                    minItems: 1
                    maxItems: 1
                    items:
                      - $ref: '#/components/schemas/TextContent'
                    additionalItems: false
                    description: 仅文本。
                  - type: array
                    minItems: 1
                    maxItems: 32
                    items:
                      $ref: '#/components/schemas/AttachmentContent'
                    description: 仅附件；服务端不插入隐藏默认文本。
                  - type: array
                    minItems: 2
                    maxItems: 33
                    items:
                      - $ref: '#/components/schemas/TextContent'
                    additionalItems:
                      $ref: '#/components/schemas/AttachmentContent'
                    description: 文本固定在第一项，附件保持 chat.send 的顺序。
        - if:
            properties:
              role:
                enum:
                  - assistant
                  - tool
            required:
              - role
          then:
            properties:
              content:
                not:
                  contains:
                    $ref: '#/components/schemas/AttachmentContent'
    TerminalProjectedMessage:
      allOf:
        - $ref: '#/components/schemas/ProjectedMessage'
        - type: object
          required:
            - completed_at
          properties:
            status:
              type: string
              enum:
                - completed
                - aborted
                - error
                - interrupted
      description: |
        message.completed 和 chat.history 使用的终态 Message；status 不得为
        streaming。interrupted Message 的 completed_at 是 CampusAgent Runtime 将旧
        running 记录对账为中断终态的时间。
    StreamingProjectedMessage:
      allOf:
        - $ref: '#/components/schemas/ProjectedMessage'
        - type: object
          properties:
            status:
              const: streaming
      description: active-run 快照中当前未完成的 Assistant Message。
    OpenTextContentState:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          const: text
    OpenThinkingContentState:
      type: object
      additionalProperties: false
      required:
        - type
        - disclosure
      properties:
        type:
          const: thinking
        disclosure:
          type: string
          enum:
            - hidden
            - summary
            - full
    OpenToolCallContentState:
      type: object
      additionalProperties: false
      required:
        - type
        - tool_call_id
        - tool_id
        - arguments_delta
      properties:
        type:
          const: tool_call
        tool_call_id:
          $ref: '#/components/schemas/ToolCallId'
        tool_id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
          maxLength: 256
        arguments_delta:
          type: string
          maxLength: 262144
          description: 已累计但可能仍不是合法 JSON 的参数文本；最终以 toolcall_end.arguments 为准。
    OpenContentState:
      oneOf:
        - $ref: '#/components/schemas/OpenTextContentState'
        - $ref: '#/components/schemas/OpenThinkingContentState'
        - $ref: '#/components/schemas/OpenToolCallContentState'
    ActiveTool:
      type: object
      additionalProperties: false
      required:
        - tool_call_id
        - tool_id
        - status
        - parameters
      properties:
        tool_call_id:
          $ref: '#/components/schemas/ToolCallId'
        tool_id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
          maxLength: 256
        status:
          type: string
          enum:
            - starting
            - running
        parameters:
          $ref: '#/components/schemas/ToolParametersProjection'
          description: 开始执行前已经完成脱敏和大小投影的业务 parameters。
    ActiveRunSnapshot:
      type: object
      additionalProperties: false
      required:
        - run_id
        - run_seq
        - history_seq
        - model_id
        - thinking
        - message_snapshot
        - open_contents
        - active_tools
      properties:
        run_id:
          $ref: '#/components/schemas/RunId'
        run_seq:
          type: integer
          minimum: 0
          description: 快照已经包含的最后一个 run_seq；后续只发送更大的值。
        history_seq:
          type: integer
          minimum: 0
          description: |
            快照临界区已持久化的最大 history_seq。客户端在应用快照前使用
            chat.history(run_id, through_history_seq) 读取不超过该值的当前 run
            终态 Message，以恢复用户消息、先前完成的 Assistant Message 和
            ToolResult。
        model_id:
          $ref: '#/components/schemas/ModelId'
        thinking:
          $ref: '#/components/schemas/ThinkingLevel'
          description: 当前连接对该 run 冻结 thinking 级别的有效投影。
        message_snapshot:
          oneOf:
            - $ref: '#/components/schemas/StreamingProjectedMessage'
            - type: 'null'
          description: |
            当前未完成 Assistant Message 的完整可见投影。run 已建立但尚未发生
            message.started 时为 null。先前已完成的 Message 通过上述 history_seq
            水位读取，而不在此字段重复。
        open_contents:
          type: object
          propertyNames:
            pattern: '^(0|[1-9][0-9]*)$'
          additionalProperties:
            $ref: '#/components/schemas/OpenContentState'
          description: |
            快照时刻已 start 但尚未 end 的内容块；对象 key 是十进制
            content_index，因此同一索引不可重复。客户端先应用历史水位和
            message_snapshot，再据此初始化开放块，随后只归并 run_seq 大于
            快照值的 delta。message_snapshot 为 null 时该对象必须为空。
        active_tools:
          type: array
          items:
            $ref: '#/components/schemas/ActiveTool'
      allOf:
        - if:
            properties:
              message_snapshot:
                type: 'null'
            required:
              - message_snapshot
          then:
            properties:
              open_contents:
                maxProperties: 0
    ConnectResult:
      type: object
      additionalProperties: false
      required:
        - protocol
        - connection_id
        - connection_generation
        - agent_id
        - session_id
        - model
        - session
        - limits
        - features
        - active_run
      properties:
        protocol:
          const: 2
        connection_id:
          $ref: '#/components/schemas/ConnectionId'
        connection_generation:
          type: integer
          minimum: 1
          description: |
            服务端在同一 Pod 内为每次成功 create/resume 分配的单调代次。
            新 resume 先原子接管读写权并递增此值，再用
            `4409 SESSION_REPLACED` 关闭旧连接。它不是跨 Pod owner 或
            分布式 fencing token。
        agent_id:
          $ref: '#/components/schemas/AgentId'
        session_id:
          $ref: '#/components/schemas/SessionId'
        model:
          $ref: '#/components/schemas/ModelSummary'
        session:
          $ref: '#/components/schemas/SessionSummary'
        limits:
          $ref: '#/components/schemas/ConnectionLimits'
        features:
          $ref: '#/components/schemas/NegotiatedFeatures'
        active_run:
          oneOf:
            - $ref: '#/components/schemas/ActiveRunSnapshot'
            - type: 'null'
      description: |
        session.state=running 当且仅当 active_run 非 null；session.state=idle 当且
        仅当 active_run 为 null。connect Response 必须先于新连接上的任何
        EventFrame 写出。resume 成功时，返回的 connection_generation 已经是
        接管后的权威代次。
    ChatSendResult:
      type: object
      additionalProperties: false
      description: |
        accepted=true 表示用户消息已持久化、run_id 已分配且 active-run 占位已
        原子提交；随后即使连接断开，持有该 run 的同一 Pod 仍继续执行。
        这不承诺 Pod 重启或跨 Pod 路由后继续。服务端必须先向发起连接写出
        本 ResponseFrame，再向该连接写出该 run 的 run.started。同一
        idempotency_key 的等价重试优先返回原结果，
        不因原 run 已处于 active 状态或 Attachment Service 当前不可用而返回
        RUN_ACTIVE 或重新校验失败。存在附件时，accepted=true 还表示用户消息已经
        保存可信附件
        元数据快照，且 Attachment Service 已在同一 openGauss 事务中为整批
        资源原子设置 referenced_at。Runtime 后续通过内部 content API 流式
        读取正文，不获得 OBS Bucket、凭据或预签名 URL。
      required:
        - run_id
        - user_message_id
        - accepted
      properties:
        run_id:
          $ref: '#/components/schemas/RunId'
        user_message_id:
          $ref: '#/components/schemas/MessageId'
          description: |
            服务端已经持久化的权威用户消息 ID。调用方用它替换本地乐观消息的
            临时 ID；同一 idempotency_key 的等价重试返回相同值。
        accepted:
          type: boolean
          const: true
    ChatSteerResult:
      type: object
      additionalProperties: false
      required:
        - run_id
        - user_message_id
        - accepted
        - idempotent
      properties:
        run_id:
          $ref: '#/components/schemas/RunId'
        user_message_id:
          $ref: '#/components/schemas/MessageId'
        accepted:
          type: boolean
        idempotent:
          type: boolean
    ChatAbortResult:
      type: object
      additionalProperties: false
      required:
        - run_id
        - accepted
        - idempotent
      properties:
        run_id:
          $ref: '#/components/schemas/RunId'
        accepted:
          type: boolean
        idempotent:
          type: boolean
    RunRecord:
      type: object
      additionalProperties: false
      required:
        - run_id
        - outcome
        - completed_at
      properties:
        run_id:
          $ref: '#/components/schemas/RunId'
        outcome:
          type: string
          enum:
            - done
            - aborted
            - error
            - interrupted
        completed_at:
          $ref: '#/components/schemas/Timestamp'
        usage:
          $ref: '#/components/schemas/Usage'
        stop_reason:
          type: string
          maxLength: 256
        error:
          $ref: '#/components/schemas/RunTerminalError'
      allOf:
        - if:
            properties:
              outcome:
                const: error
            required:
              - outcome
          then:
            required:
              - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
        - if:
            properties:
              outcome:
                const: interrupted
            required:
              - outcome
          then:
            required:
              - error
            properties:
              error:
                $ref: '#/components/schemas/RunInterruptedError'
        - if:
            properties:
              outcome:
                enum:
                  - done
                  - aborted
            required:
              - outcome
          then:
            not:
              required:
                - error
      description: |
        run.completed 的持久化投影。outcome=error 或 interrupted 时必须携带
        error；outcome=done 或 aborted 时不得携带 error。Pod 重启后，
        RuntimeSessionStore 中仍标记为 running 但无法继续的旧 run 必须对账为
        interrupted，并使用 RUN_INTERRUPTED 结构化错误。调用方按 run_id 与
        实时状态对账。
    HistoryMessageItem:
      type: object
      additionalProperties: false
      required:
        - type
        - history_seq
        - run_id
        - message
      properties:
        type:
          const: message
        history_seq:
          type: integer
          minimum: 1
        run_id:
          $ref: '#/components/schemas/RunId'
        message:
          $ref: '#/components/schemas/TerminalProjectedMessage'
    HistoryRunItem:
      type: object
      additionalProperties: false
      required:
        - type
        - history_seq
        - run
      properties:
        type:
          const: run
        history_seq:
          type: integer
          minimum: 1
        run:
          $ref: '#/components/schemas/RunRecord'
    HistoryItem:
      oneOf:
        - $ref: '#/components/schemas/HistoryMessageItem'
        - $ref: '#/components/schemas/HistoryRunItem'
    HistoryResult:
      type: object
      additionalProperties: false
      required:
        - items
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HistoryItem'
          description: |
            同一页内按 history_seq 从旧到新排列。调用方按 message_id 和 run_id
            去重并以较新的权威投影覆盖本地状态。用户 Message 中的
            AttachmentContent 是接受时的可信不可变快照，调用方据此恢复文件
            卡片，不能据此构造对象存储 URL。
        next_cursor:
          type: string
          minLength: 1
          maxLength: 1024
        has_more:
          type: boolean
      allOf:
        - if:
            properties:
              has_more:
                const: true
            required:
              - has_more
          then:
            required:
              - next_cursor
        - if:
            properties:
              has_more:
                const: false
            required:
              - has_more
          then:
            not:
              required:
                - next_cursor
    SessionGetResult:
      type: object
      additionalProperties: false
      required:
        - agent_id
        - session_id
        - model
        - session
        - active_run
      properties:
        agent_id:
          $ref: '#/components/schemas/AgentId'
        session_id:
          $ref: '#/components/schemas/SessionId'
        model:
          $ref: '#/components/schemas/ModelSummary'
        session:
          $ref: '#/components/schemas/SessionSummary'
        active_run:
          oneOf:
            - $ref: '#/components/schemas/ActiveRunSnapshot'
            - type: 'null'
    ModelsListResult:
      type: object
      additionalProperties: false
      required:
        - models
        - effective_model_id
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelSummary'
        effective_model_id:
          $ref: '#/components/schemas/ModelId'
    ModelSetResult:
      type: object
      additionalProperties: false
      description: 目标模型已通过当前 AttachmentContextPlan 校验并持久化为 Session 有效模型。
      required:
        - model
      properties:
        model:
          $ref: '#/components/schemas/ModelSummary'
    ThinkingSetResult:
      type: object
      additionalProperties: false
      required:
        - thinking
      properties:
        thinking:
          $ref: '#/components/schemas/ThinkingLevel'
    SuccessPayload:
      oneOf:
        - $ref: '#/components/schemas/ConnectResult'
        - $ref: '#/components/schemas/ChatSendResult'
        - $ref: '#/components/schemas/ChatSteerResult'
        - $ref: '#/components/schemas/ChatAbortResult'
        - $ref: '#/components/schemas/HistoryResult'
        - $ref: '#/components/schemas/SessionGetResult'
        - $ref: '#/components/schemas/ModelsListResult'
        - $ref: '#/components/schemas/ModelSetResult'
        - $ref: '#/components/schemas/ThinkingSetResult'
    ErrorCode:
      type: string
      minLength: 1
      maxLength: 128
      description: |
        当前稳定错误码如下。调用方必须为未知字符串保留 UNKNOWN 分支；新增
        可恢复错误码不改变 Frame 结构，不能导致客户端反序列化失败。
        INVALID_ATTACHMENT 同时覆盖不存在、越权、未绑定、删除、过期、
        BLOCKED 和 FAILED，避免资源枚举或安全状态泄露；
        ATTACHMENT_NOT_READY 只在调用服务与 Session 授权通过后返回，
        通常 retryable=true；ATTACHMENT_NOT_SUPPORTED 表示可信类型、数量或
        字节数不符合当前有效 ModelInputPolicy，调用方应更换模型或附件。
        RUN_INTERRUPTED 不是请求错误码，只能出现在 RunInterruptedError。
      not:
        const: RUN_INTERRUPTED
      x-known-values:
        - INVALID_REQUEST
        - UNAUTHENTICATED
        - FORBIDDEN
        - UNSUPPORTED_PROTOCOL
        - AGENT_NOT_FOUND
        - SESSION_NOT_FOUND
        - MODEL_REQUIRED
        - MODEL_NOT_ALLOWED
        - RUN_ACTIVE
        - RUN_NOT_FOUND
        - INVALID_ATTACHMENT
        - ATTACHMENT_NOT_READY
        - ATTACHMENT_NOT_SUPPORTED
        - MANAGER_AUTH_FAILED
        - MANAGER_UNAVAILABLE
    SafeErrorDetailScalar:
      oneOf:
        - type: string
          maxLength: 4096
          x-maxUtf8Bytes: 4096
        - type: number
        - type: boolean
        - type: 'null'
    SafeErrorDetailValue:
      oneOf:
        - $ref: '#/components/schemas/SafeErrorDetailScalar'
        - type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/SafeErrorDetailScalar'
        - type: object
          maxProperties: 32
          propertyNames:
            maxLength: 128
          additionalProperties:
            $ref: '#/components/schemas/SafeErrorDetailScalar'
      description: 最多一层容器的有界诊断值；容器内不允许继续嵌套。
      x-maxDepth: 2
    SafeErrorDetails:
      type: object
      maxProperties: 32
      propertyNames:
        maxLength: 128
      additionalProperties:
        $ref: '#/components/schemas/SafeErrorDetailValue'
      description: |
        只允许有界、脱敏、可操作的诊断字段。规范化 JSON 的 UTF-8 大小
        不得超过 16384 字节；不得包含凭据、内部 Header、私有 claim、
        堆栈、Prompt、原始 thinking 或执行器秘密。无法安全投影时应省略。
      x-maxSerializedBytes: 16384
      x-maxDepth: 2
      x-maxStringUtf8Bytes: 4096
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          minLength: 1
          maxLength: 2048
        details:
          $ref: '#/components/schemas/SafeErrorDetails'
        retryable:
          type: boolean
          default: false
          description: 省略等价于 false；只说明同一业务操作是否适合稍后重试。
        retry_after_ms:
          type: integer
          minimum: 0
          description: 仅当 retryable=true 时有效；副作用请求仍必须复用原 idempotency_key。
      allOf:
        - if:
            required:
              - retry_after_ms
          then:
            required:
              - retryable
            properties:
              retryable:
                const: true
        - if:
            properties:
              code:
                const: ATTACHMENT_NOT_READY
            required:
              - code
          then:
            required:
              - retryable
              - retry_after_ms
            properties:
              retryable:
                const: true
        - if:
            properties:
              code:
                enum:
                  - INVALID_ATTACHMENT
                  - ATTACHMENT_NOT_SUPPORTED
            required:
              - code
          then:
            properties:
              retryable:
                const: false
            not:
              required:
                - retry_after_ms
    RunInterruptedError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          const: RUN_INTERRUPTED
        message:
          type: string
          minLength: 1
          maxLength: 2048
        details:
          $ref: '#/components/schemas/SafeErrorDetails'
      description: |
        RuntimeSessionStore 在确认 Pod 重启导致旧 active run 无法继续时生成的
        持久化终态原因。它不是 ErrorResponseFrame 的请求错误，也不允许
        retryable/retry_after_ms；调用方不应对原 run_id 重试，可发起新的
        chat.send。
    RunTerminalError:
      oneOf:
        - $ref: '#/components/schemas/Error'
        - $ref: '#/components/schemas/RunInterruptedError'
    SuccessResponseFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - ok
        - payload
      properties:
        type:
          const: res
        id:
          $ref: '#/components/schemas/RequestId'
        ok:
          type: boolean
          const: true
        payload:
          $ref: '#/components/schemas/SuccessPayload'
    ErrorResponseFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - ok
        - error
      properties:
        type:
          const: res
        id:
          $ref: '#/components/schemas/RequestId'
        ok:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/Error'
    AnyResponseFrame:
      oneOf:
        - $ref: '#/components/schemas/SuccessResponseFrame'
        - $ref: '#/components/schemas/ErrorResponseFrame'
    RunStartedPayload:
      type: object
      additionalProperties: false
      required:
        - agent_id
        - session_id
        - run_id
        - run_seq
        - timestamp
        - model_id
        - thinking
      properties:
        agent_id:
          $ref: '#/components/schemas/AgentId'
        session_id:
          $ref: '#/components/schemas/SessionId'
        run_id:
          $ref: '#/components/schemas/RunId'
        run_seq:
          type: integer
          minimum: 1
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        model_id:
          $ref: '#/components/schemas/ModelId'
        thinking:
          $ref: '#/components/schemas/ThinkingLevel'
          description: 该 run 在当前连接上的冻结有效 thinking 投影；恢复快照必须返回相同语义。
    MessageStartedPayload:
      type: object
      additionalProperties: false
      required:
        - agent_id
        - session_id
        - run_id
        - message_id
        - run_seq
        - timestamp
        - role
      properties:
        agent_id:
          $ref: '#/components/schemas/AgentId'
        session_id:
          $ref: '#/components/schemas/SessionId'
        run_id:
          $ref: '#/components/schemas/RunId'
        message_id:
          $ref: '#/components/schemas/MessageId'
        run_seq:
          type: integer
          minimum: 1
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        role:
          type: string
          enum:
            - assistant
    TextStartUpdate:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          const: text_start
    TextDeltaUpdate:
      type: object
      additionalProperties: false
      required:
        - type
        - delta
      properties:
        type:
          const: text_delta
        delta:
          type: string
          minLength: 1
    TextEndUpdate:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          const: text_end
    ThinkingStartUpdate:
      type: object
      additionalProperties: false
      required:
        - type
        - disclosure
      properties:
        type:
          const: thinking_start
        disclosure:
          type: string
          enum:
            - hidden
            - summary
            - full
          description: 当前连接对该 thinking 块的有效投影级别。
    ThinkingDeltaUpdate:
      type: object
      additionalProperties: false
      description: |
        只在当前连接对 run 的投影级别为 full 且有效 capability 包含
        full_thinking 时发送。summary/hidden 连接在同一 run_seq 位置收到
        thinking_redacted，使 run_seq 在不同投影中仍保持稳定连续。
      required:
        - type
        - delta
      properties:
        type:
          const: thinking_delta
        delta:
          type: string
          minLength: 1
    ThinkingSummaryUpdate:
      type: object
      additionalProperties: false
      description: |
        只在 disclosure=summary 且 Model Manager 明确提供非空安全摘要时
        发送，每个 thinking 块最多一次。summary 是当前块的完整安全
        摘要，客户端以它替换当前摘要，不做字符串追加。如果没有安全
        摘要，summary 投影在 canonical summary 序列位置也收到
        thinking_redacted，终态 ThinkingContent 保留 disclosure=summary 但省略 text。
        full/hidden 投影在同一 run_seq 位置收到 thinking_redacted。
      required:
        - type
        - summary
      properties:
        type:
          const: thinking_summary
        summary:
          type: string
          minLength: 1
    ThinkingRedactedUpdate:
      type: object
      additionalProperties: false
      required:
        - type
        - redacted_type
      properties:
        type:
          const: thinking_redacted
        redacted_type:
          type: string
          enum:
            - delta
            - summary
      description: |
        不含 thinking 内容的序列占位。服务端对每个被当前连接投影策略抑制的
        canonical thinking_delta 或 thinking_summary 发送一条，使同一 run
        在断线前后保持连续的 run_seq 域。客户端只推进序列，不创建可见正文。
    ThinkingEndUpdate:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          const: thinking_end
    ToolCallStartUpdate:
      type: object
      additionalProperties: false
      required:
        - type
        - tool_call_id
        - tool_id
      properties:
        type:
          const: toolcall_start
        tool_call_id:
          $ref: '#/components/schemas/ToolCallId'
        tool_id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
          minLength: 1
          maxLength: 256
    ToolCallDeltaUpdate:
      type: object
      additionalProperties: false
      required:
        - type
        - tool_call_id
        - delta
      properties:
        type:
          const: toolcall_delta
        tool_call_id:
          $ref: '#/components/schemas/ToolCallId'
        delta:
          type: string
          minLength: 1
          maxLength: 262144
          description: |
            Tool arguments 的 JSON 文本片段，本次片段可能不是合法 JSON。客户端只
            追加保存，不逐帧解析；toolcall_end.arguments 是权威的
            ToolValueProjection。truncated=false 时 value 才是完整脱敏对象。
    ToolCallEndUpdate:
      type: object
      additionalProperties: false
      required:
        - type
        - tool_call_id
        - arguments
      properties:
        type:
          const: toolcall_end
        tool_call_id:
          $ref: '#/components/schemas/ToolCallId'
        arguments:
          $ref: '#/components/schemas/ToolParametersProjection'
    AssistantMessageUpdate:
      oneOf:
        - $ref: '#/components/schemas/TextStartUpdate'
        - $ref: '#/components/schemas/TextDeltaUpdate'
        - $ref: '#/components/schemas/TextEndUpdate'
        - $ref: '#/components/schemas/ThinkingStartUpdate'
        - $ref: '#/components/schemas/ThinkingDeltaUpdate'
        - $ref: '#/components/schemas/ThinkingSummaryUpdate'
        - $ref: '#/components/schemas/ThinkingRedactedUpdate'
        - $ref: '#/components/schemas/ThinkingEndUpdate'
        - $ref: '#/components/schemas/ToolCallStartUpdate'
        - $ref: '#/components/schemas/ToolCallDeltaUpdate'
        - $ref: '#/components/schemas/ToolCallEndUpdate'
    MessageUpdatedPayload:
      type: object
      additionalProperties: false
      description: |
        content_index 在同一 message_id 内标识最终 content 数组位置。每个位置
        遵循匹配类型的 start -> update* -> end；Thinking update 可以是 delta、
        一次 summary 或不含内容的 redacted 占位。不同位置可以交错。客户端先按
        run_seq 去重和检查缺口，再应用 update。快照 open_contents 可以初始化
        一个在重连前已经 start 的位置，因此快照后的第一帧可以直接是 delta。
      required:
        - agent_id
        - session_id
        - run_id
        - message_id
        - run_seq
        - content_index
        - timestamp
        - update
      properties:
        agent_id:
          $ref: '#/components/schemas/AgentId'
        session_id:
          $ref: '#/components/schemas/SessionId'
        run_id:
          $ref: '#/components/schemas/RunId'
        message_id:
          $ref: '#/components/schemas/MessageId'
        run_seq:
          type: integer
          minimum: 1
        content_index:
          type: integer
          minimum: 0
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        update:
          $ref: '#/components/schemas/AssistantMessageUpdate'
    ToolStartedPayload:
      type: object
      additionalProperties: false
      required:
        - agent_id
        - session_id
        - run_id
        - run_seq
        - timestamp
        - tool_call_id
        - tool_id
        - parameters
      properties:
        agent_id:
          $ref: '#/components/schemas/AgentId'
        session_id:
          $ref: '#/components/schemas/SessionId'
        run_id:
          $ref: '#/components/schemas/RunId'
        run_seq:
          type: integer
          minimum: 1
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        tool_call_id:
          $ref: '#/components/schemas/ToolCallId'
        tool_id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
          maxLength: 256
        parameters:
          $ref: '#/components/schemas/ToolParametersProjection'
          description: |
            Tool Manager 实际执行的业务 parameters 经脱敏和有界投影后的值。
            这不包含 agent-service 向执行器注入的 access-token、内部 Header
            或其他运行时秘密。
    ToolUpdatedPayload:
      type: object
      additionalProperties: false
      required:
        - agent_id
        - session_id
        - run_id
        - run_seq
        - timestamp
        - tool_call_id
        - tool_id
        - update
      properties:
        agent_id:
          $ref: '#/components/schemas/AgentId'
        session_id:
          $ref: '#/components/schemas/SessionId'
        run_id:
          $ref: '#/components/schemas/RunId'
        run_seq:
          type: integer
          minimum: 1
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        tool_call_id:
          $ref: '#/components/schemas/ToolCallId'
        tool_id:
          $ref: '#/components/schemas/Identifier'
        update:
          $ref: '#/components/schemas/ToolProgressUpdate'
    ToolProgressUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        message:
          type: string
          maxLength: 4096
        progress:
          type: number
          minimum: 0
          maximum: 1
        data:
          $ref: '#/components/schemas/ToolValueProjection'
      description: |
        progress 是脱敏后的有界状态投影。message 最多 4096 字符；data
        必须使用 ToolValueProjection，因此完整脱敏值上限为 524288 字节；
        超限时使用 preview、original_size_bytes、truncated=true 和 result_ref。
        服务端必须在发送或持久化前移除凭据、内部 Header、执行器秘密和
        不允许披露的字段。
    ToolCompletedPayload:
      type: object
      additionalProperties: false
      required:
        - agent_id
        - session_id
        - run_id
        - run_seq
        - timestamp
        - tool_call_id
        - tool_id
        - status
      properties:
        agent_id:
          $ref: '#/components/schemas/AgentId'
        session_id:
          $ref: '#/components/schemas/SessionId'
        run_id:
          $ref: '#/components/schemas/RunId'
        run_seq:
          type: integer
          minimum: 1
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        tool_call_id:
          $ref: '#/components/schemas/ToolCallId'
        tool_id:
          $ref: '#/components/schemas/Identifier'
        status:
          type: string
          enum:
            - done
            - error
            - aborted
        result:
          $ref: '#/components/schemas/ToolValueProjection'
        error:
          $ref: '#/components/schemas/Error'
      allOf:
        - if:
            properties:
              status:
                const: done
            required:
              - status
          then:
            required:
              - result
            not:
              required:
                - error
        - if:
            properties:
              status:
                const: error
            required:
              - status
          then:
            required:
              - error
            not:
              required:
                - result
        - if:
            properties:
              status:
                const: aborted
            required:
              - status
          then:
            not:
              anyOf:
                - required:
                    - result
                - required:
                    - error
    MessageCompletedPayload:
      type: object
      additionalProperties: false
      description: |
        如果同一 message_id 已发送 message.started，则本事件恰好出现一次，并
        在 run.completed 之前发送。外层 message_id 必须等于 message.message_id；
        客户端以 message 完整替换本地流式组装结果。
      required:
        - agent_id
        - session_id
        - run_id
        - message_id
        - run_seq
        - timestamp
        - message
      properties:
        agent_id:
          $ref: '#/components/schemas/AgentId'
        session_id:
          $ref: '#/components/schemas/SessionId'
        run_id:
          $ref: '#/components/schemas/RunId'
        message_id:
          $ref: '#/components/schemas/MessageId'
        run_seq:
          type: integer
          minimum: 1
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        message:
          $ref: '#/components/schemas/TerminalProjectedMessage'
    Usage:
      type: object
      additionalProperties: false
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        cached_input_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
    RunCompletedPayload:
      type: object
      additionalProperties: false
      description: |
        每个 run_id 恰好发送一次，是该 run 的最后一个事件。outcome=error
        或 interrupted 时必须携带 error；outcome=done 或 aborted 时不得携带
        error。它之后不得再出现相同 run_id 的 EventFrame。Pod 重启期间无
        活动连接可消费事件时，interrupted 终态可以只通过 chat.history 恢复。
      required:
        - agent_id
        - session_id
        - run_id
        - run_seq
        - timestamp
        - outcome
      properties:
        agent_id:
          $ref: '#/components/schemas/AgentId'
        session_id:
          $ref: '#/components/schemas/SessionId'
        run_id:
          $ref: '#/components/schemas/RunId'
        run_seq:
          type: integer
          minimum: 1
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        outcome:
          type: string
          enum:
            - done
            - aborted
            - error
            - interrupted
        usage:
          $ref: '#/components/schemas/Usage'
        stop_reason:
          type: string
          maxLength: 256
        error:
          $ref: '#/components/schemas/RunTerminalError'
      allOf:
        - if:
            properties:
              outcome:
                const: error
            required:
              - outcome
          then:
            required:
              - error
            properties:
              error:
                $ref: '#/components/schemas/Error'
        - if:
            properties:
              outcome:
                const: interrupted
            required:
              - outcome
          then:
            required:
              - error
            properties:
              error:
                $ref: '#/components/schemas/RunInterruptedError'
        - if:
            properties:
              outcome:
                enum:
                  - done
                  - aborted
            required:
              - outcome
          then:
            not:
              required:
                - error
    RunStartedEvent:
      type: object
