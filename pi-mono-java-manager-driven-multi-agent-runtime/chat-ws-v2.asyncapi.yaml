asyncapi: 3.1.0
id: urn:campusclaw:chat-websocket:v2
x-locale: zh-CN
info:
  title: CampusClaw 会话 WebSocket API
  version: 2.3.3
  description: |
    调用方使用 `wss://api.example.com/api/ws/chat` 请求建立安全 WebSocket。
    客户端库先建立 TCP/TLS 连接，再通过 HTTP opening handshake 协商切换
    协议；服务端返回 101 后，WebSocket 才正式建立。

    调用方必须在 101 后五秒内发送首个 `connect` RequestFrame。服务端根据
    `mode` 创建或恢复 `session_id` 对应的 Runtime Session，并校验
    `agent_id`、`model_id` 和 capabilities；成功后，这条连接在整个生命周期
    内固定绑定到对应的 `(agent_id, session_id)`。

    连接随后承载 RequestFrame、ResponseFrame 和 EventFrame。active run 由
    ManagedSessionPool 持有，因此连接断开只取消事件订阅，不终止正在进行的
    模型调用或工具执行。

    上层会话服务负责创建和管理 `session_id`，以及用户会话列表、数量限制和
    业务删除。CampusClaw 将 `session_id` 作为不透明的 Runtime Session 标识，
    不接收或维护 tenant_id、user_id。调用方提供的 `session_id` 必须在一个
    Runtime 部署范围内全局唯一，删除后不得复用。

    协议版本 2 使用 request/response/event Frame 和结构化消息增量，直接替换
    `/api/ws/chat` 的 v1 格式。调用方不得通过业务查询参数或 URL token 传递
    身份及 Session 信息，也不能在已绑定的连接内创建另一个 Session。

    `https://api.example.com/api/ws/chat` 只是同一 host、port 和 path 的 HTTP
    握手视角，不是 RESTful API，也不表示第二条连接。
  contact:
    name: CampusClaw
    url: https://github.com/superheromeZzh/pi-mono-java
  license:
    name: MIT
defaultContentType: application/json
servers:
  production:
    host: api.example.com
    pathname: /api/ws/chat
    protocol: wss
    description: |
      调用服务按部署配置使用 Bearer 或 mTLS 建立服务身份。使用 Bearer 时，
      客户端库在 HTTP opening handshake 中发送 Authorization；使用 mTLS 时，
      客户端在此前的 TLS 握手中出示证书。服务端在返回 101 前完成认证，并
      拒绝业务查询参数、URL token 或缺少合法 Upgrade headers 的普通 HTTP
      请求。浏览器终端应连接上层会话服务，不直接连接本 Runtime。
    security:
      - $ref: '#/components/securitySchemes/bearerAuth'
      - $ref: '#/components/securitySchemes/mutualTLS'
  local:
    host: localhost:3000
    pathname: /api/ws/chat
    protocol: ws
    description: |
      开发客户端使用 `ws://localhost:3000/api/ws/chat` 建立连接。服务端只有在
      显式启用开发配置时才允许跳过认证；HTTP opening handshake、首帧
      `connect` 和后续 Frame 协议保持不变。
channels:
  sessionChat:
    address: /api/ws/chat
    title: 会话范围的对话通道
    description: |
      调用方完成 HTTP opening handshake 并收到 101 后，才可以在这条连接上
      传输 JSON Frame。调用方必须在五秒内发送 `connect` RequestFrame；服务端
      校验并绑定 Agent 和 Session 后，才接受其他 Session 命令。101 之前的失败
      使用 HTTP status，101 之后的失败使用 ResponseFrame、EventFrame 或
      WebSocket close code。连接绑定成功后不能更换 Agent 或 Session。
    messages:
      ClientRequestFrame:
        $ref: '#/components/messages/ClientRequestFrame'
      ServerResponseFrame:
        $ref: '#/components/messages/ServerResponseFrame'
      ServerEventFrame:
        $ref: '#/components/messages/ServerEventFrame'
operations:
  sendRequest:
    action: send
    channel:
      $ref: '#/channels/sessionChat'
    summary: 调用方先发送 connect RequestFrame；绑定成功后发送当前 Session 的命令请求。
    messages:
      - $ref: '#/channels/sessionChat/messages/ClientRequestFrame'
  receiveResponseOrEvent:
    action: receive
    channel:
      $ref: '#/channels/sessionChat'
    summary: 服务端为命令返回同 id 的 ResponseFrame，并按 seq 发送当前 Session 的有序事件。
    messages:
      - $ref: '#/channels/sessionChat/messages/ServerResponseFrame'
      - $ref: '#/channels/sessionChat/messages/ServerEventFrame'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        调用服务选择 Bearer 认证时，在 HTTP opening handshake 的
        Authorization 请求头中发送 Token。服务端在返回 101 前校验 Runtime
        audience 和所需 service scope；校验失败时拒绝 Upgrade。认证信息只
        用于建立连接认证上下文，不得复制到 Prompt、JSONL、协议事件或应用
        日志。Runtime 不从 Token 中建立或维护业务 tenant_id、user_id。
    mutualTLS:
      type: X509
      description: |
        部署启用 mTLS 时，调用服务在 TLS 握手阶段出示客户端证书；服务端验证
        证书后才处理 HTTP WebSocket opening handshake。mTLS 可以单独使用，
        也可以加强 Bearer 认证。证书身份只用于服务认证和审计，不参与
        Session key。
  messages:
    ClientRequestFrame:
      name: ClientRequestFrame
      title: 客户端请求 Frame
      description: 调用方使用首个 connect RequestFrame 建立应用级 Session 绑定，随后用相同 Frame 结构发送命令。
      correlationId:
        location: $message.payload#/id
      payload:
        $ref: '#/components/schemas/AnyRequestFrame'
      examples:
        - name: 新建会话
          payload:
            type: req
            id: connect-1
            method: connect
            params:
              mode: create
              min_protocol: 2
              max_protocol: 2
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              agent_id: agent-a
              model_id: model-a
              client:
                id: campusclaw-session-service
                version: 1.0.0
                platform: service
              capabilities:
                - structured_message_delta
        - name: 恢复会话
          payload:
            type: req
            id: connect-2
            method: connect
            params:
              mode: resume
              min_protocol: 2
              max_protocol: 2
              agent_id: agent-a
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              client:
                id: campusclaw-sdk
                version: 1.0.0
                platform: sdk
              capabilities:
                - structured_message_delta
        - name: 发送用户消息
          payload:
            type: req
            id: send-1
            method: chat.send
            traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
            params:
              message: 查询订单 20260730001
              attachment_ids:
                - attachment-01
              idempotency_key: 6f46bc26-8a14-4d63-b7b1-8f1f933a0d50
              thinking: hidden
    ServerResponseFrame:
      name: ServerResponseFrame
      title: 关联命令响应
      description: 服务端为每个 RequestFrame 返回相同 id 的响应；成功时携带 payload，失败时携带 error。
      correlationId:
        location: $message.payload#/id
      payload:
        $ref: '#/components/schemas/AnyResponseFrame'
      examples:
        - name: 连接成功并返回 active run 快照
          payload:
            type: res
            id: connect-2
            ok: true
            payload:
              protocol: 2
              connection_id: conn-01
              agent_id: agent-a
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              model:
                model_id: model-a
                name: 模型 A
                reasoning: true
              session:
                state: running
                thinking: hidden
              limits:
                max_frame_bytes: 1048576
                max_connection_buffer_bytes: 4194304
                heartbeat_seconds: 20
                connect_timeout_seconds: 5
              features:
                methods:
                  - chat.send
                  - chat.steer
                  - chat.abort
                  - chat.history
                  - session.get
                  - models.list
                  - model.set
                  - thinking.set
                  - prompt_templates.list
                  - skills.list
                events:
                  - run.started
                  - message.started
                  - message.updated
                  - tool.started
                  - tool.updated
                  - tool.completed
                  - message.completed
                  - run.completed
                capabilities:
                  - structured_message_delta
              active_run:
                run_id: run-01
                run_seq: 14
                message_snapshot:
                  message_id: message-01
                  role: assistant
                  status: streaming
                  content:
                    - type: text
                      text: 订单当前状态为
                  created_at: '2026-07-30T08:00:00Z'
                active_tools: []
        - name: active run 冲突
          payload:
            type: res
            id: send-2
            ok: false
            error:
              code: RUN_ACTIVE
              message: 当前 Session 已存在 active run。
              retryable: true
    ServerEventFrame:
      name: ServerEventFrame
      title: 有序 Session 事件
      description: 服务端在 Session 绑定成功后主动发送事件；调用方用连接级 seq 和 Run 级 run_seq 检测顺序与恢复位置。
      payload:
        $ref: '#/components/schemas/AnyEventFrame'
      examples:
        - name: 文本增量
          payload:
            type: event
            event: message.updated
            seq: 7
            payload:
              agent_id: agent-a
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              run_id: run-01
              message_id: message-01
              run_seq: 7
              content_index: 0
              timestamp: '2026-07-30T08:00:01Z'
              update:
                type: text_delta
                delta: 已发货
        - name: run 已完成
          payload:
            type: event
            event: run.completed
            seq: 24
            payload:
              agent_id: agent-a
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              run_id: run-01
              run_seq: 24
              timestamp: '2026-07-30T08:00:03Z'
              outcome: done
              stop_reason: stop
              usage:
                input_tokens: 230
                output_tokens: 48
                total_tokens: 278
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
    ConnectionId:
      allOf:
        - $ref: '#/components/schemas/Identifier'
      description: |
        服务端在 connect 成功响应中返回当前物理连接的 connection_id。调用方
        可用它关联连接日志和连接级序列；重连后服务端生成新值，它不作为
        Session、Message 或 Run 的持久归属键。
    SessionId:
      allOf:
        - $ref: '#/components/schemas/Identifier'
      description: |
        调用方在 connect 中提供上层会话服务生成的 session_id。服务端用它创建
        或恢复 Runtime Session。该值必须在 Runtime 部署范围内全局唯一，删除
        后不得复用；推荐使用 UUIDv7 或 ULID，不接受仅在某个 tenant 或 user
        内唯一的短 ID。
    AgentId:
      allOf:
        - $ref: '#/components/schemas/Identifier'
      description: |
        调用方在 connect 中提供 agent_id。服务端通过 Agent Manager 校验，并在
        创建 Runtime Session 时固定绑定；恢复时，不一致的值导致请求失败。
    ModelId:
      allOf:
        - $ref: '#/components/schemas/Identifier'
      description: |
        调用方在创建 Session 时提供 model_id，或在恢复和 model.set 时请求
        切换。服务端通过 Model Manager 校验允许集合；active run 存在时不执行
        切换，每个 run 固化实际使用的模型。
    MessageId:
      allOf:
        - $ref: '#/components/schemas/Identifier'
      description: 服务端持久化一条消息时生成 message_id，并在消息事件及历史结果中返回。
    RunId:
      allOf:
        - $ref: '#/components/schemas/Identifier'
      description: |
        服务端首次接受新的 chat.send 时生成 run_id；同一 idempotency_key 且
        负载一致的重试返回原 run_id，负载不一致时返回 INVALID_REQUEST；连接
        断开或重连不会改变该值。
    ToolCallId:
      allOf:
        - $ref: '#/components/schemas/Identifier'
      description: |
        模型或 Runtime 为一个 run 内的工具调用提供 tool_call_id。服务端用它
        关联 toolcall 内容和 Tool Manager 事件；它不参与 Session 路由。
    RequestId:
      type: string
      minLength: 1
      maxLength: 128
    TraceParent:
      type: string
      minLength: 55
      maxLength: 128
      pattern: '^(?!ff-)[0-9a-f]{2}-(?!00000000000000000000000000000000-)[0-9a-f]{32}-(?!0000000000000000-)[0-9a-f]{16}-[0-9a-f]{2}(?:-.+)?$'
      description: |
        调用方可以在 RequestFrame 中提供 W3C traceparent。服务端收到请求后先
        执行 Schema 预检，再使用标准解析器校验完整规则；非法值返回
        INVALID_REQUEST。合法值只传播到遥测、Model Manager 和 Tool Manager，
        不写入 Prompt、JSONL 或业务事件。
    IdempotencyKey:
      type: string
      minLength: 8
      maxLength: 128
    Timestamp:
      type: string
      format: date-time
    ThinkingLevel:
      type: string
      enum:
        - hidden
        - summary
        - full
    ClientInfo:
      type: object
      additionalProperties: false
      required:
        - id
        - version
        - platform
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        version:
          type: string
          minLength: 1
          maxLength: 64
        platform:
          type: string
          enum:
            - cli
            - sdk
            - service
            - other
    ClientCapabilities:
      type: array
      minItems: 1
      uniqueItems: true
      description: |
        调用方在 connect 中声明自己能够处理的 capability，并且必须包含
        structured_message_delta。服务端取客户端声明、服务能力和授权策略的
        交集作为有效 capability；未知字符串被忽略且不回显。
      contains:
        const: structured_message_delta
      items:
        type: string
        minLength: 1
        maxLength: 128
    SessionConnectMode:
      type: string
      enum:
        - create
        - resume
      description: |
        调用方使用 create 请求幂等建立上层已经分配 session_id 的 Runtime
        Session；使用 resume 只能恢复已有 Session，目标不存在时服务端返回
        SESSION_NOT_FOUND。
    ConnectParams:
      type: object
      additionalProperties: false
      description: |
        调用方在首个 connect Frame 中提供 mode、全局唯一 session_id、agent_id、
        客户端信息和 capabilities。使用 create 时还必须提供 model_id；服务端
        对相同 Session、Agent 和 Model 的重试保持幂等。使用 resume 时服务端
        不创建缺失或已删除的 Session；只有不存在 active run 时，显式不同的
        model_id 才表示切换。
      required:
        - mode
        - min_protocol
        - max_protocol
        - agent_id
        - session_id
        - client
        - capabilities
      properties:
        mode:
          $ref: '#/components/schemas/SessionConnectMode'
        min_protocol:
          type: integer
          minimum: 1
        max_protocol:
          type: integer
          minimum: 1
        agent_id:
          $ref: '#/components/schemas/AgentId'
        session_id:
          $ref: '#/components/schemas/SessionId'
        model_id:
          $ref: '#/components/schemas/ModelId'
          description: 调用方在 create 时必须提供；在 resume 时可以省略以沿用保存值，也可以显式请求切换。
        client:
          $ref: '#/components/schemas/ClientInfo'
        capabilities:
          $ref: '#/components/schemas/ClientCapabilities'
      allOf:
        - if:
            properties:
              mode:
                const: create
          then:
            required:
              - model_id
    ConnectRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
        - params
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: connect
        params:
          $ref: '#/components/schemas/ConnectParams'
    ChatSendParams:
      type: object
      additionalProperties: false
      required:
        - message
        - idempotency_key
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1048576
        attachment_ids:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Identifier'
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
        thinking:
          $ref: '#/components/schemas/ThinkingLevel'
    ChatSendRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
        - params
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: chat.send
        params:
          $ref: '#/components/schemas/ChatSendParams'
    ChatSteerParams:
      type: object
      additionalProperties: false
      required:
        - run_id
        - message
        - idempotency_key
      properties:
        run_id:
          $ref: '#/components/schemas/RunId'
        message:
          type: string
          minLength: 1
          maxLength: 1048576
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
    ChatSteerRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
        - params
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: chat.steer
        params:
          $ref: '#/components/schemas/ChatSteerParams'
    ChatAbortParams:
      type: object
      additionalProperties: false
      required:
        - run_id
        - idempotency_key
      properties:
        run_id:
          $ref: '#/components/schemas/RunId'
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
    ChatAbortRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
        - params
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: chat.abort
        params:
          $ref: '#/components/schemas/ChatAbortParams'
    CursorPageParams:
      type: object
      additionalProperties: false
      properties:
        cursor:
          type: string
          minLength: 1
          maxLength: 1024
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
    ChatHistoryRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: chat.history
        params:
          $ref: '#/components/schemas/CursorPageParams'
    SessionGetRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: session.get
    ModelsListRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: models.list
    ModelSetParams:
      type: object
      additionalProperties: false
      required:
        - model_id
      properties:
        model_id:
          $ref: '#/components/schemas/ModelId'
    ModelSetRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
        - params
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: model.set
        params:
          $ref: '#/components/schemas/ModelSetParams'
    ThinkingSetParams:
      type: object
      additionalProperties: false
      required:
        - level
      properties:
        level:
          $ref: '#/components/schemas/ThinkingLevel'
    ThinkingSetRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
        - params
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: thinking.set
        params:
          $ref: '#/components/schemas/ThinkingSetParams'
    PromptTemplatesListRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: prompt_templates.list
        params:
          $ref: '#/components/schemas/CursorPageParams'
    SkillsListRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: skills.list
    AnyRequestFrame:
      oneOf:
        - $ref: '#/components/schemas/ConnectRequest'
        - $ref: '#/components/schemas/ChatSendRequest'
        - $ref: '#/components/schemas/ChatSteerRequest'
        - $ref: '#/components/schemas/ChatAbortRequest'
        - $ref: '#/components/schemas/ChatHistoryRequest'
        - $ref: '#/components/schemas/SessionGetRequest'
        - $ref: '#/components/schemas/ModelsListRequest'
        - $ref: '#/components/schemas/ModelSetRequest'
        - $ref: '#/components/schemas/ThinkingSetRequest'
        - $ref: '#/components/schemas/PromptTemplatesListRequest'
        - $ref: '#/components/schemas/SkillsListRequest'
    ModelSummary:
      type: object
      additionalProperties: false
      required:
        - model_id
        - name
      properties:
        model_id:
          $ref: '#/components/schemas/ModelId'
        name:
          type: string
          minLength: 1
          maxLength: 256
        reasoning:
