    NegotiatedMethods:
      type: array
      minItems: 1
      uniqueItems: true
      description: |
        服务端在 connect 成功响应中返回当前连接可发现的方法，并按本 Schema
        的枚举顺序稳定排列。调用方可据此决定展示哪些功能；服务端仍对每个
        请求重新执行状态和权限校验。
      items:
        type: string
        enum:
          - chat.send
          - chat.steer
          - chat.abort
          - chat.history
          - session.get
          - models.list
          - model.set
          - thinking.set
          - prompt_templates.list
          - skills.list
    NegotiatedEvents:
      type: array
      minItems: 1
      uniqueItems: true
      description: 服务端在 connect 成功响应中返回当前连接可能接收的事件族，并按本 Schema 的枚举顺序稳定排列。
      items:
        type: string
        enum:
          - run.started
          - message.started
          - message.updated
          - tool.started
          - tool.updated
          - tool.completed
          - message.completed
          - run.completed
    EffectiveCapabilities:
      type: array
      minItems: 1
      uniqueItems: true
      contains:
        const: structured_message_delta
      description: |
        服务端根据客户端声明、服务能力和当前授权计算 capability 交集，并在
        connect 成功响应中返回。只有调用服务 scope、Agent、Model、可选委托
        披露上限和客户端声明全部允许时，结果才包含 full_thinking。
      items:
        type: string
        enum:
          - structured_message_delta
          - full_thinking
