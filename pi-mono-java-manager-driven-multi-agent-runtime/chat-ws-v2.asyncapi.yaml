  description: |
    附件引用是协议 2 的标准可选字段，不通过 capability 开启。调用方使用
    `POST /mate-service/v1/sessions/{session_id}/attachments` 提交恰好一个
    `file` multipart part，并必须携带 `X-Attachment-Size: 1..20971520`。
    OBS SDK 读取声明长度后，Attachment Service 还必须确认 file part 已到
    EOF；尾部仍有字节时删除已写对象并拒绝请求。
    file part 必须包含 filename；服务端进行 Unicode NFC 规范化并移除控制字符
    和路径分隔符，结果必须为 1..512 个 code point，否则返回 INVALID_REQUEST。
    不携带 Prefer 或使用 `Prefer: respond-async` 时立即返回 202；使用
    `Prefer: wait=N` 时最多等待 `min(N,10)` 秒；期间进入 READY 返回
    201，进入 BLOCKED 返回 422，进入终态 FAILED 返回 503，到期仍为
    PROCESSING 才返回 202、Location 和 Retry-After。扫描器暂时不可用时
    保持 PROCESSING 并重试，不把可重试中间态投影为终态 503。调用方通过 Location
    对应的 GET 端点轮询，只有 READY 附件才能进入 chat.send。

    Attachment Service 将正文写入私有 OBS，Object Key 精确等于大小写敏感的
    attachment_id；不使用文件名或 Session 目录，不在 openGauss 保存第二套
    Object Key 映射，也不允许覆盖既有对象。attachment_id 仍只是资源引用，
    不包含 Bucket、凭据或预签名 URL，知道该 ID 不授予 OBS 访问权。
    所有 Attachment Service 副本共享 openGauss 和 OBS；
    Runtime Pod 不使用本地盘传递或缓存权威附件。

    create-only PUT 发现同名对象时，服务端不得覆盖、删除来源不明对象或在
    不可重放的上传流中更换 ID；当前记录进入 FAILED，明细保存
    OBJECT_KEY_CONFLICT 并退出普通 24 小时清理，调用方重新上传获得新 ID。
    只有受审计对账确认对象归属并安全删除或确认 NotFound 后，才删除明细并
    收束为五字段 DELETED tombstone。

    openGauss 永久 attachment 主表只保存 attachment_id、session_id、status、
    created_at 和 deleted_at。每个非 DELETED 主表行都有
    attachment_active_detail，包括上传、失败、对账和待删除状态；明细保存
    filename、detected_media_type、expected_size_bytes、size_bytes、sha256、
    referenced_at、expires_at、error_code、attempt_count、next_attempt_at、
    lease_owner、lease_until 和 row_version。filename 只用于安全显示；检测 MIME
    和声明/实际大小用于类型与 20 MiB 校验；sha256 用于完整性复核；
    referenced_at 非空表示已被 Session 引用；expires_at 驱动 24 小时未引用
    清理；error_code 和 Worker retry/lease/version 字段驱动稳定诊断、退避、
    崩溃接管与并发保护。OBS 删除完成后删除活动明细，仅留下五字段
    DELETED tombstone。

    Attachment Service 只能在服务端签发 attachment_id，并用经实际
    openGauss/JDBC 验证的大小写敏感比较语义和主键唯一约束，保证一个服务
    部署内全局唯一。碰撞必须
    重新签发；唯一约束覆盖活动记录和永久 issued-ID/tombstone，物理删除不能
    释放 ID；READY 后不能改绑其他内容，DELETED 后不能复用。客户端和 Runtime
    必须原样保存并逐字节比较，不能生成、规范化大小写或解析后缀。

    CampusAgent Runtime 不维护 tenant_id/user_id，也不把 attachment_id
    当作授权凭据；格式校验和唯一性检查都不能代替资源授权。
    AttachmentResolver 使用 Upgrade 固化的调用服务身份以及当前
    Session 的 session_id 批量解析全部 ID。Attachment
    Service 在自身权威数据中完成最终用户归属判断；调用方不能在 Frame 中自报
    tenant/user。未知、越权、未绑定、删除或过期统一返回 INVALID_ATTACHMENT。
    只有先通过调用服务和 Session 授权后，才可以用 ATTACHMENT_NOT_READY 披露
    processing 状态；输入类型、数量或可信字节数超出有效 ModelInputPolicy 时
    返回 ATTACHMENT_NOT_SUPPORTED。

    首次 chat.send 按“已接受幂等结果查询 -> RUN_ACTIVE 检查 -> 批量内部
    resolve -> ModelInputPolicy 校验 -> 用户 Message 元数据快照、幂等结果和
    active-run 原子提交”的顺序执行。resolve 必须在一个 openGauss
    事务中校验整个有序 ID 集合，并原子设置
    `referenced_at=COALESCE(referenced_at, now()), expires_at=NULL`。任一附件
    失败时整体拒绝且不创建 run；接受前错误不占用幂等键。已接受重试直接返回
    原 run_id 和 user_message_id，不重新解释附件当前状态。referenced_at
    只能从 null 转为时间戳，对外不提供逆向变更接口。
    Runtime 后续输入策略拒绝或 RuntimeSessionStore 提交失败时，
    允许保守多保留，不得清空 referenced_at。

    RuntimeSessionStore 保存接受时的 AttachmentContent 元数据快照。
    当前 turn、后续 turn 和进程恢复都通过内部 content API 按
    session_id + attachment_id 读取。Attachment Service 重新校验 Session、
    READY 和 referenced_at，再以 attachment_id 为 Object Key 从私有 OBS
    读取并返回有界字节流。Runtime 不直连 OBS，也不持有 Bucket、OBS 凭据
    或预签名 URL；Object Key 与资源 ID 相等不构成授权。

    除 `FAILED + OBJECT_KEY_CONFLICT` 隔离行外，未引用附件在创建 24 小时后
    由 Attachment Service 删除 OBS 正文，并把 openGauss 主表记录转为永久
    DELETED tombstone、删除活动明细。外部 DELETE 只能删除未引用且非隔离的
    附件；已引用返回 409，隔离行返回有界 503 且不改变状态。Session 删除会
    停止 Runtime 使用并让 Session 对用户不可见，但普通删除和 Worker claim
    必须排除隔离行；存在隔离时存储完成状态保持 pending/quarantined。只有受审计
    reconciliation 证明对象归属并安全删除或确认 NotFound 后，才删除明细并在
    openGauss 主表只保留五字段 DELETED tombstone。

    Session Context Builder 在 model.set 和首次接受新的 chat.send 前生成下一次
    模型调用的 AttachmentContextPlan；它包含有效 transcript（经过已持久化
    compaction 后）中仍会发送的全部历史附件和本次新附件。model.set 对现有
    plan 不兼容时返回 ATTACHMENT_NOT_SUPPORTED 且不切换；chat.send 对合并后
    plan 不兼容时在 accepted 前返回同一错误且不创建消息或 run。已接受后才
    发生的读取、完整性或 Provider 转换失败通过 run.completed(error) 表达。

    AttachmentInputAssembler 在每次模型调用前从内部 content API 流式读取，
    并重新核对实际 length、SHA-256、
    嗅探 MIME、解压/像素复杂度和有效 ModelInputPolicy，再把稳定引用和受控
    内容源转换成当前模型支持的 image/document/text 输入；Model Manager Provider 只处理
    供应商格式与临时供应商文件生命周期。文件内容始终是不可信用户数据，不能
    提升为 system、tool 或开发者指令。
