  sessionDeleteQuarantine:
    errorCode: OBJECT_KEY_CONFLICT
    runtimeUseStopped: true
    userVisibilityRemoved: true
    storageCompletionPending: true
    onlyAuditedReconciliationMayDelete: true
  acceptedStates:
    - READY
  authoritativeUploadStates:
    - UPLOADING
    - PROCESSING
    - READY
    - BLOCKED
    - FAILED
    - DELETING
