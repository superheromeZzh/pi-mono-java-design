asyncapi: 3.1.0
id: urn:campusclaw:chat-websocket:v2
x-locale: zh-CN
info:
  title: CampusClaw 会话 WebSocket API
  version: 2.3.1
  description: |
    Manager 驱动的 CampusClaw Agent Runtime Session 协议规范。

    每条 WebSocket 连接在强制的首帧 `connect` 成功后，只绑定一个经过认证的
    `(agent_id, session_id)`。连接只承担事件订阅；active run 由
    ManagedSessionPool 持有，因此传输连接断开不会终止模型调用或工具执行。

    `session_id` 由上层会话服务创建并管理，CampusClaw 将其作为不透明的
    持久上下文标识。上层服务负责用户会话列表、数量限制和业务删除；本协议
    只定义 Runtime Session 的创建绑定、恢复和流式交互。`session_id` 必须在
    一个 Runtime 部署范围内全局唯一且删除后不复用；Runtime 不接收或维护
    tenant_id、user_id。

    版本 2 直接替换 `/api/ws/chat` 上的 v1 传输格式，使用
    request/response/event Frame 和结构化消息增量。协议不接受业务查询
    参数或 URL token，也不提供连接内新建会话命令。

    客户端配置 `wss://api.example.com/api/ws/chat`。WebSocket 库先对相同
    host、port 和 path 发起 HTTP opening handshake；概念上的 HTTP/TLS 目标
    是 `https://api.example.com/api/ws/chat`，但该地址不是 RESTful 资源。
    HTTP/1.1 请求必须携带合法 Upgrade headers，成功返回 101 后才开始传输
    WebSocket Frame。第一个 `connect` RequestFrame 是 101 之后的应用握手，
    不等同于 HTTP Upgrade。
  contact:
    name: CampusClaw
    url: https://github.com/superheromeZzh/pi-mono-java
  license:
    name: MIT
defaultContentType: application/json
servers:
  production:
    host: api.example.com
    pathname: /api/ws/chat
    protocol: wss
    description: |
      生产环境内部服务端点。浏览器终端应连接上层会话服务，不直接连接本
      Runtime。调用服务使用 Authorization Bearer，部署也可以在入口强制
      mTLS。客户端配置 wss URI，由 WebSocket 库生成 HTTP Upgrade；服务端
      拒绝业务查询参数、URL token 和缺少合法 Upgrade headers 的普通 HTTP
      请求。
    security:
      - $ref: '#/components/securitySchemes/bearerAuth'
      - $ref: '#/components/securitySchemes/mutualTLS'
  local:
    host: localhost:3000
    pathname: /api/ws/chat
    protocol: ws
    description: |
      本地开发端点。只有显式启用开发配置时才可以关闭认证；首帧协议保持不变。
channels:
  sessionChat:
    address: /api/ws/chat
    title: 会话范围的对话通道
    description: |
      HTTP opening handshake 成功后才存在此双向 JSON 通道。HTTP/1.1 的
      成功边界是 101 Switching Protocols；在此之前的失败使用 HTTP status，
      不发送本通道的 Frame。客户端必须在 101 之后五秒内发送 `connect`
      RequestFrame；connect 成功后，Agent 和 Session 在该连接的整个生命周期
      内不可更换。
    messages:
      ClientRequestFrame:
        $ref: '#/components/messages/ClientRequestFrame'
      ServerResponseFrame:
        $ref: '#/components/messages/ServerResponseFrame'
      ServerEventFrame:
        $ref: '#/components/messages/ServerEventFrame'
operations:
  sendRequest:
    action: send
    channel:
      $ref: '#/channels/sessionChat'
    summary: 客户端发送 connect 或 Session 命令请求。
    messages:
      - $ref: '#/channels/sessionChat/messages/ClientRequestFrame'
  receiveResponseOrEvent:
    action: receive
    channel:
      $ref: '#/channels/sessionChat'
    summary: 客户端接收关联响应或有序事件。
    messages:
      - $ref: '#/channels/sessionChat/messages/ServerResponseFrame'
      - $ref: '#/channels/sessionChat/messages/ServerEventFrame'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        调用服务使用的 Authorization 请求头。Token 必须具有 Runtime
        audience 和所需 service scope。业务 tenant_id、user_id 不进入连接
        上下文；凭据不得复制到 Prompt、JSONL、协议事件或应用日志。
    mutualTLS:
      type: X509
      description: |
        可选的服务间双向 TLS 身份。部署可单独使用 mTLS，或用它加强 Bearer
        认证；证书身份只用于服务认证和审计，不参与 Session key。
  messages:
    ClientRequestFrame:
      name: ClientRequestFrame
      title: 客户端请求 Frame
      correlationId:
        location: $message.payload#/id
      payload:
        $ref: '#/components/schemas/AnyRequestFrame'
      examples:
        - name: 新建会话
          payload:
            type: req
            id: connect-1
            method: connect
            params:
              mode: create
              min_protocol: 2
              max_protocol: 2
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              agent_id: agent-a
              model_id: model-a
              client:
                id: campusclaw-session-service
                version: 1.0.0
                platform: service
              capabilities:
                - structured_message_delta
        - name: 恢复会话
          payload:
            type: req
            id: connect-2
            method: connect
            params:
              mode: resume
              min_protocol: 2
              max_protocol: 2
              agent_id: agent-a
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              client:
                id: campusclaw-sdk
                version: 1.0.0
                platform: sdk
              capabilities:
                - structured_message_delta
        - name: 发送用户消息
          payload:
            type: req
            id: send-1
            method: chat.send
            traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
            params:
              message: 查询订单 20260730001
              attachment_ids:
                - attachment-01
              idempotency_key: 6f46bc26-8a14-4d63-b7b1-8f1f933a0d50
              thinking: hidden
    ServerResponseFrame:
      name: ServerResponseFrame
      title: 关联命令响应
      correlationId:
        location: $message.payload#/id
      payload:
        $ref: '#/components/schemas/AnyResponseFrame'
      examples:
        - name: 连接成功并返回 active run 快照
          payload:
            type: res
            id: connect-2
            ok: true
            payload:
              protocol: 2
              connection_id: conn-01
              agent_id: agent-a
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              model:
                model_id: model-a
                name: 模型 A
                reasoning: true
              session:
                state: running
                thinking: hidden
              limits:
                max_frame_bytes: 1048576
                max_connection_buffer_bytes: 4194304
                heartbeat_seconds: 20
                connect_timeout_seconds: 5
              features:
                methods:
                  - chat.send
                  - chat.steer
                  - chat.abort
                  - chat.history
                  - session.get
                  - models.list
                  - model.set
                  - thinking.set
                  - prompt_templates.list
                  - skills.list
                events:
                  - run.started
                  - message.started
                  - message.updated
                  - tool.started
                  - tool.updated
                  - tool.completed
                  - message.completed
                  - run.completed
                capabilities:
                  - structured_message_delta
              active_run:
                run_id: run-01
                run_seq: 14
                message_snapshot:
                  message_id: message-01
                  role: assistant
                  status: streaming
                  content:
                    - type: text
                      text: 订单当前状态为
                  created_at: '2026-07-30T08:00:00Z'
                active_tools: []
        - name: active run 冲突
          payload:
            type: res
            id: send-2
            ok: false
            error:
              code: RUN_ACTIVE
              message: 当前 Session 已存在 active run。
              retryable: true
    ServerEventFrame:
      name: ServerEventFrame
      title: 有序 Session 事件
      payload:
        $ref: '#/components/schemas/AnyEventFrame'
      examples:
        - name: 文本增量
          payload:
            type: event
            event: message.updated
            seq: 7
            payload:
              agent_id: agent-a
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              run_id: run-01
              message_id: message-01
              run_seq: 7
              content_index: 0
              timestamp: '2026-07-30T08:00:01Z'
              update:
                type: text_delta
                delta: 已发货
        - name: run 已完成
          payload:
            type: event
            event: run.completed
            seq: 24
            payload:
              agent_id: agent-a
              session_id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              run_id: run-01
              run_seq: 24
              timestamp: '2026-07-30T08:00:03Z'
              outcome: done
              stop_reason: stop
              usage:
                input_tokens: 230
                output_tokens: 48
                total_tokens: 278
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
    ConnectionId:
      allOf:
        - $ref: '#/components/schemas/Identifier'
      description: |
        CampusClaw 为当前物理 WebSocket 连接生成的标识。重连后变化，只用于
        传输诊断和连接级序列，不作为 Session、消息或 run 的持久归属键。
    SessionId:
      allOf:
        - $ref: '#/components/schemas/Identifier'
      description: |
        上层会话服务创建和管理的不透明持久上下文标识。在一个 CampusClaw
        Runtime 部署范围内全局唯一；新会话使用新值，删除后不得复用。推荐
        使用 UUIDv7 或 ULID，不接受仅在某个 tenant 或 user 内唯一的短 ID。
    AgentId:
      allOf:
        - $ref: '#/components/schemas/Identifier'
      description: |
        Agent Manager 管理的 Agent 标识。Runtime Session 创建后固定绑定，
        恢复时必须与已保存绑定一致。
    ModelId:
      allOf:
        - $ref: '#/components/schemas/Identifier'
      description: |
        Model Manager 管理的模型标识。Session 保存当前有效值，每个 run 固化
        实际使用值；仅在没有 active run 时允许切换。
    MessageId:
      allOf:
        - $ref: '#/components/schemas/Identifier'
      description: CampusClaw 为一条持久化消息生成的标识。
    RunId:
      allOf:
        - $ref: '#/components/schemas/Identifier'
      description: CampusClaw 为一次模型和工具执行生成的标识，跨连接恢复保持不变。
    ToolCallId:
      allOf:
        - $ref: '#/components/schemas/Identifier'
      description: |
        一个 run 内某次 Tool 调用的局部关联标识。它关联模型生成的 toolcall
        内容与 Tool Manager 执行事件，不参与 Session 路由。
    RequestId:
      type: string
      minLength: 1
      maxLength: 128
    TraceParent:
      type: string
      minLength: 55
      maxLength: 128
      pattern: '^(?!ff-)[0-9a-f]{2}-(?!00000000000000000000000000000000-)[0-9a-f]{32}-(?!0000000000000000-)[0-9a-f]{16}-[0-9a-f]{2}(?:-.+)?$'
      description: |
        可选 W3C Trace Context traceparent。Schema 只执行长度、基础字符和
        非零 ID 预检；服务端仍必须使用标准解析器校验版本相关规则、
        trace-id、parent-id 和 flags，非法值返回 INVALID_REQUEST。该值只用于
        遥测和下游 Manager 调用，不写入 Prompt、JSONL 或业务事件。
    IdempotencyKey:
      type: string
      minLength: 8
      maxLength: 128
    Timestamp:
      type: string
      format: date-time
    ThinkingLevel:
      type: string
      enum:
        - hidden
        - summary
        - full
    ClientInfo:
      type: object
      additionalProperties: false
      required:
        - id
        - version
        - platform
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        version:
          type: string
          minLength: 1
          maxLength: 64
        platform:
          type: string
          enum:
            - cli
            - sdk
            - service
            - other
    ClientCapabilities:
      type: array
      minItems: 1
      uniqueItems: true
      description: |
        客户端声明自己可理解的能力。structured_message_delta 是协议 v2
        的必需能力；未知能力允许出现以支持前向兼容，但服务端必须忽略且不得
        在有效 capabilities 中回显。
      contains:
        const: structured_message_delta
      items:
        type: string
        minLength: 1
        maxLength: 128
    SessionConnectMode:
      type: string
      enum:
        - create
        - resume
      description: |
        create 表示上层服务已分配新的 session_id，并要求幂等建立 Runtime
        Session；resume 表示只能恢复已有 Session，缺失时返回 SESSION_NOT_FOUND。
    ConnectParams:
      type: object
      additionalProperties: false
      description: |
        session_id 始终由上层会话服务提供并保证全局唯一。create 对相同
        session_id、Agent 和 Model 的重试保持幂等；resume 不创建缺失或已
        删除的 Session。Agent 绑定创建后不可改变，resume 中不同的 model_id
        只在没有 active run 时表示切换。
      required:
        - mode
        - min_protocol
        - max_protocol
        - agent_id
        - session_id
        - client
        - capabilities
      properties:
        mode:
          $ref: '#/components/schemas/SessionConnectMode'
        min_protocol:
          type: integer
          minimum: 1
        max_protocol:
          type: integer
          minimum: 1
        agent_id:
          $ref: '#/components/schemas/AgentId'
        session_id:
          $ref: '#/components/schemas/SessionId'
        model_id:
          $ref: '#/components/schemas/ModelId'
          description: create 时必填；resume 时可省略、沿用或显式请求切换。
        client:
          $ref: '#/components/schemas/ClientInfo'
        capabilities:
          $ref: '#/components/schemas/ClientCapabilities'
      allOf:
        - if:
            properties:
              mode:
                const: create
          then:
            required:
              - model_id
    ConnectRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
        - params
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: connect
        params:
          $ref: '#/components/schemas/ConnectParams'
    ChatSendParams:
      type: object
      additionalProperties: false
      required:
        - message
        - idempotency_key
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1048576
        attachment_ids:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Identifier'
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
        thinking:
          $ref: '#/components/schemas/ThinkingLevel'
    ChatSendRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
        - params
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: chat.send
        params:
          $ref: '#/components/schemas/ChatSendParams'
    ChatSteerParams:
      type: object
      additionalProperties: false
      required:
        - run_id
        - message
        - idempotency_key
      properties:
        run_id:
          $ref: '#/components/schemas/RunId'
        message:
          type: string
          minLength: 1
          maxLength: 1048576
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
    ChatSteerRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
        - params
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: chat.steer
        params:
          $ref: '#/components/schemas/ChatSteerParams'
    ChatAbortParams:
      type: object
      additionalProperties: false
      required:
        - run_id
        - idempotency_key
      properties:
        run_id:
          $ref: '#/components/schemas/RunId'
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
    ChatAbortRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
        - params
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: chat.abort
        params:
          $ref: '#/components/schemas/ChatAbortParams'
    CursorPageParams:
      type: object
      additionalProperties: false
      properties:
        cursor:
          type: string
          minLength: 1
          maxLength: 1024
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
    ChatHistoryRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: chat.history
        params:
          $ref: '#/components/schemas/CursorPageParams'
    SessionGetRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: session.get
    ModelsListRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: models.list
    ModelSetParams:
      type: object
      additionalProperties: false
      required:
        - model_id
      properties:
        model_id:
          $ref: '#/components/schemas/ModelId'
    ModelSetRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
        - params
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: model.set
        params:
          $ref: '#/components/schemas/ModelSetParams'
    ThinkingSetParams:
      type: object
      additionalProperties: false
      required:
        - level
      properties:
        level:
          $ref: '#/components/schemas/ThinkingLevel'
    ThinkingSetRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
        - params
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: thinking.set
        params:
          $ref: '#/components/schemas/ThinkingSetParams'
    PromptTemplatesListRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: prompt_templates.list
        params:
          $ref: '#/components/schemas/CursorPageParams'
    SkillsListRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - method
      properties:
        type:
          const: req
        id:
          $ref: '#/components/schemas/RequestId'
        traceparent:
          $ref: '#/components/schemas/TraceParent'
        method:
          const: skills.list
    AnyRequestFrame:
      oneOf:
        - $ref: '#/components/schemas/ConnectRequest'
        - $ref: '#/components/schemas/ChatSendRequest'
        - $ref: '#/components/schemas/ChatSteerRequest'
        - $ref: '#/components/schemas/ChatAbortRequest'
        - $ref: '#/components/schemas/ChatHistoryRequest'
        - $ref: '#/components/schemas/SessionGetRequest'
        - $ref: '#/components/schemas/ModelsListRequest'
        - $ref: '#/components/schemas/ModelSetRequest'
        - $ref: '#/components/schemas/ThinkingSetRequest'
        - $ref: '#/components/schemas/PromptTemplatesListRequest'
        - $ref: '#/components/schemas/SkillsListRequest'
    ModelSummary:
      type: object
      additionalProperties: false
      required:
        - model_id
        - name
      properties:
        model_id:
          $ref: '#/components/schemas/ModelId'
        name:
          type: string
          minLength: 1
          maxLength: 256
        reasoning:
          type: boolean
        context_window:
          type: integer
          minimum: 1
        max_output_tokens:
          type: integer
          minimum: 1
    SessionSummary:
      type: object
      additionalProperties: false
      required:
        - state
        - thinking
      properties:
        state:
          type: string
          enum:
            - idle
            - running
        thinking:
          $ref: '#/components/schemas/ThinkingLevel'
    ConnectionLimits:
      type: object
      additionalProperties: false
      required:
        - max_frame_bytes
        - max_connection_buffer_bytes
        - heartbeat_seconds
        - connect_timeout_seconds
      properties:
        max_frame_bytes:
          type: integer
          minimum: 1024
          default: 1048576
        max_connection_buffer_bytes:
          type: integer
          minimum: 1024
          default: 4194304
        heartbeat_seconds:
          type: integer
          minimum: 1
          default: 20
        connect_timeout_seconds:
          type: integer
          minimum: 1
          default: 5
    NegotiatedMethods:
      type: array
      minItems: 1
      uniqueItems: true
      description: |
        当前连接可发现的方法，按本 Schema 中的枚举顺序稳定输出。该列表只反映
        粗粒度身份、Agent 配置和服务能力，不替代每次请求的状态及权限校验。
      items:
        type: string
        enum:
          - chat.send
          - chat.steer
          - chat.abort
          - chat.history
          - session.get
          - models.list
          - model.set
          - thinking.set
          - prompt_templates.list
          - skills.list
    NegotiatedEvents:
      type: array
      minItems: 1
      uniqueItems: true
      description: 当前连接可接收的事件族，按本 Schema 中的枚举顺序稳定输出。
      items:
        type: string
        enum:
          - run.started
          - message.started
          - message.updated
          - tool.started
          - tool.updated
          - tool.completed
          - message.completed
