x-websocket:
  dataMessages:
    acceptedType: text
    encoding: UTF-8
    mapping: one complete WebSocket Text Message contains exactly one JSON RequestFrame, ResponseFrame, or EventFrame
    fragmentation: allowed; size is checked after reassembly and decompression
    binaryMessageCloseCode: 1003
    invalidUtf8OrJsonCloseCode: 1007
  handshake:
    clientUri: wss://api.example.com/agent-service/v1/ws/chat
    conceptualHttpTarget: https://api.example.com/agent-service/v1/ws/chat
    http11Method: GET
    requiredHttp11Headers:
      - 'Connection: Upgrade'
      - 'Upgrade: websocket'
      - 'Sec-WebSocket-Version: 13'
      - 'Sec-WebSocket-Key: <random-base64-key>'
    serviceAuthentication: existing private gateway authentication, completed before HTTP 101; private headers, claims and key formats are intentionally not specified here
    successStatus: 101
    websocketEstablishedAt: HTTP 101 response accepted
    preUpgradeFailureStatuses:
      - 400
      - 401
      - 403
      - 426
    firstApplicationFrame: connect RequestFrame
    connectionSequence:
      - parse wss URI
      - resolve DNS and open one TCP connection to port 443
      - complete TLS
      - send HTTP WebSocket Upgrade on the same connection
      - accept HTTP 101 Switching Protocols
      - exchange WebSocket Frames on the same TCP/TLS connection
    description: |
      调用方使用 `wss://api.example.com/agent-service/v1/ws/chat` 请求建立
      安全 WebSocket。
      客户端库先建立 TCP/TLS 连接，再通过 HTTP WebSocket opening handshake
      协商切换协议；服务端返回 101 后，WebSocket 才正式建立。

      客户端库先解析 DNS 并建立一条 TCP 连接，再在该连接上完成 TLS、
      HTTP Upgrade 和后续 WebSocket Frame 传输。https 形式只用于说明 opening
      handshake 的 HTTP 视角，不定义 RESTful API，也不要求建立第二条连接。

      服务端在 101 之前使用 HTTP status 表达认证、请求或 Upgrade 失败；101
      之后使用 ResponseFrame、EventFrame 或 WebSocket close code 表达协议和
      应用结果。HTTP Upgrade 只建立 WebSocket 传输，调用方随后发送的首个
      connect RequestFrame 才创建或恢复 CampusAgent Runtime Session 并绑定当前连接。

      该握手方式使调用方和服务端复用 443、TLS、HTTP 路由、代理、防火墙和
      认证设施，同时在同一条连接上明确完成从 HTTP 到 WebSocket Frame 的
      切换。公开 Gateway 和 agent-service 都使用完整路径
      `/agent-service/v1/ws/chat`，本协议不定义前缀剔除。入站凭据只形成
      不可变连接认证上下文，不得原样传给 Model Manager 或 Tool Manager；
      agent-service 调用内部服务时按现有能力生成面向目标服务的新
      access-token。任何凭据都不得进入 Prompt、RuntimeSessionStore、Frame
      或应用日志。
  firstFrameTimeoutSeconds: 5
  pingPongIntervalSeconds: 20
  pongTimeoutSeconds: 10
  defaultMaxMessageBytes: 1048576
  defaultMaxConnectionBufferBytes: 4194304
  requestConcurrency:
    connectMustCompleteFirst: true
    requestIdUniqueForConnectionLifetime: true
    concurrentRequestsAfterConnect: true
    responsesMayBeOutOfOrder: true
    responsesAndEventsMayInterleave: true
    stateChangingSuccessResponseBeforeCausalEvents: true
    description: |
      任何改变 Session 或 run 状态的命令都必须先向当前连接成功写出
      ResponseFrame，再写出由该变更引起的 EventFrame。这包括 chat.send
      的 run.started、chat.steer 触发的后续 Message 更新和 chat.abort 触发的
      终态事件。响应写出失败不回滚已持久的幂等结果，调用方重连后
      通过原 idempotency_key 或 chat.history 对账。
  sessionConnection:
    activeReadWriteConnectionsPerSessionPerPod: 1
    resumeTakesOverExistingConnection: true
    connectionGeneration: monotonically increases within the owning Pod
    replacedConnectionCloseCode: 4409
    replacedConnectionReason: SESSION_REPLACED
    description: |
      mode=create 首次成功时建立初始 connection_generation，但不具有主动
      替换现有活动连接的语义；网络丢失响应后仍按 ConnectParams 的规则幂等
      重试 create。只有新的 mode=resume 可以原子递增 generation、接管
      同一 Pod 内的 Session 读写权并关闭旧连接。接管后，只有新连接可以
      读写该 Session，旧连接不得再接收事件或执行请求。此代次只解决
      同 Pod 并发，不是跨 Pod 分布式所有权。
  deploymentRouting:
    strategy: trusted gateway user-IP affinity
    distributedOwner: false
    redisCoordination: false
    crossPodForwarding: false
    sessionRoutingHeader: false
    description: |
      多副本服务 API v1 依赖可信网关按有效用户 IP 将同一调用方稳定路由到
      同一 Pod。本规范不定义私有路由 Header，也不使用 Redis、分布式
      owner 或跨 Pod 转发。如果网关只能看到 mate-service/NAT IP、用户 IP
      改变、粘性失效或 Pod 重启，active run 就无法在另一 Pod 继续。
      这是 v1 的明确可用性限制，不得在客户端文档中表述为跨 Pod 无缝恢复。
  recovery:
    clientCursorInConnect: false
    description: |
      调用方不提交旧连接 seq 或 run_seq。只有重连仍路由到持有 active
      run 的同一 Pod 时，服务端才在 resume connect 中原子接管连接、
      生成 active_run 快照和 cursor，先写出 ResponseFrame，再发送 run_seq
      大于快照值的 EventFrame。客户端先缓冲这些 EventFrame，使用快照的
      run_id 和 history_seq 读完当前 run 已持久化的历史，再应用 partial
      Message、open contents 与 active tools，最后按 run_seq 释放缓冲事件。

      canonical thinking 事件如果被当前连接投影抑制，服务端仍发送
      thinking_redacted 占位，所以 run_seq 不会因 full/summary/hidden 而出现缺口。
      调用方观察到 seq/run_seq 缺口、1001、1006、1011 或 1013 时，使用带抖动的
      指数退避重新连接并执行 mode=resume。如果请求被路由到不持有原
      run 的其他 Pod，该 Pod 不能返回 active_run 快照，也不得仅因本地缺少
      run 就将数据库终态改为 interrupted；它可以使用 1013 关闭尚未绑定的
      连接，要求调用方按部署粘性策略退避后重试。MANAGER_UNAVAILABLE 只表示
      真实的 Manager 依赖故障，不得用作错 Pod 路由信号。只在确认 Pod 已重启且
      原进程无法继续 run 时，服务端
      才从 RuntimeSessionStore 重建 AgentSession/Agent，将旧 run 和已经到达完整
      内容块边界的消息标记为 interrupted；未到 text_end、thinking_end 或
      toolcall_end 的尾部不承诺持久化或恢复。调用方通过 chat.history
      读取权威 interrupted 终态。
  closeCodes:
    '1000': 正常关闭；默认不自动恢复，关闭前若要终止 run 必须先调用 chat.abort
    '1001': 服务端关闭或 Ping/Pong 超时；退避后 resume
    '1002': 不支持的协议版本
    '1003': 收到 Binary Message；改为 UTF-8 Text Message 后再连接
    '1007': Text Message 不是合法 UTF-8 JSON；修复客户端编码后再连接
    '1008': connect 超时或违反连接策略
    '1009': 重组并解压后的 WebSocket Message 超过协商上限
    '1011': 服务端暂时性内部错误；退避后 resume
    '1013': 消费端过慢，或未绑定连接未路由到持有 active run 的 Pod；退避后按部署粘性策略 resume
    '1006': 仅为调用方观察到的异常断开，不能在线上 Close Frame 中发送；退避后 resume
    '4409': SESSION_REPLACED；同一 Pod 内新 resume 已接管 Session，旧连接必须停止读写
x-runtime-persistence:
  store: RuntimeSessionStore
  medium: database
  sessionFilePersistence: false
  physicalSchema: separately designed
  logicalRecords:
    - Session
    - Message
    - RunRecord
    - history sequence
    - idempotency result
    - Agent revision
    - Model revision
    - runtime bundle revision
    - attachment metadata snapshot
    - complete redacted oversized tool value
  description: |
    目标设计的 Session 权威状态完全保存在数据库中，不生成 Session
    文件。RuntimeSessionStore 是逻辑端口；物理表、索引、事务和
    保留策略另行设计。凭据、OBS Bucket、预签名 URL、内部 Header
    和执行器秘密
    不得持久化。每个状态变更的幂等结果必须与对应 Session
    状态在同一原子提交中对外可见。
x-attachments:
  transport: reference-only
  websocketField: chat.send.params.attachment_ids
  websocketCapabilityRequired: false
  uploadOwner: mate-service Attachment Service
