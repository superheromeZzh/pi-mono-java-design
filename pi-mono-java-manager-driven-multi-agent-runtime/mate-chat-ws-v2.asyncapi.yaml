    内部创建失败不得暴露私有标识，返回 RUNTIME_UNAVAILABLE，并由同一幂等键
    的后续重试继续对账或补偿。
x-hop-boundary:
  publicOwner: mate-service
  internalOwner: agent-service
  publicChatIdentifier: chat_id
  privateRuntimeIdentifierExposed: false
  hopLocalFields:
    - connection_id
    - connection_generation
    - RequestFrame.id
    - EventFrame.seq
    - authentication context
    - Ping/Pong
    - flow-control buffer
  bridgeableBusinessFields:
    - idempotency_key
    - run_id
    - message_id
    - run_seq
    - trace context propagated as a child span
  description: |
    mate-service 必须解析公共 Frame、执行用户与 Chat 授权、运行安全护栏和会话
    编排。该 WebSocket 固定为 Agent Channel：通过前置检查并被接受的 chat.send
    必须构造内部 RequestFrame；非 Agent 分支在接受前返回公共错误，不生成 run。
    内部 Response/Event 也必须先校验、映射错误。内部
    MANAGER_AUTH_FAILED 和 MANAGER_UNAVAILABLE 对公共调用方统一投影为
    脱敏的 RUNTIME_UNAVAILABLE，不披露 Manager 类型或上游响应。
    移除私有字段并重建公共 Frame。禁止把两个 WebSocket 当成一条透明隧道；
    两跳的连接 ID、请求 ID、seq、generation、认证、心跳和背压互不复用。
x-delivery-ordering:
  stateChangingSuccessResponseBeforeCausalEvent: true
  description: |
    本顺序约束只适用于已被 agent-service 接受的 Runtime 分支。
    CHANNEL_NOT_APPLICABLE 在接受前返回，不保存公共 Chat Message、
    不分配 run_id/user_message_id，也不触发因果事件。
    mate-service 只有在内部命令被接受并把公共幂等结果持久化后，才写出公共成功
    ResponseFrame；该 ResponseFrame 必须先于由此命令触发的公共 EventFrame。
    如果内部事件先到，Bridge 先按有界缓冲暂存；成功 Response 写出后再按序释放。
    响应写出失败不回滚已接受操作，客户端通过幂等键和历史恢复。
x-bridge-recovery:
  publicDisconnectAbortsRun: false
  internalDisconnectAbortsRun: false
  authoritativeSources:
    - mate-service Chat record and idempotency result
    - agent-service Runtime history and active-run snapshot
  description: |
    公共连接关闭只解除该 UI 的订阅，不隐式调用 chat.abort。mate-service 可以
    关闭对应内部连接，但 agent-service 继续持有已接受的 active run。公共
    resume 只提交 chat_id；mate-service 读取私有映射，建立新的内部 resume，
    原子取得 active-run 快照和 Runtime 历史水位，再生成新的公共 connect
    快照。公共 EventFrame.seq 从 1 重新开始，run_seq 跨两跳重连连续。

    内部连接出现 seq/run_seq 缺口时，mate-service 停止向公共连接应用可疑事件，
    重连内部 Runtime 并用快照、history_seq 和权威历史对账；对账完成前的新事件
    先缓冲。若暂时无法恢复，公共请求返回 RUNTIME_UNAVAILABLE 或用 1013 关闭
    当前订阅并要求 resume，不得伪造累计文本或泄漏内部路由信息。没有分布式
    run owner 时，不承诺跨 agent-service Pod 无缝继续 active run。
x-websocket:
  handshake:
    clientUri: wss://api.example.com/mate-service/v1/ws/chat
    conceptualHttpTarget: https://api.example.com/mate-service/v1/ws/chat
    firstApplicationFrame: connect RequestFrame
    firstFrameTimeoutSeconds: 5
    successStatus: 101
    rejectBusinessQueryParameters: true
    rejectUrlTokens: true
    authenticateBefore101: true
    validateOriginBefore101: true
    description: |
      调用方使用 wss URI 请求建立安全 WebSocket。客户端库建立 TCP/TLS 后，在
      同一连接上发送 HTTP opening handshake；HTTP 101 之后才交换 WebSocket
      Frame。https 形式只表示握手视角，不是 REST API，也不是第二条连接。
  dataMessages:
    acceptedType: text
    encoding: UTF-8
    mapping: one complete WebSocket Text Message contains exactly one JSON Frame
    binaryMessageCloseCode: 1003
    invalidUtf8OrJsonCloseCode: 1007
  limits:
    defaultMaxMessageBytes: 1048576
    defaultMaxConnectionBufferBytes: 4194304
    pingIntervalSeconds: 20
    pongTimeoutSeconds: 10
    slowConsumerCloseCode: 1013
  connectionTakeover:
    activeReadWriteConnectionsPerChat: 1
    resumeTakesOverExistingConnection: true
    replacedConnectionCloseCode: 4409
    replacedConnectionReason: CHAT_REPLACED
  closeCodes:
    '1000': 正常关闭；不会隐式 abort
    '1001': 服务端关闭或心跳超时；退避后 resume
    '1002': Frame 协议不兼容
    '1003': 收到 Binary Message
    '1007': Text Message 不是合法 UTF-8 JSON
    '1008': connect 超时或连接策略错误
    '1009': 完整 Text Message 超过协商上限
    '1011': 暂时性内部错误；退避后 resume
    '1013': 消费过慢或 Bridge 暂时无法恢复；退避后 resume
    '4409': CHAT_REPLACED；新的 resume 已接管公共 Chat 连接
