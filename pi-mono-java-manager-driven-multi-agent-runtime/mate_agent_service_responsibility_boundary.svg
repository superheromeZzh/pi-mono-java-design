<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="536px" preserveAspectRatio="none" style="width:1988px;height:536px;background:#FFFFFF;" version="1.1" viewBox="0 0 1988 536" width="1988px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="89"><text fill="#0F172A" font-family="Arial" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="330.6338" x="825.5308" y="23.1318">Public Chat and Runtime Service Responsibilities</text></g><!--entity UI--><g class="entity" data-qualified-name="UI" data-source-line="120" id="ent0001"><rect fill="#EFF6FF" height="132.6904" rx="9" ry="9" style="stroke:#94A3B8;stroke-width:0.5;" width="291.626" x="7" y="237.1986"/><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="54.4756" x="17" y="260.3305">Agent UI</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="17" y="276.4291">&#160;</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="150.1924" x="17" y="292.5277">Open public WebSocket</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="271.626" x="17" y="308.6264">Send agent_id, model_id, idempotency_key</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="81.7305" x="17" y="324.725">Keep chat_id</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="171.1855" x="17" y="340.8236">Render public Chat Frames</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="17" y="356.9223">Never receive session_id</text></g><!--entity Mate--><g class="entity" data-qualified-name="Mate" data-source-line="122" id="ent0002"><rect fill="#FFF7ED" height="197.085" rx="9" ry="9" style="stroke:#94A3B8;stroke-width:0.5;" width="314.1709" x="602.95" y="205.0086"/><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="80.1309" x="612.95" y="228.1405">mate-service</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="612.95" y="244.2391">&#160;</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="294.1709" x="612.95" y="260.3377">Own public WebSocket and user authentication</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="267.7295" x="612.95" y="276.4364">Validate protocol and connect idempotency</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="217.8955" x="612.95" y="292.535">Enforce fewer than 50 active Chats</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="279.3984" x="612.95" y="308.6336">Validate product Agent and Model availability</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="204.6953" x="612.95" y="324.7323">Generate chat_id and session_id</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="202.3301" x="612.95" y="340.8309">Persist Chat mapping and status</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="228.8125" x="612.95" y="356.9295">Run guardrail, intent, and chain state</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="270.0127" x="612.95" y="373.0282">Own the internal Runtime WebSocket client</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="216.3369" x="612.95" y="389.1268">Rebuild public and internal Frames</text></g><!--entity Agent--><g class="entity" data-qualified-name="Agent" data-source-line="124" id="ent0003"><rect fill="#ECFDF5" height="164.8877" rx="9" ry="9" style="stroke:#94A3B8;stroke-width:0.5;" width="290.833" x="1271.3" y="44.0986"/><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="84.041" x="1281.3" y="67.2305">agent-service</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="1281.3" y="83.3291">&#160;</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="210.0889" x="1281.3" y="99.4277">Own internal Runtime WebSocket</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="192.999" x="1281.3" y="115.5264">Authenticate the calling service</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="249.8193" x="1281.3" y="131.625">Authoritatively validate Agent and Model</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="215.5371" x="1281.3" y="147.7236">Create or restore Runtime Session</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="243.6055" x="1281.3" y="163.8223">Bind Agent, Model, and bundle revision</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="270.833" x="1281.3" y="179.9209">Build Context and execute Model and Tools</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="255.2266" x="1281.3" y="196.0195">Own Run, Message, and Runtime history</text></g><!--entity MateStore--><g class="entity" data-qualified-name="MateStore" data-source-line="126" id="ent0004"><path d="M1321.51,328.7486 C1321.51,318.7486 1416.7234,318.7486 1416.7234,318.7486 C1416.7234,318.7486 1511.9368,318.7486 1511.9368,328.7486 L1511.9368,434.3404 C1511.9368,444.3404 1416.7234,444.3404 1416.7234,444.3404 C1416.7234,444.3404 1321.51,444.3404 1321.51,434.3404 L1321.51,328.7486" fill="#F8FAFC" style="stroke:#94A3B8;stroke-width:0.5;"/><path d="M1321.51,328.7486 C1321.51,338.7486 1416.7234,338.7486 1416.7234,338.7486 C1416.7234,338.7486 1511.9368,338.7486 1511.9368,328.7486" fill="none" style="stroke:#94A3B8;stroke-width:0.5;"/><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="101.9375" x="1331.51" y="355.8805">Mate Chat Store</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="1331.51" y="371.9791">&#160;</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="131.9131" x="1331.51" y="388.0777">chat_id -&gt; session_id</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="63.8135" x="1331.51" y="404.1764">Chat state</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="164.999" x="1331.51" y="420.275">Agent and Model selection</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="170.4268" x="1331.51" y="436.3736">connect idempotency result</text></g><!--entity RuntimeStore--><g class="entity" data-qualified-name="RuntimeStore" data-source-line="128" id="ent0005"><path d="M1732,81.7986 C1732,71.7986 1847.8477,71.7986 1847.8477,71.7986 C1847.8477,71.7986 1963.6953,71.7986 1963.6953,81.7986 L1963.6953,171.2918 C1963.6953,181.2918 1847.8477,181.2918 1847.8477,181.2918 C1847.8477,181.2918 1732,181.2918 1732,171.2918 L1732,81.7986" fill="#F8FAFC" style="stroke:#94A3B8;stroke-width:0.5;"/><path d="M1732,81.7986 C1732,91.7986 1847.8477,91.7986 1847.8477,91.7986 C1847.8477,91.7986 1963.6953,91.7986 1963.6953,81.7986" fill="none" style="stroke:#94A3B8;stroke-width:0.5;"/><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="135.3994" x="1742" y="108.9305">RuntimeSessionStore</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="1742" y="125.0291">&#160;</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="84.0479" x="1742" y="141.1277">Session state</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="158.751" x="1742" y="157.2264">Message and Run history</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="211.6953" x="1742" y="173.325">Agent, Model, and bundle revision</text></g><g class="entity" data-qualified-name="GMN10" data-source-line="136" id="ent0011"><path d="M578.63,446.1786 L578.63,512.9223 A9,9 0 0 0 587.63,521.9223 L932.4449,521.9223 A9,9 0 0 0 941.4449,512.9223 L941.4449,447.1786 L931.4449,437.1786 L764.03,437.1786 L760.03,402.5386 L756.03,437.1786 L587.63,437.1786 A9,9 0 0 0 578.63,446.1786" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M931.4449,437.1786 L931.4449,442.6786 A4.5,4.5 0 0 0 935.9449,447.1786 L941.4449,447.1786 L931.4449,437.1786" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.9624" x="584.63" y="454.3725">The bridge is semantic, not byte-transparent.</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="283.2832" x="584.63" y="469.3212">HTTP 101, connection_id, generation, request id,</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="341.8149" x="584.63" y="484.2699">event seq, Ping/Pong, flow control, and close are hop-local.</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="337.4541" x="584.63" y="499.2187">This URL is an Agent Channel: only Runtime-routed sends</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="332.4204" x="584.63" y="514.1674">are accepted; other product channels use other contracts.</text></g><g class="entity" data-qualified-name="GMN13" data-source-line="144" id="ent0014"><path d="M1258.44,252.5986 L1258.44,274.4961 A9,9 0 0 0 1267.44,283.4961 L1565.9996,283.4961 A9,9 0 0 0 1574.9996,274.4961 L1574.9996,253.5986 L1564.9996,243.5986 L1420.72,243.5986 L1416.72,209.4886 L1412.72,243.5986 L1267.44,243.5986 A9,9 0 0 0 1258.44,252.5986" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1564.9996,243.5986 L1564.9996,249.0986 A4.5,4.5 0 0 0 1569.4996,253.5986 L1574.9996,253.5986 L1564.9996,243.5986" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="295.5596" x="1264.44" y="260.7925">Runtime never reads chat_id, tenant_id, or user_id.</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="247.1333" x="1264.44" y="275.7412">It uses session_id as the only Session key.</text></g><!--link UI to Mate--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="130" id="lnk6"><path d="M303.78,303.5486 C395.4,303.5486 503.77,303.5486 597.53,303.5486" fill="none" id="UI-Mate" style="stroke:#64748B;stroke-width:1.5;"/><polygon fill="#64748B" points="298.78,303.5486,307.78,307.5486,303.78,303.5486,307.78,299.5486,298.78,303.5486" style="stroke:#64748B;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon fill="#64748B" points="602.53,303.5486,593.53,299.5486,597.53,303.5486,593.53,307.5486,602.53,303.5486" style="stroke:#64748B;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="105.4917" x="386.0131" y="270.7425">Public WebSocket</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="80.2217" x="398.6481" y="285.6912">chat_id scope</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="218.2578" x="329.63" y="300.6399">public connection, request id, and seq</text></g><!--link Mate to Agent--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="131" id="lnk7"><path d="M922.2568,259.954 C1029.5868,230.944 1161.3433,195.3236 1266.0933,167.0036" fill="none" id="Mate-Agent" style="stroke:#64748B;stroke-width:1.5;"/><polygon fill="#64748B" points="917.43,261.2586,927.1619,262.7717,922.2568,259.954,925.0745,255.0489,917.43,261.2586" style="stroke:#64748B;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon fill="#64748B" points="1270.92,165.6986,1261.188,164.1862,1266.0933,167.0036,1263.2759,171.9089,1270.92,165.6986" style="stroke:#64748B;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="113.4453" x="1043.648" y="146.0425">Internal WebSocket</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="99.728" x="1050.5067" y="160.9912">session_id scope</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="255.8613" x="972.44" y="175.9399">independent connection, request id, and seq</text></g><!--link Mate to MateStore--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="132" id="lnk8"><path d="M917.43,322.1786 C1043.2,337.1686 1210.7951,357.1373 1316.3351,369.7073" fill="none" id="Mate-to-MateStore" style="stroke:#64748B;stroke-width:1.5;"/><polygon fill="#64748B" points="1321.3,370.2986,1312.8362,365.2623,1316.3351,369.7073,1311.8901,373.2062,1321.3,370.2986" style="stroke:#64748B;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="95.4053" x="1052.44" y="325.9725">Own and update</text></g><!--link Agent to RuntimeStore--><g class