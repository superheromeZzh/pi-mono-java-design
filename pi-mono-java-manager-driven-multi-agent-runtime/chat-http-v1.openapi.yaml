openapi: 3.1.0
info:
  title: CampusAgent 内部 Runtime HTTP API
  version: 1.1.0
  description: |
    CampusAgent Runtime 面向 mate-service Runtime bridge 和获授权内部 SDK 的
    HTTP API。它是一组 Session、Run、Event、History 和 Model 资源接口，
    不是 WebSocket Frame RPC 的单接口包装。
  contact:
    name: CampusAgent
  license:
    name: MIT
    identifier: MIT
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://agent-service.internal/agent-service/internal/v1
    description: 生产内部 Gateway
  - url: http://localhost:3000/agent-service/internal/v1
    description: 本地开发
security:
  - internalGateway: []
tags:
  - name: Sessions
    description: Runtime Session 生命周期
  - name: Runs
    description: 用户消息、异步 Run 与运行控制
  - name: Events
    description: Run 实时事件和补拉
  - name: History
    description: 数据库权威 Message 与 RunRecord 历史
  - name: Models
    description: Session-scoped 模型发现和配置
