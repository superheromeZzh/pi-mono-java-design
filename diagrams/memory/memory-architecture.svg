458.0234">GaussDB Persistence Adapter</text></g><!--entity runtime--><g class="entity" data-qualified-name="runtime" data-source-line="18" id="ent0001"><ellipse cx="194.9629" cy="57.9883" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M194.9629,65.9883 L194.9629,92.9883 M181.9629,73.9883 L207.9629,73.9883 M194.9629,92.9883 L181.9629,107.9883 M194.9629,92.9883 L207.9629,107.9883" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="100.9258" x="144.5" y="123.0234">Agent Runtime</text></g><!--entity release--><g class="entity" data-qualified-name="release" data-source-line="19" id="ent0002"><ellipse cx="870.8984" cy="550.9883" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M870.8984,558.9883 L870.8984,585.9883 M857.8984,566.9883 L883.8984,566.9883 M870.8984,585.9883 L857.8984,600.9883 M870.8984,585.9883 L883.8984,600.9883" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="271.7969" x="735" y="616.0234">CampusClaw Database Release Platform</text></g><!--entity db--><g class="entity" data-qualified-name="db" data-source-line="33" id="ent0011"><path d="M353,710.9883 C353,700.9883 456.9736,700.9883 456.9736,700.9883 C456.9736,700.9883 560.9473,700.9883 560.9473,710.9883 L560.9473,752.9648 C560.9473,762.9648 456.9736,762.9648 456.9736,762.9648 C456.9736,762.9648 353,762.9648 353,752.9648 L353,710.9883" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M353,710.9883 C353,720.9883 456.9736,720.9883 456.9736,720.9883 C456.9736,720.9883 560.9473,720.9883 560.9473,710.9883" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="141.3809" x="363" y="738.5234">Centralized GaussDB</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="187.9473" x="363" y="755.0117">CampusClaw Session tables</text></g><g class="entity" data-qualified-name="GMN21" data-source-line="46" id="ent0022"><path d="M579.5,673.4883 L579.5,727.9883 L561.0098,731.9883 L579.5,735.9883 L579.5,790.6621 A0,0 0 0 0 579.5,790.6621 L916.4736,790.6621 A0,0 0 0 0 916.4736,790.6621 L916.4736,683.4883 L906.4736,673.4883 L579.5,673.4883 A0,0 0 0 0 579.5,673.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M906.4736,673.4883 L906.4736,683.4883 L916.4736,683.4883 L906.4736,673.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="312.749" x="585.5" y="691.0566">The application schema has seven Session tables.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.2422" x="585.5" y="706.3672">Table names use the t_ prefix.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.355" x="585.5" y="721.6777">Columns, keys, indexes, and transaction behavior</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.27" x="585.5" y="736.9883">preserve the mapped pi Session semantics.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.3472" x="585.5" y="752.2988">IDs use VARCHAR(128), types use VARCHAR(64),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.8394" x="585.5" y="767.6094">cwd uses VARCHAR(512), sequences use BIGINT,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315.9736" x="585.5" y="782.9199">time uses TIMESTAMPTZ(3), and JSON uses JSONB.</text></g><g class="entity" data-qualified-name="GMN24" data-source-line="56" id="ent0025"><path d="M934.5,696.4883 L934.5,767.7305 A0,0 0 0 0 934.5,767.7305 L1345.3921,767.7305 A0,0 0 0 0 1345.3921,767.7305 L1345.3921,706.4883 L1335.3921,696.4883 L1081.6581,696.4883 L937.84,618.6354 L1073.6581,696.4883 L934.5,696.4883 A0,0 0 0 0 934.5,696.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1335.3921,696.4883 L1335.3921,706.4883 L1345.3921,706.4883 L1335.3921,696.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.1211" x="940.5" y="714.0566">This release component is target-only.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.6465" x="940.5" y="729.3672">It is the only schema upgrade authority.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="331.8936" x="940.5" y="744.6777">The concrete migration product is not selected here.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="389.8921" x="940.5" y="759.9883">Its history and lock metadata are outside the Session schema.</text></g><g class="entity" data-qualified-name="GMN27" data-source-line="63" id="ent0028"><path d="M11.5,711.4883 L11.5,752.1094 A0,0 0 0 0 11.5,752.1094 L334.0391,752.1094 A0,0 0 0 0 334.0391,752.1094 L334.0391,721.4883 L324.0391,711.4883 L178.7204,711.4883 L184.5087,598.6378 L170.7204,711.4883 L11.5,711.4883 A0,0 0 0 0 11.5,711.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M324.0391,711.4883 L324.0391,721.4883 L334.0391,721.4883 L324.0391,711.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="301.5391" x="17.5" y="729.0566">AgentService does not create a migrations table</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.0122" x="17.5" y="744.3672">and does not execute DDL at startup.</text></g><!--entity app--><g class="entity" data-qualified-name="Java Session Layer.app" data-source-line="22" id="ent0004"><rect fill="#F1F1F1" height="36.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="262.9902" x="63.5" y="179.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="242.9902" x="73.5" y="203.0234">Memory Session Application Service</text></g><!--entity repository--><g class="entity" data-qualified-name="Java Session Layer.repository" data-source-line="23" id="ent0005"><rect fill="#F1F1F1" height="36.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="147.5039" x="22" y="270.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="127.5039" x="32" y="294.0234">Session Repository</text></g><!--entity storage--><g class="entity" data-qualified-name="Java Session Layer.storage" data-source-line="24" id="ent0006"><rect fill="#F1F1F1" height="36.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="126.7432" x="188.5" y="270.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="106.7432" x="198.5" y="294.0234">Session Storage</text></g><!--entity queue--><g class="entity" data-qualified-name="Java Session Layer.queue" data-source-line="25" id="ent0007"><rect fill="#F1F1F1" height="36.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="181.7314" x="95" y="361.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="161.7314" x="105" y="385.0234">Repository Serial Queue</text></g><!--entity tx--><g class="entity" data-qualified-name="GaussDB Persistence Adapter.tx" data-source-line="29" id="ent0009"><rect fill="#F1F1F1" height="36.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="210.4834" x="81