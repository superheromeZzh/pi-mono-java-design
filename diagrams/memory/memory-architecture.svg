" x="583" y="458.0234">GaussDB JDBC Adapter</text></g><!--entity runtime--><g class="entity" data-qualified-name="runtime" data-source-line="16" id="ent0001"><ellipse cx="543.9629" cy="57.9883" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M543.9629,65.9883 L543.9629,92.9883 M530.9629,73.9883 L556.9629,73.9883 M543.9629,92.9883 L530.9629,107.9883 M543.9629,92.9883 L556.9629,107.9883" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="100.9258" x="493.5" y="123.0234">Agent Runtime</text></g><!--entity db--><g class="entity" data-qualified-name="db" data-source-line="31" id="ent0011"><path d="M6,637.9883 C6,627.9883 89.0557,627.9883 89.0557,627.9883 C89.0557,627.9883 172.1113,627.9883 172.1113,637.9883 L172.1113,679.9648 C172.1113,689.9648 89.0557,689.9648 89.0557,689.9648 C89.0557,689.9648 6,689.9648 6,679.9648 L6,637.9883" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M6,637.9883 C6,647.9883 89.0557,647.9883 89.0557,647.9883 C89.0557,647.9883 172.1113,647.9883 172.1113,637.9883" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="141.3809" x="16" y="665.5234">Centralized GaussDB</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="146.1113" x="16" y="682.0117">SQLite-aligned tables</text></g><g class="entity" data-qualified-name="GMN21" data-source-line="44" id="ent0022"><path d="M190.5,615.4883 L190.5,654.9883 L172.125,658.9883 L190.5,662.9883 L190.5,702.041 A0,0 0 0 0 190.5,702.041 L747.02,702.041 A0,0 0 0 0 747.02,702.041 L747.02,625.4883 L737.02,615.4883 L190.5,615.4883 A0,0 0 0 0 190.5,615.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M737.02,615.4883 L737.02,625.4883 L747.02,625.4883 L737.02,615.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.3057" x="196.5" y="633.0566">Tables and columns match SQLite.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.0171" x="196.5" y="648.3672">Only SQLite WITHOUT ROWID syntax is removed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.7324" x="196.5" y="663.6777">Native semantic types and explicit lengths are used.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.3472" x="196.5" y="678.9883">IDs use VARCHAR(128), types use VARCHAR(64),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="535.52" x="196.5" y="694.2988">cwd uses VARCHAR(512), sequences BIGINT, time TIMESTAMPTZ(3), and JSON JSONB.</text></g><g class="entity" data-qualified-name="GMN24" data-source-line="52" id="ent0025"><path d="M765.5,638.4883 L765.5,679.1094 A0,0 0 0 0 765.5,679.1094 L1008.1475,679.1094 A0,0 0 0 0 1008.1475,679.1094 L1008.1475,648.4883 L998.1475,638.4883 L850.5515,638.4883 L722.2956,578.5184 L842.5515,638.4883 L765.5,638.4883 A0,0 0 0 0 765.5,638.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M998.1475,638.4883 L998.1475,648.4883 L1008.1475,648.4883 L998.1475,638.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.395" x="771.5" y="656.0566">No revision, operation, checksum,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.6475" x="771.5" y="671.3672">foreign key, check, or search table.</text></g><!--entity app--><g class="entity" data-qualified-name="Java Session Layer.app" data-source-line="19" id="ent0003"><rect fill="#F1F1F1" height="36.4883" rx="2.5" ry="2.5