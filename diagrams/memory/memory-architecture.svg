roke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.3057" x="196" y="633.0566">Tables and columns match SQLite.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.0171" x="196" y="648.3672">Only SQLite WITHOUT ROWID syntax is removed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.04" x="196" y="663.6777">Native semantic types are used.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285.981" x="196" y="678.9883">Strings use VARCHAR, sequences use BIGINT,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="354.9609" x="196" y="694.2988">timestamps use TIMESTAMPTZ(3), and JSON uses JSONB.</text></g><g class="entity" data-qualified-name="GMN24" data-source-line="52" id="ent0025"><path d="M584.5,638.4883 L584.5,679.1094 A0,0 0 0 0 584.5,679.1094 L827.1475,679.1094 A0,0 0 0 0 827.1475,679.1094 L827.1475,648.4883 L817.1475,638.4883 L678.6524,638.4883 L578.3541,578.5184 L670.6524,638.4883 L584.5,638.4883 A0,0 0 0 0 584.5,638.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M817.1475,638.4883 L817.1475,648.4883 L827.1475,648.4883 L817.1475,638.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.395" x="590.5" y="656.0566">No revision, operation, checksum,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.6475" x="590.5" y="671.3672">foreign key, check, or search table.</text></g><!--entity app--><g class="entity" data-qualified-name="Java Session Layer.app" data-source-line="19" id="ent0003"><rect fill="#F1F1F1" height="36.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="262.9902" x="2